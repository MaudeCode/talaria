name: Skopeo
description: Make skopeo available for loading built OCI archives into Docker and copying them to GHCR.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        if ! command -v skopeo >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
        fi
        skopeo --version
