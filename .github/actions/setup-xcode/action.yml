# Interface (stable; ci.yml and the release workflows share it):
#   uses: ./.github/actions/setup-xcode
#   with:
#     xcode-version: "27.1"   # major.minor; optional, defaults to 27.1
# Selects that Xcode with maxim-lobanov/setup-xcode, then fails unless xcodebuild reports the same major.minor;
# there is no fallback to another version. It prints `xcodebuild -version`, the iOS SDK and the simulator runtimes,
# and exports IOS_SIMULATOR_OS: the newest installed iOS simulator runtime the SDK can run (major.minor). The image
# can ship an SDK without its own runtime (Xcode 27.1's iOS 27.1 SDK beside only the iOS 27.0 runtime), so
# simulator jobs boot and build for that runtime instead of the SDK version.
# First, when the job's environment sets UI_SUITE_QUEUE_ATTEMPT (app-tests.yml in a queued ui-suite.yml run), it
# fails unless that is this attempt: "Re-run failed jobs" skips the passed Queue job, so the retried macOS jobs would
# run beside another suite (TAL-679).
name: Set up Xcode
description: Select an exact Xcode major.minor on a hosted macOS runner and fail if the image lacks it.
inputs:
  xcode-version:
    description: Xcode major.minor to select, for example 27.1.
    required: false
    default: "27.1"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [[ -n "${UI_SUITE_QUEUE_ATTEMPT:-}" && "${UI_SUITE_QUEUE_ATTEMPT}" != "${GITHUB_RUN_ATTEMPT}" ]]; then
          echo "::error::This UI suite attempt skipped its queue: use Re-run all jobs, not Re-run failed jobs."
          exit 1
        fi
    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ inputs.xcode-version }}
    - shell: bash
      env:
        XCODE_VERSION: ${{ inputs.xcode-version }}
      run: |
        set -euo pipefail
        # Read all output: `| head -n 1` closes the pipe early and xcodebuild aborts on the broken pipe.
        actual=$(xcodebuild -version)
        actual=${actual%%$'\n'*}
        [[ "$actual" == "Xcode ${XCODE_VERSION}" || "$actual" == "Xcode ${XCODE_VERSION}."* ]] \
          || { echo "::error::Requested Xcode ${XCODE_VERSION} but xcodebuild reports '${actual}'"; exit 1; }
        echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
        xcodebuild -version
        sdk=$(xcrun --sdk iphoneos --show-sdk-version)
        echo "iOS SDK ${sdk}"
        xcrun simctl list runtimes
        simulator_os=$(xcrun simctl list runtimes --json | jq -er --arg sdk "$sdk" '
          def version: split(".") | map(tonumber) | .[:2];
          [.runtimes[] | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))
           | .version | select(version <= ($sdk | version))] | max_by(version) | version | map(tostring) | join(".")') \
          || { echo "::error::No installed iOS simulator runtime can run the iOS ${sdk} SDK"; exit 1; }
        echo "iOS simulator runtime ${simulator_os}"
        echo "IOS_SIMULATOR_OS=${simulator_os}" >> "$GITHUB_ENV"
