# Interface (stable; ci.yml and the release workflows share it):
#   uses: ./.github/actions/setup-xcode
#   with:
#     xcode-version: "27.1"   # major.minor; optional, defaults to 27.1
# Selects that Xcode with maxim-lobanov/setup-xcode, then fails unless xcodebuild reports the same major.minor;
# there is no fallback to another version. It prints `xcodebuild -version`, the iOS SDK and the simulator runtimes,
# and exports IOS_SIMULATOR_OS: the newest SDK-compatible runtime with the iPhone 17 used by CI and contract jobs.
# The image can ship a newer runtime with only a different device, so build and test select the same usable runtime.
name: Set up Xcode
description: Select an exact Xcode major.minor on a hosted macOS runner and fail if the image lacks it.
inputs:
  xcode-version:
    description: Xcode major.minor to select, for example 27.1.
    required: false
    default: "27.1"
runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ inputs.xcode-version }}
    - shell: bash
      env:
        XCODE_VERSION: ${{ inputs.xcode-version }}
      run: |
        set -euo pipefail
        # Read all output: `| head -n 1` closes the pipe early and xcodebuild aborts on the broken pipe.
        actual=$(xcodebuild -version)
        actual=${actual%%$'\n'*}
        [[ "$actual" == "Xcode ${XCODE_VERSION}" || "$actual" == "Xcode ${XCODE_VERSION}."* ]] \
          || { echo "::error::Requested Xcode ${XCODE_VERSION} but xcodebuild reports '${actual}'"; exit 1; }
        echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
        xcodebuild -version
        sdk=$(xcrun --sdk iphoneos --show-sdk-version)
        echo "iOS SDK ${sdk}"
        xcrun simctl list runtimes
        simulator_devices=$(xcrun simctl list devices available --json)
        simulator_os=$(xcrun simctl list runtimes --json | jq -er --arg sdk "$sdk" --argjson devices "$simulator_devices" '
          def version: split(".") | map(tonumber) | .[:2];
          [.runtimes[] | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS-")))
           | select(.identifier as $runtime | any($devices.devices[$runtime][]?; .isAvailable and .name == "iPhone 17"))
           | .version | select(version <= ($sdk | version))] | max_by(version) | version | map(tostring) | join(".")') \
          || { echo "::error::No installed iOS simulator runtime with an available iPhone 17 can run the iOS ${sdk} SDK"; exit 1; }
        echo "iOS simulator runtime ${simulator_os}"
        echo "IOS_SIMULATOR_OS=${simulator_os}" >> "$GITHUB_ENV"
