name: Docker plugins
description: Make the Compose and Buildx CLI plugins available on the Linux pool's Docker daemon.
inputs:
  multi-platform:
    description: Also create a docker-container builder and prove it can run linux/arm64 build steps.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MULTI_PLATFORM: ${{ inputs.multi-platform }}
      run: |
        set -euo pipefail
        docker version
        packages=()
        # The docker-ce repository names the plugins *-plugin; Ubuntu's own archive ships docker-compose-v2 and docker-buildx.
        candidate() { apt-cache policy "$1" 2>/dev/null | grep -Eq '^  Candidate: [^(]'; }
        if ! docker compose version >/dev/null 2>&1; then
          sudo apt-get update
          if candidate docker-compose-plugin; then packages+=(docker-compose-plugin); else packages+=(docker-compose-v2); fi
        fi
        if ! docker buildx version >/dev/null 2>&1; then
          [[ ${#packages[@]} -gt 0 ]] || sudo apt-get update
          if candidate docker-buildx-plugin; then packages+=(docker-buildx-plugin); else packages+=(docker-buildx); fi
        fi
        if [[ ${#packages[@]} -gt 0 ]]; then
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
        fi
        docker compose version
        docker buildx version
        if [[ "$MULTI_PLATFORM" == "true" ]]; then
          # OCI output for two platforms needs a docker-container builder. The pool's Talos kernel has no
          # binfmt_misc, so BuildKit runs arm64 steps with the buildkit-qemu-aarch64 emulator its image ships;
          # `buildx inspect` does not list that platform, so prove it with a real arm64 build step instead.
          docker buildx create --driver docker-container --use --bootstrap
          arch=$(printf 'FROM busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e\nRUN uname -m > /arch\nFROM scratch\nCOPY --from=0 /arch /arch\n' \
            | docker buildx build --platform linux/arm64 --output type=tar,dest=- - | tar -xO arch 2>/dev/null || true)
          [[ "$arch" == "aarch64" ]] || { echo "The builder cannot run linux/arm64 steps (uname -m: '${arch}')" >&2; exit 1; }
        fi
