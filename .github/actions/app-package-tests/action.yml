# Interface (app-tests.yml's two package-test callers share it):
#   uses: ./.github/actions/app-package-tests   (after checkout and setup-xcode; the job grants actions: read)
#   with:
#     contracts: "true" also waits for this run's "Web contract probe" job and runs the live decoding test against each
#       fixture in its contract-fixture artifact: the current Web's and each retained Web release's.
#     plan: an App test plan (scripts/changed-components.py --app-plan) whose TalariaKitTests lane is explicit: only those
#       identifiers run, with a SwiftPM filter, and the run must match them exactly (ci/hosted-test-shard check). Its
#       coverage is partial and uploads as app-package-coverage-partial. Empty (the default) runs every test.
# TalariaKit's (models, networking, persistence, sync, view models) tests with `swift test`: no simulator and no app
# host (TAL-399). Only the live contract test waits for the Web probe.
name: App package tests
description: Build and run the TalariaKit tests with coverage, and report it.
inputs:
  contracts:
    description: Run the live decoding test against this run's Web contract probe.
    required: false
    default: "false"
  plan:
    description: An App test plan with an explicit TalariaKitTests lane; empty runs every test.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # The committed Package.resolved pins the App's revisions; resolution never drifts from it. Coverage is measured
    # on this run, the one CI Gate counts (TAL-67).
    - name: Build the package tests
      shell: bash
      working-directory: app
      run: swift build --package-path TalariaKit --build-tests --enable-code-coverage --only-use-versions-from-resolved-file

    - name: Wait for the Web contract probe
      if: inputs.contracts == 'true'
      shell: bash
      working-directory: app
      env:
        GH_TOKEN: ${{ github.token }}
      run: ci/wait-for-job "Web contract probe" 1500

    - name: Download the probe's live response fixture
      if: inputs.contracts == 'true'
      uses: actions/download-artifact@v8
      with:
        name: contract-fixture
        path: ${{ runner.temp }}/contract-fixture

    - name: Test the package
      shell: bash
      working-directory: app
      env:
        CONTRACTS_SELECTED: ${{ inputs.contracts }}
        LIVE_CONTRACT_TEST: TalariaKitTests.APIClientSessionListTests testLiveUpstreamContractResponsesDecodeWhenSupplied
        PLAN: ${{ inputs.plan }}
      run: |
        set -euo pipefail
        selection=()
        if [[ -n "${PLAN}" ]]; then
          printf '%s' "${PLAN}" > package-plan.json
          selection=(--filter "$(ci/hosted-test-shard filter package-plan.json)")
          echo "Selected package tests: ${selection[1]}"
        fi
        fixtures="${RUNNER_TEMP}/contract-fixture"
        fixture="${fixtures}/live-responses.json"
        # A missing fixture makes the live test skip, so require an explicit pass.
        require_live_pass() {
          grep -qF -- "Test Case '-[${LIVE_CONTRACT_TEST}]' passed" "$1" ||
            { echo "The live Web contract test did not pass against $2" >&2; exit 1; }
        }
        if [[ "${CONTRACTS_SELECTED}" == "true" ]]; then
          [[ -s "${fixture}" ]] || { echo "The probe artifact has no live-responses.json" >&2; exit 1; }
          export TALARIA_LIVE_CONTRACT_RESPONSES="${fixture}"
        fi
        start_seconds=${SECONDS}
        swift test --package-path TalariaKit --skip-build --enable-code-coverage ${selection[@]+"${selection[@]}"} 2>&1 |
          tee package-tests.log
        if [[ -n "${PLAN}" ]]; then
          # The run must match the plan: every identifier ran, once, and nothing else did.
          mkdir -p package-cases
          ci/hosted-test-shard cases package-tests.log > package-cases/shard-1.txt
          ci/hosted-test-shard check package-plan.json package-cases | tee -a "${GITHUB_STEP_SUMMARY}"
        fi
        if [[ "${CONTRACTS_SELECTED}" == "true" ]]; then
          require_live_pass package-tests.log "the fixture"
          # A release pairs this App with each retained Web release: its live responses and its session fixture, which
          # SharedContractTests reads from the checkout (TAL-2345). "Class test" becomes swift test's "Class/test".
          for retained in "${fixtures}"/retained/*/; do
            [[ -d "${retained}" ]] || continue
            cp "${retained}web-session.json" ../contracts/fixtures/web-session.json
            TALARIA_LIVE_CONTRACT_RESPONSES="${retained}responses.json" swift test --package-path TalariaKit --skip-build \
              --enable-code-coverage --filter "^TalariaKitTests\.SharedContractTests/|^${LIVE_CONTRACT_TEST/ //}$" 2>&1 |
              tee retained-tests.log
            git checkout -- ../contracts/fixtures/web-session.json
            grep -qF "Test Suite 'SharedContractTests' passed" retained-tests.log ||
              { echo "SharedContractTests did not pass against $(basename "${retained}")" >&2; exit 1; }
            require_live_pass retained-tests.log "retained Web $(basename "${retained}")"
          done
        fi
        {
          echo "### Package tests${PLAN:+ (selected: partial, not full-suite evidence)}"
          echo "- swift test: $((SECONDS - start_seconds))s, $(grep -oE 'Executed [0-9]+ tests' package-tests.log | tail -1)"
        } >> "${GITHUB_STEP_SUMMARY}"

    # After a failure too: the report merges whatever profiles the run wrote. The numbers gate nothing.
    - name: Report coverage
      if: ${{ !cancelled() }}
      shell: bash
      working-directory: app
      env:
        PARTIAL: ${{ inputs.plan != '' }}
      run: |
        [[ "${PARTIAL}" != true ]] || echo "#### Partial coverage: only the selected tests ran" >> "${GITHUB_STEP_SUMMARY}"
        ci/package-coverage coverage >> "${GITHUB_STEP_SUMMARY}"

    - name: Upload coverage
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.plan != '' && 'app-package-coverage-partial' || 'app-package-coverage' }}
        path: app/coverage/
        retention-days: 14
        overwrite: true
        if-no-files-found: ignore
