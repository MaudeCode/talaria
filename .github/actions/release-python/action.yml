name: Release Python
description: Install release tooling in job-owned storage.
runs:
  using: composite
  steps:
    - if: runner.os != 'macOS'
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: releases/requirements.txt
    - if: runner.os == 'macOS'
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        UV_VERSION: "0.11.3"
        UV_SHA256: 2bc3d0c7bf2bd08325b1e170abac6f7e5b3346e1d4eab3370d17cefec934996f
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/release-uv.tar.gz"
        curl -fsSL "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-aarch64-apple-darwin.tar.gz" -o "$archive"
        echo "$UV_SHA256  $archive" | shasum -a 256 --check
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        uv_bin="$RUNNER_TEMP/uv-aarch64-apple-darwin/uv"
        export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/release-managed-python"
        "$uv_bin" --no-config python install 3.13
        python_bin=$("$uv_bin" --no-config python find --managed-python --no-project 3.13)
        echo "HERMES_WEBUI_TEST_PYTHON=$python_bin" >> "$GITHUB_ENV"
        echo "$(dirname "$uv_bin")" >> "$GITHUB_PATH"
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        python_bin=${HERMES_WEBUI_TEST_PYTHON:-$(command -v python3)}
        "$python_bin" -m venv "$RUNNER_TEMP/release-tools"
        "$RUNNER_TEMP/release-tools/bin/python" -m pip install --disable-pip-version-check -r releases/requirements.txt
        echo "RELEASE_PYTHON=$RUNNER_TEMP/release-tools/bin/python" >> "$GITHUB_ENV"
        echo "HERMES_WEBUI_TEST_PYTHON=$python_bin" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/release-tools/bin" >> "$GITHUB_PATH"
