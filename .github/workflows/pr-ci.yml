# Main pushes verify every component. Pull requests route component paths and
# run all affected checks for shared policy or contract changes.
# The always-reporting CI Gate is the required check, including skipped jobs.
#
# Uses no repository secrets, so PRs from forks get green CI too.
#
# Builds are signed ad hoc (CODE_SIGN_IDENTITY=-), which needs no certificate,
# no profile and no secrets, but does embed entitlements. Without them the app
# group is unavailable, so the share extension cannot hand anything to the app
# and ShareExtensionUITests would be testing nothing (TAL-81).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  changes:
    name: Detect changed paths
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 5
    outputs:
      run_ios: ${{ steps.filter.outputs.app }}
      web: ${{ steps.filter.outputs.web }}
      relay: ${{ steps.filter.outputs.relay }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed files
        working-directory: .
        id: filter
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            printf 'app=true\nweb=true\nrelay=true\ncontracts=true\n' >> "$GITHUB_OUTPUT"
          else
            base=$(git merge-base "$PR_BASE" "$PR_HEAD")
            python3 scripts/changed-components.py --base "$base" --head "$PR_HEAD" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build and Test
    needs: changes
    if: needs.changes.outputs.run_ios == 'true'
    runs-on: maude-mac
    timeout-minutes: 90

    env:
      PROJECT_PATH: Talaria.xcodeproj
      SCHEME: Talaria
      DERIVED_DATA_PATH: DerivedData
      RESULT_BUNDLE_PATH: TestResults.xcresult
      TEST_WORKER_COUNT: 2
      # Measurement-only UI classes (TAL-75). They assert no behaviour, and
      # together they add several minutes of scrolling and relaunching, so pull
      # requests skip them and every push to main runs and records them. The
      # unit-level budgets (replay catch-up, dense Kanban, image preview) are
      # fast and deterministic, so they stay in the pull-request suite.
      PERFORMANCE_UI_TEST_CLASSES: >-
        TalariaUITests/SidebarPerformanceUITests
        TalariaUITests/LaunchPerformanceUITests
        TalariaUITests/TranscriptPerformanceUITests
        TalariaUITests/NavigationPerformanceUITests

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test local XCTest admission
        run: |
          scripts/test-test-ios 20
          scripts/test-ios-simulator-pool

      - name: Test CI helpers
        run: ci/require_successful_main_ci_test.sh

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          # scripts/select-ios-simulator picks the newest *released* runtime
          # (docs/ios-simulator-pool.md); within it prefer the pool's phone model.
          runtime=$(scripts/select-ios-simulator | cut -f2)
          simulator_id=$(xcrun simctl list devices available --json | RUNTIME="${runtime}" python3 -c '
          import json, os, sys
          phones = [
              device
              for device in json.load(sys.stdin)["devices"].get(os.environ["RUNTIME"], [])
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          preferred = "iPhone 17"
          selected = next((device for device in phones if device["name"] == preferred), phones[0] if phones else None)
          print(selected["udid"] if selected else "")
          ')
          if [[ -z "${simulator_id}" ]]; then
            echo "No available iPhone simulator found:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: ${simulator_id} on ${runtime}"
          echo "id=${simulator_id}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild build-for-testing \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -disableAutomaticPackageResolution \
            -showBuildTimingSummary \
            APP_IDENTIFIER_SUFFIX=.xctest \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=
          duration_seconds=$((SECONDS - start_seconds))
          echo "Build-for-testing duration: ${duration_seconds}s"
          echo "### PR CI timing" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Build for testing: ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Test without building
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          # The fuzz soak class reruns the PR fuzz properties at a far larger
          # seed budget; the scheduled Fuzz Soak workflow owns it (TAL-85).
          test_options=("-skip-testing:TalariaTests/UntrustedInputFuzzSoakTests")
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            for performance_class in ${PERFORMANCE_UI_TEST_CLASSES}; do
              test_options+=("-skip-testing:${performance_class}")
            done
          fi
          xcodebuild test-without-building \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -testLanguage en \
            -testRegion US \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -disableAutomaticPackageResolution \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count "${TEST_WORKER_COUNT}" \
            "${test_options[@]}" \
            APP_IDENTIFIER_SUFFIX=.xctest \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=
          duration_seconds=$((SECONDS - start_seconds))
          echo "Test-without-building duration: ${duration_seconds}s"
          echo "- Test without building (${TEST_WORKER_COUNT} workers): ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "- Performance UI budgets: main-push CI" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Report slowest tests
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -d "${RESULT_BUNDLE_PATH}" ]]; then
            echo "No result bundle is available; skipping slow-test reporting."
            exit 0
          fi

          xcrun xcresulttool get test-results tests \
            --path "${RESULT_BUNDLE_PATH}" \
            --compact > test-results.json

          python3 - <<'PY' | tee slowest-tests.txt
          import json

          with open("test-results.json", encoding="utf-8") as results_file:
              results = json.load(results_file)

          tests = []

          def visit(node, parents):
              name = node.get("name", "<unnamed>")
              node_type = node.get("nodeType")
              path = [*parents, name]
              duration = node.get("durationInSeconds")
              if node_type == "Test Case" and isinstance(duration, (int, float)):
                  tests.append((duration, " / ".join(path)))
              for child in node.get("children", []):
                  visit(child, path)

          for root in results.get("testNodes", []):
              visit(root, [])

          print("Slowest test cases:")
          for duration, name in sorted(tests, reverse=True)[:20]:
              print(f"{duration:8.3f}s  {name}")
          PY

          {
            echo ""
            echo "#### Slowest test cases"
            echo '```text'
            cat slowest-tests.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Reject skipped UI tests
        run: scripts/assert-no-skipped-ui-tests "${RESULT_BUNDLE_PATH}"

      # Performance budgets are only useful against previous runs, so every run
      # keeps its measurements as an artifact and prints them into the summary.
      - name: Record performance metrics
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -d "${RESULT_BUNDLE_PATH}" ]]; then
            echo "No result bundle is available; skipping performance reporting."
            exit 0
          fi

          xcrun xcresulttool get test-results metrics \
            --path "${RESULT_BUNDLE_PATH}" \
            --compact > performance-metrics.json

          python3 - <<'PY' | tee performance-metrics.txt
          import json

          with open("performance-metrics.json", encoding="utf-8") as metrics_file:
              tests = json.load(metrics_file)

          if not tests:
              print("No performance metrics were recorded.")

          for test in sorted(tests, key=lambda test: test["testIdentifier"]):
              print(test["testIdentifier"])
              for run in test.get("testRuns", []):
                  for metric in run.get("metrics", []):
                      measurements = metric.get("measurements") or []
                      if not measurements:
                          continue
                      ordered = sorted(measurements)
                      median = ordered[len(ordered) // 2]
                      spread = ordered[-1] - ordered[0]
                      print(
                          f"    {metric['displayName']:<40}"
                          f" median {median:>16.3f} {metric['unitOfMeasurement']}"
                          f"  (n={len(measurements)}, spread {spread:.3f})"
                      )
          PY

          {
            echo ""
            echo "#### Performance metrics"
            echo '```text'
            cat performance-metrics.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload performance metrics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: performance-metrics
          path: |
            app/performance-metrics.json
            app/performance-metrics.txt
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload test results on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/${{ env.RESULT_BUNDLE_PATH }}
          if-no-files-found: ignore

  tooling:
    uses: ./.github/workflows/repository-tooling.yml

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web-verify.yml

  web-docker:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/web-docker-smoke.yml

  relay:
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    uses: ./.github/workflows/relay-verify.yml

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: maude-mac
    steps:
      - uses: actions/checkout@v7
      - name: Install Python in job-owned storage
        env:
          UV_VERSION: "0.11.3"
          UV_SHA256: 2bc3d0c7bf2bd08325b1e170abac6f7e5b3346e1d4eab3370d17cefec934996f
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/uv.tar.gz"
          curl -fsSL "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-aarch64-apple-darwin.tar.gz" -o "$archive"
          echo "$UV_SHA256  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          uv_bin="$RUNNER_TEMP/uv-aarch64-apple-darwin/uv"
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/python"
          "$uv_bin" --no-config python install 3.13
          contract_python=$("$uv_bin" --no-config python find --managed-python --no-project 3.13)
          echo "HERMES_WEBUI_TEST_PYTHON=$contract_python" >> "$GITHUB_ENV"
      - name: Check local App to Web HTTP and SSE contracts
        run: scripts/validate-upstream-contract

  gate:
    name: CI Gate
    needs: [changes, test, tooling, web, web-docker, relay, contracts]
    if: always()
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 5
    steps:
      - name: Check results
        working-directory: .
        run: |
          set -euo pipefail
          echo "changes: ${{ needs.changes.result }}"
          echo "test: ${{ needs.test.result }}"
          echo "tooling: ${{ needs.tooling.result }}"
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Path detection failed — failing the gate." >&2
            exit 1
          fi
          if [[ "${{ needs.tooling.result }}" != "success" ]]; then
            echo "Repository Tooling did not pass — failing the gate." >&2
            exit 1
          fi
          for result in "${{ needs.test.result }}" "${{ needs.web.result }}" "${{ needs.web-docker.result }}" "${{ needs.relay.result }}" "${{ needs.contracts.result }}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required component check did not pass." >&2; exit 1 ;;
            esac
          done
          echo "Gate passed."
