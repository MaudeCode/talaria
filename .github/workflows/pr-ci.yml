# Pull requests and main pushes run suites selected by the complete changed-path diff.
# Release metadata always validates; uncertain classification runs every suite.
# The always-reporting CI Gate is the required check, including skipped jobs.
#
# The only repository secrets used are the talaria-ci NAS bucket key for the
# contract fixture and result objects; PRs from forks have no secrets and fail
# clearly at the first NAS transfer instead of silently passing.
#
# Builds are signed ad hoc (CODE_SIGN_IDENTITY=-), which needs no certificate,
# no profile and no secrets, but does embed entitlements. Without them the app
# group is unavailable, so the share extension cannot hand anything to the app
# and ShareExtensionUITests would be testing nothing (TAL-81).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  changes:
    name: Detect changed paths
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      app_ui: ${{ steps.filter.outputs.app_ui }}
      app_tooling: ${{ steps.filter.outputs.app_tooling }}
      web_server: ${{ steps.filter.outputs.web_server }}
      web_frontend: ${{ steps.filter.outputs.web_frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      relay: ${{ steps.filter.outputs.relay }}
      contracts: ${{ steps.filter.outputs.contracts }}
      tooling: ${{ steps.filter.outputs.tooling }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed files
        working-directory: .
        id: filter
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python3 scripts/changed-components.py --base="$PUSH_BASE" --head="$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            # Event base.sha can predate a merged parent PR. Checkout fetched
            # the current base branch, as release-fragment validation also uses.
            python3 scripts/changed-components.py --base="refs/remotes/origin/${PR_BASE_REF}" --head="$PR_HEAD" --merge-base >> "$GITHUB_OUTPUT"
          fi

  app-tooling:
    name: App tooling
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app_tooling != 'false') }}
    runs-on: maude-mac
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test local XCTest admission and synthetic simulator leases
        run: |
          scripts/test-test-ios 20
          scripts/test-ios-simulator-pool

  test:
    name: Build and Test
    # Runs for App changes and for Web/contract changes. The latter reuse one
    # build-for-testing and run only the native contract classes against the
    # Linux probe's fixture; a failed or missing probe skips the job and the
    # CI Gate then fails it as a required skipped check.
    needs: [changes, contracts]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app != 'false' || needs.changes.outputs.contracts != 'false') && (needs.contracts.result == 'success' || needs.contracts.result == 'skipped') }}
    runs-on: maude-mac
    timeout-minutes: 90

    env:
      PROJECT_PATH: Talaria.xcodeproj
      SCHEME: Talaria
      DERIVED_DATA_PATH: DerivedData
      RESULT_BUNDLE_PATH: TestResults.xcresult
      TEST_WORKER_COUNT: 2
      APP_TESTS_REQUIRED: ${{ needs.changes.result != 'success' || needs.changes.outputs.app != 'false' }}
      APP_UI_REQUIRED: ${{ github.event_name != 'pull_request' || needs.changes.outputs.app_ui != 'false' }}
      CONTRACT_FIXTURE: ${{ needs.contracts.outputs.fixture }}
      CONTRACT_FIXTURE_SHA256: ${{ needs.contracts.outputs.fixture_sha256 }}
      CONTRACT_TEST_CLASSES: >-
        TalariaTests/ContractReadinessTests
        TalariaTests/SharedContractTests
        TalariaTests/APIClientAuthAndErrorTests
        TalariaTests/APIClientSessionListTests
        TalariaTests/APIClientSessionMutationTests
        TalariaTests/SSEClientTests
        TalariaTests/StreamReconnectContractTests
      # Measurement-only UI classes (TAL-75). They assert no behaviour, and
      # together they add several minutes of scrolling and relaunching, so pull
      # requests skip them; affected App pushes to main run and record them. The
      # unit-level budgets (replay catch-up, dense Kanban, image preview) are
      # fast and deterministic, so they stay in the pull-request suite.
      PERFORMANCE_UI_TEST_CLASSES: >-
        TalariaUITests/SidebarPerformanceUITests
        TalariaUITests/LaunchPerformanceUITests
        TalariaUITests/TranscriptPerformanceUITests
        TalariaUITests/NavigationPerformanceUITests

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test CI helpers
        run: ci/require_successful_main_ci_test.sh

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Fetch and verify the live Web contract fixture from the NAS
        if: needs.contracts.result == 'success'
        env:
          TALARIA_S3_ENDPOINT: ${{ vars.TALARIA_S3_ENDPOINT }}
          TALARIA_S3_REGION: ${{ vars.TALARIA_S3_REGION }}
          TALARIA_S3_BUCKET: talaria-ci
          TALARIA_S3_ACCESS_KEY_ID: ${{ secrets.TALARIA_CI_S3_ACCESS_KEY_ID }}
          TALARIA_S3_SECRET_ACCESS_KEY: ${{ secrets.TALARIA_CI_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Only this run's probe object is acceptable; the digest comes from that job's outputs.
          [[ "${CONTRACT_FIXTURE}" == "fixtures/pr-ci/${GITHUB_RUN_ID}/"* ]]
          fixture="$RUNNER_TEMP/contract-fixture/live-responses.json"
          ../scripts/s3-artifact get "${CONTRACT_FIXTURE}" "${fixture}"
          echo "${CONTRACT_FIXTURE_SHA256}  ${fixture}" | shasum -a 256 --check
          # scripts/test-ios transports the same manifest through the test-only
          # display name and the TALARIA_LIVE_CONTRACT compilation condition.
          {
            echo "TALARIA_UPSTREAM_CONTRACT_RESPONSES=base64:$(base64 < "$fixture" | tr -d '\n')"
            echo "CONTRACT_TESTS_REQUIRED=true"
          } >> "$GITHUB_ENV"

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          # scripts/select-ios-simulator picks the newest *released* runtime
          # (docs/ios-simulator-pool.md); within it prefer the pool's phone model.
          runtime=$(scripts/select-ios-simulator | cut -f2)
          simulator_id=$(xcrun simctl list devices available --json | RUNTIME="${runtime}" python3 -c '
          import json, os, sys
          phones = [
              device
              for device in json.load(sys.stdin)["devices"].get(os.environ["RUNTIME"], [])
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          preferred = "iPhone 17"
          selected = next((device for device in phones if device["name"] == preferred), phones[0] if phones else None)
          print(selected["udid"] if selected else "")
          ')
          if [[ -z "${simulator_id}" ]]; then
            echo "No available iPhone simulator found:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: ${simulator_id} on ${runtime}"
          echo "id=${simulator_id}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          contract_settings=()
          if [[ -n "${TALARIA_UPSTREAM_CONTRACT_RESPONSES:-}" ]]; then
            # shellcheck disable=SC2016 # xcodebuild expands $(inherited) itself.
            contract_settings=("INFOPLIST_KEY_CFBundleDisplayName=${TALARIA_UPSTREAM_CONTRACT_RESPONSES}" 'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) TALARIA_LIVE_CONTRACT')
          fi
          xcodebuild build-for-testing \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -disableAutomaticPackageResolution \
            -showBuildTimingSummary \
            "${contract_settings[@]}" \
            APP_IDENTIFIER_SUFFIX=.xctest \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=
          duration_seconds=$((SECONDS - start_seconds))
          echo "Build-for-testing duration: ${duration_seconds}s"
          echo "### PR CI timing" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Build for testing: ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Test without building
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          # The fuzz soak class reruns the PR fuzz properties at a far larger
          # seed budget; the scheduled Fuzz Soak workflow owns it (TAL-85).
          test_options=("-skip-testing:TalariaTests/UntrustedInputFuzzSoakTests")
          if [[ "${APP_TESTS_REQUIRED}" == "false" ]]; then
            # Web/contract-only change: the fixture-backed native contract classes are the whole selection.
            for contract_class in ${CONTRACT_TEST_CLASSES}; do
              test_options+=("-only-testing:${contract_class}")
            done
          elif [[ "${APP_UI_REQUIRED}" == "false" ]]; then
            test_options+=("-only-testing:TalariaTests" "-only-testing:TalariaUITests/ChatNavigationUITests/testChatSessionOpensFromList")
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            for performance_class in ${PERFORMANCE_UI_TEST_CLASSES}; do
              test_options+=("-skip-testing:${performance_class}")
            done
          fi
          xcodebuild test-without-building \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -testLanguage en \
            -testRegion US \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -disableAutomaticPackageResolution \
            -collect-test-diagnostics never \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count "${TEST_WORKER_COUNT}" \
            "${test_options[@]}" \
            APP_IDENTIFIER_SUFFIX=.xctest \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=
          duration_seconds=$((SECONDS - start_seconds))
          if [[ "${CONTRACT_TESTS_REQUIRED:-false}" == "true" ]]; then
            # The fixture must have reached the executed bundle and every contract class must have passed.
            plist=$(find "${DERIVED_DATA_PATH}/Build/Products" -path '*/TalariaTests.xctest/Info.plist' -print -quit)
            [[ "$(/usr/bin/plutil -extract CFBundleDisplayName raw "${plist}")" == "${TALARIA_UPSTREAM_CONTRACT_RESPONSES}" ]]
            xcrun xcresulttool get test-results tests --path "${RESULT_BUNDLE_PATH}" --compact > contract-results.json
            for contract_class in ${CONTRACT_TEST_CLASSES}; do
              /usr/bin/jq -e --arg prefix "test://com.apple.xcode/Talaria/${contract_class}/" '
                any(.. | objects; .nodeType? == "Test Case" and .result? == "Passed" and ((.nodeIdentifierURL? // "") | startswith($prefix)))
              ' contract-results.json >/dev/null || { echo "Native contract class ${contract_class} did not pass" >&2; exit 1; }
            done
            echo "- Native contract tests: fixture ${CONTRACT_FIXTURE} (${CONTRACT_FIXTURE_SHA256})" >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo "Test-without-building duration: ${duration_seconds}s"
          echo "- Test without building (${TEST_WORKER_COUNT} workers): ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "- Performance UI budgets: main-push CI" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Report slowest tests
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -d "${RESULT_BUNDLE_PATH}" ]]; then
            echo "No result bundle is available; skipping slow-test reporting."
            exit 0
          fi

          xcrun xcresulttool get test-results tests \
            --path "${RESULT_BUNDLE_PATH}" \
            --compact > test-results.json

          python3 - <<'PY' | tee slowest-tests.txt
          import json

          with open("test-results.json", encoding="utf-8") as results_file:
              results = json.load(results_file)

          tests = []

          def visit(node, parents):
              name = node.get("name", "<unnamed>")
              node_type = node.get("nodeType")
              path = [*parents, name]
              duration = node.get("durationInSeconds")
              if node_type == "Test Case" and isinstance(duration, (int, float)):
                  tests.append((duration, " / ".join(path)))
              for child in node.get("children", []):
                  visit(child, path)

          for root in results.get("testNodes", []):
              visit(root, [])

          print("Slowest test cases:")
          for duration, name in sorted(tests, reverse=True)[:20]:
              print(f"{duration:8.3f}s  {name}")
          PY

          {
            echo ""
            echo "#### Slowest test cases"
            echo '```text'
            cat slowest-tests.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Reject skipped UI tests
        run: |
          options=()
          if [[ "${APP_TESTS_REQUIRED}" == "true" && "${APP_UI_REQUIRED}" == "false" ]]; then options+=(--require-launch-smoke); fi
          scripts/assert-no-skipped-ui-tests "${RESULT_BUNDLE_PATH}" "${options[@]}"

      # Performance budgets are only useful against previous runs, so every run
      # keeps its measurements as an artifact and prints them into the summary.
      - name: Record performance metrics
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -d "${RESULT_BUNDLE_PATH}" ]]; then
            echo "No result bundle is available; skipping performance reporting."
            exit 0
          fi

          xcrun xcresulttool get test-results metrics \
            --path "${RESULT_BUNDLE_PATH}" \
            --compact > performance-metrics.json

          python3 - <<'PY' | tee performance-metrics.txt
          import json

          with open("performance-metrics.json", encoding="utf-8") as metrics_file:
              tests = json.load(metrics_file)

          if not tests:
              print("No performance metrics were recorded.")

          for test in sorted(tests, key=lambda test: test["testIdentifier"]):
              print(test["testIdentifier"])
              for run in test.get("testRuns", []):
                  for metric in run.get("metrics", []):
                      measurements = metric.get("measurements") or []
                      if not measurements:
                          continue
                      ordered = sorted(measurements)
                      median = ordered[len(ordered) // 2]
                      spread = ordered[-1] - ordered[0]
                      print(
                          f"    {metric['displayName']:<40}"
                          f" median {median:>16.3f} {metric['unitOfMeasurement']}"
                          f"  (n={len(measurements)}, spread {spread:.3f})"
                      )
          PY

          {
            echo ""
            echo "#### Performance metrics"
            echo '```text'
            cat performance-metrics.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Store performance metrics on the NAS
        if: always()
        continue-on-error: true
        env:
          TALARIA_S3_ENDPOINT: ${{ vars.TALARIA_S3_ENDPOINT }}
          TALARIA_S3_REGION: ${{ vars.TALARIA_S3_REGION }}
          TALARIA_S3_BUCKET: talaria-ci
          TALARIA_S3_ACCESS_KEY_ID: ${{ secrets.TALARIA_CI_S3_ACCESS_KEY_ID }}
          TALARIA_S3_SECRET_ACCESS_KEY: ${{ secrets.TALARIA_CI_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          prefix="performance-metrics/pr-ci/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          for file in performance-metrics.json performance-metrics.txt; do
            [[ -f "$file" ]] || continue
            ../scripts/s3-artifact put "$prefix/$file" "$file"
            echo "- Performance metrics: talaria-ci/$prefix/$file (expires after 90 days)" >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Store test results on the NAS on failure
        if: failure()
        continue-on-error: true
        env:
          TALARIA_S3_ENDPOINT: ${{ vars.TALARIA_S3_ENDPOINT }}
          TALARIA_S3_REGION: ${{ vars.TALARIA_S3_REGION }}
          TALARIA_S3_BUCKET: talaria-ci
          TALARIA_S3_ACCESS_KEY_ID: ${{ secrets.TALARIA_CI_S3_ACCESS_KEY_ID }}
          TALARIA_S3_SECRET_ACCESS_KEY: ${{ secrets.TALARIA_CI_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          [[ -d "${RESULT_BUNDLE_PATH}" ]] || exit 0
          key="test-results/pr-ci/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${RESULT_BUNDLE_PATH}.tar"
          tar -cf "${RESULT_BUNDLE_PATH}.tar" "${RESULT_BUNDLE_PATH}"
          ../scripts/s3-artifact put "$key" "${RESULT_BUNDLE_PATH}.tar"
          echo "- Result bundle: talaria-ci/$key (expires after 3 days)" >> "${GITHUB_STEP_SUMMARY}"

  tooling:
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/repository-tooling.yml
    with:
      full: ${{ needs.changes.result != 'success' || needs.changes.outputs.tooling != 'false' }}

  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web_server != 'false' || needs.changes.outputs.web_frontend != 'false') }}
    uses: ./.github/workflows/web-verify.yml
    with:
      server: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_server != 'false' }}
      frontend: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_frontend != 'false' }}

  web-docker:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker != 'false') }}
    uses: ./.github/workflows/web-docker-smoke.yml

  relay:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relay != 'false') }}
    uses: ./.github/workflows/relay-verify.yml

  contracts:
    name: Web contract probe
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.contracts != 'false') }}
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 20
    outputs:
      fixture: ${{ steps.fixture.outputs.name }}
      fixture_sha256: ${{ steps.fixture.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the probe runtime (zsh script, node-pty native toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh make g++ python3
      - name: Set up Node for the disposable Web server
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - name: Probe local Web HTTP and SSE contracts and record the live responses
        run: scripts/validate-upstream-contract --server-only --responses-output "$RUNNER_TEMP/contract-fixture/live-responses.json"
      # The Build and Test job on the Mac runner embeds this exact fixture in
      # the App test bundle and runs the native request/decoding/SSE contract
      # tests against it, so Web changes need no separate Mac job.
      - name: Store the live response fixture on the NAS
        id: fixture
        env:
          TALARIA_S3_ENDPOINT: ${{ vars.TALARIA_S3_ENDPOINT }}
          TALARIA_S3_REGION: ${{ vars.TALARIA_S3_REGION }}
          TALARIA_S3_BUCKET: talaria-ci
          TALARIA_S3_ACCESS_KEY_ID: ${{ secrets.TALARIA_CI_S3_ACCESS_KEY_ID }}
          TALARIA_S3_SECRET_ACCESS_KEY: ${{ secrets.TALARIA_CI_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/contract-fixture/live-responses.json"
          key="fixtures/pr-ci/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/live-responses.json"
          ../scripts/s3-artifact put "$key" "$fixture"
          echo "name=$key" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$fixture" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  gate:
    name: CI Gate
    needs: [changes, test, app-tooling, tooling, web, web-docker, relay, contracts]
    if: always()
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check selected suite results
        working-directory: .
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed-components.py --check-results
