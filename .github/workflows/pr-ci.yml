# Pull requests and main pushes run suites selected by the complete changed-path diff;
# the full iOS UI suite runs on main pushes only (pull requests run a launch smoke test).
# Release metadata always validates; uncertain classification runs every suite.
# The always-reporting CI Gate is the required check, including skipped jobs.
#
# The only repository secrets used are the talaria-ci NAS bucket key for the
# contract fixture and result objects; PRs from forks have no secrets and fail
# clearly at the first NAS transfer instead of silently passing.
#
# Builds are signed ad hoc (CODE_SIGN_IDENTITY=-), which needs no certificate,
# no profile and no secrets, but does embed entitlements. Without them the app
# group is unavailable, so the share extension cannot hand anything to the app
# and ShareExtensionUITests would be testing nothing (TAL-81).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  # The Mac test job reads the probe job's status and fixture annotation.
  actions: read
  checks: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  changes:
    name: Detect changed paths
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      app_tooling: ${{ steps.filter.outputs.app_tooling }}
      web_server: ${{ steps.filter.outputs.web_server }}
      web_frontend: ${{ steps.filter.outputs.web_frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      relay: ${{ steps.filter.outputs.relay }}
      contracts: ${{ steps.filter.outputs.contracts }}
      tooling: ${{ steps.filter.outputs.tooling }}
    steps:
      # Classification needs history and trees for the merge-base and diff, not every historical blob;
      # git fetches the few file contents it compares on demand (TAL-317).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts
      - name: Classify changed files
        working-directory: .
        id: filter
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python3 scripts/changed-components.py --base="$PUSH_BASE" --head="$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            # Event base.sha can predate a merged parent PR. Checkout fetched
            # the current base branch, as release-fragment validation also uses.
            python3 scripts/changed-components.py --base="refs/remotes/origin/${PR_BASE_REF}" --head="$PR_HEAD" --merge-base >> "$GITHUB_OUTPUT"
          fi

  app-tooling:
    name: App tooling
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app_tooling != 'false') }}
    runs-on: maude-mac
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test local XCTest admission and synthetic simulator leases
        run: |
          scripts/test-test-ios 20
          scripts/test-ios-simulator-pool
          python3 scripts/test-validate-upstream-contract

  test:
    name: Build and Test
    # Runs for App changes and for Web/contract changes; Web/contract-only
    # changes run just the native contract classes. It starts without waiting
    # for the Linux probe: the one live-fixture test runs last, against the
    # probe's digest-checked fixture, and a failed probe fails that step.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app != 'false' || needs.changes.outputs.contracts != 'false') }}
    runs-on: maude-mac
    timeout-minutes: 90

    env:
      PROJECT_PATH: Talaria.xcodeproj
      SCHEME: Talaria
      DERIVED_DATA_PATH: DerivedData
      RESULT_BUNDLE_PATH: TestResults.xcresult
      # PRs run the unit tests and one smoke test on four clones. Main's full UI suite uses two: four
      # clones launching UI test runners at once hit SpringBoard "Busy ... failed preflight" (TAL-333).
      TEST_WORKER_COUNT: ${{ github.event_name == 'pull_request' && 4 || 2 }}
      APP_TESTS_REQUIRED: ${{ needs.changes.result != 'success' || needs.changes.outputs.app != 'false' }}
      # PRs run the unit tests plus one launch smoke test; the full UI suite runs on main pushes (TAL-332).
      APP_UI_REQUIRED: ${{ github.event_name != 'pull_request' }}
      CONTRACTS_SELECTED: ${{ needs.changes.result != 'success' || needs.changes.outputs.contracts != 'false' }}
      LIVE_CONTRACT_TEST: TalariaTests/APIClientSessionListTests/testLiveUpstreamContractResponsesDecodeWhenSupplied
      LIVE_CONTRACT_RESULT_BUNDLE_PATH: LiveContractResults.xcresult
      CONTRACT_TEST_CLASSES: >-
        TalariaTests/ContractReadinessTests
        TalariaTests/SharedContractTests
        TalariaTests/APIClientAuthAndErrorTests
        TalariaTests/APIClientSessionListTests
        TalariaTests/APIClientSessionMutationTests
        TalariaTests/SSEClientTests
        TalariaTests/StreamReconnectContractTests
      # Measurement-only UI classes (TAL-75). They assert no behaviour and add
      # several minutes of scrolling and relaunching, so CI skips them and the
      # scheduled ui-performance.yml runs them serially (TAL-287). The unit-level
      # budgets (replay catch-up, dense Kanban, image preview) are fast and
      # deterministic, so they stay in the suite.
      PERFORMANCE_UI_TEST_CLASSES: >-
        TalariaUITests/SidebarPerformanceUITests
        TalariaUITests/LaunchPerformanceUITests
        TalariaUITests/TranscriptPerformanceUITests
        TalariaUITests/NavigationPerformanceUITests

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Test CI helpers
        run: ci/require_successful_main_ci_test.sh

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          # scripts/select-ios-simulator picks the newest *released* runtime
          # (docs/ios-simulator-pool.md); within it prefer the pool's phone model.
          runtime=$(scripts/select-ios-simulator | cut -f2)
          simulator_id=$(xcrun simctl list devices available --json | RUNTIME="${runtime}" python3 -c '
          import json, os, sys
          phones = [
              device
              for device in json.load(sys.stdin)["devices"].get(os.environ["RUNTIME"], [])
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          preferred = "iPhone 17"
          selected = next((device for device in phones if device["name"] == preferred), phones[0] if phones else None)
          print(selected["udid"] if selected else "")
          ')
          if [[ -z "${simulator_id}" ]]; then
            echo "No available iPhone simulator found:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: ${simulator_id} on ${runtime}"
          echo "id=${simulator_id}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild build-for-testing \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -disableAutomaticPackageResolution \
            -showBuildTimingSummary \
            APP_IDENTIFIER_SUFFIX=.xctest \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=
          duration_seconds=$((SECONDS - start_seconds))
          echo "Build-for-testing duration: ${duration_seconds}s"
          echo "### PR CI timing" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Build for testing: ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Test without building
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          # The fuzz soak class reruns the PR fuzz properties at a far larger
          # seed budget; the scheduled Fuzz Soak workflow owns it (TAL-85).
          test_options=("-skip-testing:TalariaTests/UntrustedInputFuzzSoakTests" "-skip-testing:${LIVE_CONTRACT_TEST}")
          if [[ "${APP_TESTS_REQUIRED}" == "false" ]]; then
            # Web/contract-only change: the fixture-backed native contract classes are the whole selection.
            for contract_class in ${CONTRACT_TEST_CLASSES}; do
              test_options+=("-only-testing:${contract_class}")
            done
          elif [[ "${APP_UI_REQUIRED}" == "false" ]]; then
            # A pull request: unit tests and one launch smoke test; main runs every UI test.
            test_options+=("-only-testing:TalariaTests" "-only-testing:TalariaUITests/ChatNavigationUITests/testChatSessionOpensFromList")
          fi
          # The scheduled UI Performance workflow owns the measurement-only classes (TAL-287).
          for performance_class in ${PERFORMANCE_UI_TEST_CLASSES}; do
            test_options+=("-skip-testing:${performance_class}")
          done
          xcodebuild test-without-building \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -testLanguage en \
            -testRegion US \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -disableAutomaticPackageResolution \
            -collect-test-diagnostics never \
            -parallel-testing-enabled YES \
            -parallel-testing-worker-count "${TEST_WORKER_COUNT}" \
            "${test_options[@]}" \
            APP_IDENTIFIER_SUFFIX=.xctest \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=
          duration_seconds=$((SECONDS - start_seconds))
          if [[ "${CONTRACTS_SELECTED}" == "true" ]]; then
            # Every native contract class must have passed.
            xcrun xcresulttool get test-results tests --path "${RESULT_BUNDLE_PATH}" --compact > contract-results.json
            for contract_class in ${CONTRACT_TEST_CLASSES}; do
              /usr/bin/jq -e --arg prefix "test://com.apple.xcode/Talaria/${contract_class}/" '
                any(.. | objects; .nodeType? == "Test Case" and .result? == "Passed" and ((.nodeIdentifierURL? // "") | startswith($prefix)))
              ' contract-results.json >/dev/null || { echo "Native contract class ${contract_class} did not pass" >&2; exit 1; }
            done
          fi
          echo "Test-without-building duration: ${duration_seconds}s"
          echo "- Test without building (${TEST_WORKER_COUNT} workers): ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Performance UI budgets: scheduled UI Performance workflow" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run the live Web contract test against the probe fixture
        if: env.CONTRACTS_SELECTED == 'true'
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
          GH_TOKEN: ${{ github.token }}
          TALARIA_S3_ENDPOINT: ${{ vars.TALARIA_S3_ENDPOINT }}
          TALARIA_S3_REGION: ${{ vars.TALARIA_S3_REGION }}
          TALARIA_S3_BUCKET: talaria-ci
          TALARIA_S3_ACCESS_KEY_ID: ${{ secrets.TALARIA_CI_S3_ACCESS_KEY_ID }}
          TALARIA_S3_SECRET_ACCESS_KEY: ${{ secrets.TALARIA_CI_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          # Wait for this run's newest probe at or before this attempt. "Re-run failed jobs"
          # keeps an earlier successful probe and copies its record, without annotations,
          # into the new attempt, so the annotation (written only by the probe job that ran)
          # is searched newest-first across the successful probe records.
          deadline=$((SECONDS + 1500))
          while :; do
            # shellcheck disable=SC2016 # jq, not the shell, expands $ENV.
            probes=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=all&per_page=100" \
              --jq '.jobs[] | select(.name == "Web contract probe" and .run_attempt <= ($ENV.GITHUB_RUN_ATTEMPT | tonumber)) | "\(.run_attempt) \(.id) \(.status) \(.conclusion)"' \
              | sort -rn)
            read -r _ _ newest_status newest_conclusion _ <<< "$(head -n 1 <<< "${probes}") - - - -"
            [[ "${newest_status}" == "completed" ]] && break
            (( SECONDS < deadline )) || { echo "Timed out waiting for the Web contract probe (${probes:-missing})" >&2; exit 1; }
            sleep 15
          done
          [[ "${newest_conclusion}" == "success" ]] || { echo "Web contract probe finished ${newest_conclusion}" >&2; exit 1; }
          notice=""
          while read -r _ id status conclusion; do
            [[ "${status}" == "completed" && "${conclusion}" == "success" ]] || continue
            notice=$(gh api "repos/${GITHUB_REPOSITORY}/check-runs/${id}/annotations" \
              --jq '[.[] | select(.title == "contract-fixture") | .message] | if length == 1 then .[0] else "" end')
            [[ -n "${notice}" ]] && break
          done <<< "${probes}"
          [[ "${notice}" =~ ^key=(fixtures/pr-ci/${GITHUB_RUN_ID}/[0-9]+/live-responses\.json)\ sha256=([a-f0-9]{64})$ ]] \
            || { echo "The probe did not publish exactly one valid fixture annotation" >&2; exit 1; }
          fixture_key=${BASH_REMATCH[1]}
          fixture_sha256=${BASH_REMATCH[2]}
          fixture="$RUNNER_TEMP/contract-fixture/live-responses.json"
          ../scripts/s3-artifact get "${fixture_key}" "${fixture}"
          echo "${fixture_sha256}  ${fixture}" | shasum -a 256 --check
          # xcodebuild strips TEST_RUNNER_ and hands the path to the simulator test process.
          # The scheme is parallelizable, so without -parallel-testing-enabled NO this single
          # test would clone the simulator while the main run's clones are still torn down.
          TEST_RUNNER_TALARIA_LIVE_CONTRACT_RESPONSES="${fixture}" xcodebuild test-without-building \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${LIVE_CONTRACT_RESULT_BUNDLE_PATH}" \
            -disableAutomaticPackageResolution \
            -collect-test-diagnostics never \
            -parallel-testing-enabled NO \
            -only-testing:"${LIVE_CONTRACT_TEST}" \
            APP_IDENTIFIER_SUFFIX=.xctest \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=
          # A missing fixture makes the test skip, so require an explicit pass.
          xcrun xcresulttool get test-results tests --path "${LIVE_CONTRACT_RESULT_BUNDLE_PATH}" --compact \
            | /usr/bin/jq -e --arg id "test://com.apple.xcode/Talaria/${LIVE_CONTRACT_TEST}" '
                [.. | objects | select(.nodeType? == "Test Case" and ((.nodeIdentifierURL? // "") | startswith($id)))]
                | length == 1 and .[0].result == "Passed"
              ' >/dev/null || { echo "The live Web contract test did not pass against the fixture" >&2; exit 1; }
          echo "- Live Web contract test: ${fixture_key} (${fixture_sha256}), $((SECONDS - start_seconds))s including the probe wait" >> "${GITHUB_STEP_SUMMARY}"

      - name: Report slowest tests
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -d "${RESULT_BUNDLE_PATH}" ]]; then
            echo "No result bundle is available; skipping slow-test reporting."
            exit 0
          fi

          xcrun xcresulttool get test-results tests \
            --path "${RESULT_BUNDLE_PATH}" \
            --compact > test-results.json

          python3 - <<'PY' | tee slowest-tests.txt
          import json

          with open("test-results.json", encoding="utf-8") as results_file:
              results = json.load(results_file)

          tests = []

          def visit(node, parents):
              name = node.get("name", "<unnamed>")
              node_type = node.get("nodeType")
              path = [*parents, name]
              duration = node.get("durationInSeconds")
              if node_type == "Test Case" and isinstance(duration, (int, float)):
                  tests.append((duration, " / ".join(path)))
              for child in node.get("children", []):
                  visit(child, path)

          for root in results.get("testNodes", []):
              visit(root, [])

          print("Slowest test cases:")
          for duration, name in sorted(tests, reverse=True)[:20]:
              print(f"{duration:8.3f}s  {name}")
          PY

          {
            echo ""
            echo "#### Slowest test cases"
            echo '```text'
            cat slowest-tests.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Reject skipped UI tests
        run: |
          options=()
          if [[ "${APP_TESTS_REQUIRED}" == "true" && "${APP_UI_REQUIRED}" == "false" ]]; then options+=(--require-launch-smoke); fi
          scripts/assert-no-skipped-ui-tests "${RESULT_BUNDLE_PATH}" "${options[@]}"

      # Performance budgets are only useful against previous runs, so every run
      # keeps its measurements as an artifact and prints them into the summary.
      - name: Record performance metrics
        if: always()
        continue-on-error: true
        run: scripts/report-performance-metrics "${RESULT_BUNDLE_PATH}"

      - name: Store performance metrics on the NAS
        if: always()
        continue-on-error: true
        env:
          TALARIA_S3_ENDPOINT: ${{ vars.TALARIA_S3_ENDPOINT }}
          TALARIA_S3_REGION: ${{ vars.TALARIA_S3_REGION }}
          TALARIA_S3_BUCKET: talaria-ci
          TALARIA_S3_ACCESS_KEY_ID: ${{ secrets.TALARIA_CI_S3_ACCESS_KEY_ID }}
          TALARIA_S3_SECRET_ACCESS_KEY: ${{ secrets.TALARIA_CI_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          prefix="performance-metrics/pr-ci/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
          for file in performance-metrics.json performance-metrics.txt; do
            [[ -f "$file" ]] || continue
            ../scripts/s3-artifact put "$prefix/$file" "$file"
            echo "- Performance metrics: talaria-ci/$prefix/$file (expires after 30 days)" >> "${GITHUB_STEP_SUMMARY}"
          done

      - name: Store test results on the NAS on failure
        if: failure()
        continue-on-error: true
        env:
          TALARIA_S3_ENDPOINT: ${{ vars.TALARIA_S3_ENDPOINT }}
          TALARIA_S3_REGION: ${{ vars.TALARIA_S3_REGION }}
          TALARIA_S3_BUCKET: talaria-ci
          TALARIA_S3_ACCESS_KEY_ID: ${{ secrets.TALARIA_CI_S3_ACCESS_KEY_ID }}
          TALARIA_S3_SECRET_ACCESS_KEY: ${{ secrets.TALARIA_CI_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          [[ -d "${RESULT_BUNDLE_PATH}" ]] || exit 0
          key="test-results/pr-ci/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${RESULT_BUNDLE_PATH}.tar"
          tar -cf "${RESULT_BUNDLE_PATH}.tar" "${RESULT_BUNDLE_PATH}"
          ../scripts/s3-artifact put "$key" "${RESULT_BUNDLE_PATH}.tar"
          echo "- Result bundle: talaria-ci/$key (expires after 14 days)" >> "${GITHUB_STEP_SUMMARY}"

  tooling:
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/repository-tooling.yml
    with:
      full: ${{ needs.changes.result != 'success' || needs.changes.outputs.tooling != 'false' }}

  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web_server != 'false' || needs.changes.outputs.web_frontend != 'false') }}
    uses: ./.github/workflows/web-verify.yml
    with:
      server: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_server != 'false' }}
      frontend: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_frontend != 'false' }}

  web-docker:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker != 'false') }}
    uses: ./.github/workflows/web-docker-smoke.yml
    secrets:
      TALARIA_CI_S3_ACCESS_KEY_ID: ${{ secrets.TALARIA_CI_S3_ACCESS_KEY_ID }}
      TALARIA_CI_S3_SECRET_ACCESS_KEY: ${{ secrets.TALARIA_CI_S3_SECRET_ACCESS_KEY }}

  relay:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relay != 'false') }}
    uses: ./.github/workflows/relay-verify.yml

  contracts:
    name: Web contract probe
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.contracts != 'false') }}
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 20
    outputs:
      fixture: ${{ steps.fixture.outputs.name }}
      fixture_sha256: ${{ steps.fixture.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the probe runtime (zsh script, node-pty native toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh make g++ python3
      - name: Set up Node for the disposable Web server
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Probe local Web HTTP and SSE contracts and record the live responses
        run: scripts/validate-upstream-contract --server-only --responses-output "$RUNNER_TEMP/contract-fixture/live-responses.json"
      # The Build and Test job on the Mac runner starts without waiting for this
      # job. After its own suite it reads the key and digest from this job's
      # annotation, which only this job can write, and runs the native live
      # decoding test against the fixture, so Web changes need no separate Mac job.
      - name: Store the live response fixture on the NAS
        id: fixture
        env:
          TALARIA_S3_ENDPOINT: ${{ vars.TALARIA_S3_ENDPOINT }}
          TALARIA_S3_REGION: ${{ vars.TALARIA_S3_REGION }}
          TALARIA_S3_BUCKET: talaria-ci
          TALARIA_S3_ACCESS_KEY_ID: ${{ secrets.TALARIA_CI_S3_ACCESS_KEY_ID }}
          TALARIA_S3_SECRET_ACCESS_KEY: ${{ secrets.TALARIA_CI_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/contract-fixture/live-responses.json"
          key="fixtures/pr-ci/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/live-responses.json"
          ../scripts/s3-artifact put "$key" "$fixture"
          sha256=$(sha256sum "$fixture" | cut -d' ' -f1)
          echo "name=$key" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "::notice title=contract-fixture::key=$key sha256=$sha256"

  gate:
    name: CI Gate
    needs: [changes, test, app-tooling, tooling, web, web-docker, relay, contracts]
    if: always()
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check selected suite results
        working-directory: .
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed-components.py --check-results
