# Pull requests and main pushes run suites selected by the complete changed-path diff;
# the full iOS UI suite runs on main pushes only (pull requests run a launch smoke test).
# Release metadata always validates; uncertain classification runs every suite.
# The always-reporting CI Gate is the required check, including skipped jobs.
#
# Every job runs on GitHub-hosted runners and uses no repository secrets (TAL-380); handoffs are
# Actions artifacts. Hosted macOS allows five concurrent jobs, so only Xcode work runs there: one
# build, then two unit-test shards for a pull request or four full-suite shards for a main push.
# A manual run with full_ui proves the main-push path on any branch before merge.
#
# Builds are signed ad hoc (CODE_SIGN_IDENTITY=-), which needs no certificate,
# no profile and no secrets, but does embed entitlements. Without them the app
# group is unavailable, so the share extension cannot hand anything to the app
# and ShareExtensionUITests would be testing nothing (TAL-81).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_ui:
        description: Run the main-push App suite (build plus four full unit and UI shards).
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

env:
  XCODE_VERSION: "27.0"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      app_tooling: ${{ steps.filter.outputs.app_tooling }}
      web_server: ${{ steps.filter.outputs.web_server }}
      web_frontend: ${{ steps.filter.outputs.web_frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      relay: ${{ steps.filter.outputs.relay }}
      contracts: ${{ steps.filter.outputs.contracts }}
      tooling: ${{ steps.filter.outputs.tooling }}
    steps:
      # Classification needs history and trees for the merge-base and diff, not every historical blob;
      # git fetches the few file contents it compares on demand (TAL-317).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts
      - name: Classify changed files
        working-directory: .
        id: filter
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python3 scripts/changed-components.py --base="$PUSH_BASE" --head="$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # A manual run proves the whole pipeline: every suite runs.
            python3 scripts/changed-components.py >> "$GITHUB_OUTPUT"
          else
            # Event base.sha can predate a merged parent PR. Checkout fetched
            # the current base branch, as release-fragment validation also uses.
            python3 scripts/changed-components.py --base="refs/remotes/origin/${PR_BASE_REF}" --head="$PR_HEAD" --merge-base >> "$GITHUB_OUTPUT"
          fi

  app-tooling:
    name: App tooling
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app_tooling != 'false') }}
    # macOS for shlock and lockf, not Xcode: these tests fake xcrun and xcodebuild.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test local XCTest admission and synthetic simulator leases
        run: |
          scripts/test-test-ios 20
          scripts/test-ios-simulator-pool

  app-build:
    name: App build
    # Runs for App changes and for Web/contract changes; Web/contract-only
    # changes run just the native contract classes in one shard.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app != 'false' || needs.changes.outputs.contracts != 'false') }}
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      app_tests: ${{ steps.plan.outputs.app_tests }}
      ui: ${{ steps.plan.outputs.ui }}
    env:
      APP_TESTS_REQUIRED: ${{ needs.changes.result != 'success' || needs.changes.outputs.app != 'false' }}
      # PRs run the unit tests plus one launch smoke test; the full UI suite runs on main pushes (TAL-332).
      APP_UI_REQUIRED: ${{ github.event_name == 'push' || inputs.full_ui == true }}
    steps:
      - name: Plan the test shards
        id: plan
        # Runs before checkout, so app/ does not exist yet.
        working-directory: .
        run: |
          set -euo pipefail
          if [[ "${APP_TESTS_REQUIRED}" == "false" ]]; then
            shards='[0]'
          elif [[ "${APP_UI_REQUIRED}" == "true" ]]; then
            shards='[0,1,2,3]'
          else
            shards='[0,1]'
          fi
          { echo "shards=${shards}"; echo "app_tests=${APP_TESTS_REQUIRED}"; echo "ui=${APP_UI_REQUIRED}"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcode
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Restore SwiftPM checkouts
        uses: actions/cache@v6
        with:
          path: app/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('app/Talaria.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          # The simulator runtime matching the selected Xcode's SDK, on the model the pool and references use.
          sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          export IOS_SIMULATOR_RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${sdk_version//./-}"
          export IOS_SIMULATOR_DEVICE_TYPE=com.apple.CoreSimulator.SimDeviceType.iPhone-17
          simulator_id=$(scripts/select-ios-simulator | cut -f1)
          echo "Using simulator ${simulator_id} on ${IOS_SIMULATOR_RUNTIME}"
          echo "id=${simulator_id}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild build-for-testing \
            -project Talaria.xcodeproj \
            -scheme Talaria \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -derivedDataPath DerivedData \
            -disableAutomaticPackageResolution \
            -showBuildTimingSummary \
            APP_IDENTIFIER_SUFFIX=.xctest \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=
          echo "- Build for testing: $((SECONDS - start_seconds))s" >> "${GITHUB_STEP_SUMMARY}"
          # Artifacts drop file modes; a tar keeps the bundles' executables and signatures intact.
          tar -C DerivedData/Build -cf "${RUNNER_TEMP}/app-build.tar" Products

      - name: Upload the test build
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: ${{ runner.temp }}/app-build.tar
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  app-test:
    name: App tests (shard ${{ matrix.shard }})
    needs: [changes, app-build]
    if: ${{ !cancelled() && needs.app-build.result == 'success' }}
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
      # Reads this run's job list to wait for the Web contract probe.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.app-build.outputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
      SHARD_COUNT: ${{ strategy.job-total }}
      APP_TESTS_REQUIRED: ${{ needs.app-build.outputs.app_tests }}
      APP_UI_REQUIRED: ${{ needs.app-build.outputs.ui }}
      CONTRACTS_SELECTED: ${{ needs.changes.result != 'success' || needs.changes.outputs.contracts != 'false' }}
      RESULT_BUNDLE_PATH: TestResults.xcresult
      LAUNCH_SMOKE_TEST: TalariaUITests/ChatNavigationUITests/testChatSessionOpensFromList
      LIVE_CONTRACT_TEST: TalariaTests/APIClientSessionListTests/testLiveUpstreamContractResponsesDecodeWhenSupplied
      LIVE_CONTRACT_RESULT_BUNDLE_PATH: LiveContractResults.xcresult
      # Pinned to shard 0, which also runs the live contract test, so one shard proves them all.
      CONTRACT_TEST_CLASSES: >-
        TalariaTests/ContractReadinessTests
        TalariaTests/SharedContractTests
        TalariaTests/APIClientAuthAndErrorTests
        TalariaTests/APIClientSessionListTests
        TalariaTests/APIClientSessionMutationTests
        TalariaTests/SSEClientTests
        TalariaTests/StreamReconnectContractTests
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcode
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Create and boot simulator
        id: sim
        run: |
          set -euo pipefail
          sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
          export IOS_SIMULATOR_RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${sdk_version//./-}"
          export IOS_SIMULATOR_DEVICE_TYPE=com.apple.CoreSimulator.SimDeviceType.iPhone-17
          simulator_id=$(scripts/select-ios-simulator | cut -f1)
          # Boots while the build downloads; the test step's bootstatus -b finishes (or retries) the boot.
          xcrun simctl boot "${simulator_id}" || echo "Boot deferred to the test step"
          echo "Using simulator ${simulator_id} on ${IOS_SIMULATOR_RUNTIME}"
          echo "id=${simulator_id}" >> "$GITHUB_OUTPUT"

      - name: Download the test build
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: ${{ runner.temp }}

      - name: Unpack the build and select this shard's tests
        run: |
          set -euo pipefail
          mkdir -p Build
          tar -C Build -xf "${RUNNER_TEMP}/app-build.tar"
          if [[ "${APP_TESTS_REQUIRED}" == "false" ]]; then
            # Web/contract-only change: the fixture-backed native contract classes are the whole selection.
            for contract_class in ${CONTRACT_TEST_CLASSES}; do echo "-only-testing:${contract_class}"; done > selection.txt
            echo "-skip-testing:${LIVE_CONTRACT_TEST}" >> selection.txt
          else
            options=(--shards "${SHARD_COUNT}" --shard "${SHARD}")
            # A pull request: unit tests and one launch smoke test; main runs every UI test.
            [[ "${APP_UI_REQUIRED}" == "true" ]] || options+=(--targets TalariaTests --add "${LAUNCH_SMOKE_TEST}")
            for contract_class in ${CONTRACT_TEST_CLASSES}; do options+=(--pin "${contract_class}"); done
            python3 ci/test_shards.py "${options[@]}" > selection.txt
          fi
          echo "Shard ${SHARD} of ${SHARD_COUNT}: $(grep -c -- '-only-testing:' selection.txt) selected, $(grep -c -- '-skip-testing:' selection.txt) skipped entries"

      - name: Test without building
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "${SIMULATOR_ID}" -b >/dev/null
          start_seconds=${SECONDS}
          selection=()
          while IFS= read -r option; do selection+=("${option}"); done < selection.txt
          xctestrun=$(find Build/Products -maxdepth 1 -name '*.xctestrun' | head -n 1)
          # One worker on the shard's own simulator: no clones.
          xcodebuild test-without-building \
            -xctestrun "${xctestrun}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -testLanguage en \
            -testRegion US \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -collect-test-diagnostics never \
            -parallel-testing-enabled NO \
            "${selection[@]}"
          duration_seconds=$((SECONDS - start_seconds))
          if [[ "${CONTRACTS_SELECTED}" == "true" && "${SHARD}" == "0" ]]; then
            # Every native contract class must have passed.
            xcrun xcresulttool get test-results tests --path "${RESULT_BUNDLE_PATH}" --compact > contract-results.json
            for contract_class in ${CONTRACT_TEST_CLASSES}; do
              /usr/bin/jq -e --arg prefix "test://com.apple.xcode/Talaria/${contract_class}/" '
                any(.. | objects; .nodeType? == "Test Case" and .result? == "Passed" and ((.nodeIdentifierURL? // "") | startswith($prefix)))
              ' contract-results.json >/dev/null || { echo "Native contract class ${contract_class} did not pass" >&2; exit 1; }
            done
          fi
          echo "### App shard ${SHARD} of ${SHARD_COUNT}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Test without building (1 worker): ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Wait for the Web contract probe
        if: env.CONTRACTS_SELECTED == 'true' && matrix.shard == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Wait for this run's newest probe at or before this attempt. "Re-run failed jobs"
          # keeps an earlier successful probe, whose artifact belongs to the whole run.
          deadline=$((SECONDS + 1500))
          while :; do
            # shellcheck disable=SC2016 # jq, not the shell, expands $ENV.
            probes=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=all&per_page=100" \
              --jq '.jobs[] | select(.name == "Web contract probe" and .run_attempt <= ($ENV.GITHUB_RUN_ATTEMPT | tonumber)) | "\(.run_attempt) \(.id) \(.status) \(.conclusion)"' \
              | sort -rn)
            read -r _ _ newest_status newest_conclusion _ <<< "$(head -n 1 <<< "${probes}") - - - -"
            [[ "${newest_status}" == "completed" ]] && break
            (( SECONDS < deadline )) || { echo "Timed out waiting for the Web contract probe (${probes:-missing})" >&2; exit 1; }
            sleep 15
          done
          [[ "${newest_conclusion}" == "success" ]] || { echo "Web contract probe finished ${newest_conclusion}" >&2; exit 1; }

      - name: Download the probe's live response fixture
        if: env.CONTRACTS_SELECTED == 'true' && matrix.shard == 0
        uses: actions/download-artifact@v8
        with:
          name: contract-fixture
          path: ${{ runner.temp }}/contract-fixture

      - name: Run the live Web contract test against the probe fixture
        if: env.CONTRACTS_SELECTED == 'true' && matrix.shard == 0
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          fixture="${RUNNER_TEMP}/contract-fixture/live-responses.json"
          [[ -s "${fixture}" ]] || { echo "The probe artifact has no live-responses.json" >&2; exit 1; }
          xctestrun=$(find Build/Products -maxdepth 1 -name '*.xctestrun' | head -n 1)
          # xcodebuild strips TEST_RUNNER_ and hands the path to the simulator test process.
          TEST_RUNNER_TALARIA_LIVE_CONTRACT_RESPONSES="${fixture}" xcodebuild test-without-building \
            -xctestrun "${xctestrun}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -resultBundlePath "${LIVE_CONTRACT_RESULT_BUNDLE_PATH}" \
            -collect-test-diagnostics never \
            -parallel-testing-enabled NO \
            -only-testing:"${LIVE_CONTRACT_TEST}"
          # A missing fixture makes the test skip, so require an explicit pass.
          xcrun xcresulttool get test-results tests --path "${LIVE_CONTRACT_RESULT_BUNDLE_PATH}" --compact \
            | /usr/bin/jq -e --arg id "test://com.apple.xcode/Talaria/${LIVE_CONTRACT_TEST}" '
                [.. | objects | select(.nodeType? == "Test Case" and ((.nodeIdentifierURL? // "") | startswith($id)))]
                | length == 1 and .[0].result == "Passed"
              ' >/dev/null || { echo "The live Web contract test did not pass against the fixture" >&2; exit 1; }
          echo "- Live Web contract test: $((SECONDS - start_seconds))s including the probe wait" >> "${GITHUB_STEP_SUMMARY}"

      - name: Report slowest tests
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -d "${RESULT_BUNDLE_PATH}" ]]; then
            echo "No result bundle is available; skipping slow-test reporting."
            exit 0
          fi

          xcrun xcresulttool get test-results tests \
            --path "${RESULT_BUNDLE_PATH}" \
            --compact > test-results.json

          python3 - <<'PY' | tee slowest-tests.txt
          import json

          with open("test-results.json", encoding="utf-8") as results_file:
              results = json.load(results_file)

          tests = []

          def visit(node, parents):
              name = node.get("name", "<unnamed>")
              node_type = node.get("nodeType")
              path = [*parents, name]
              duration = node.get("durationInSeconds")
              if node_type == "Test Case" and isinstance(duration, (int, float)):
                  tests.append((duration, " / ".join(path)))
              for child in node.get("children", []):
                  visit(child, path)

          for root in results.get("testNodes", []):
              visit(root, [])

          print("Slowest test cases:")
          for duration, name in sorted(tests, reverse=True)[:20]:
              print(f"{duration:8.3f}s  {name}")
          PY

          {
            echo ""
            echo "#### Slowest test cases"
            echo '```text'
            cat slowest-tests.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Reject skipped UI tests
        run: |
          options=()
          # Exactly one pull-request shard owns the launch smoke test, and it must pass there.
          if grep -qx -- "-only-testing:${LAUNCH_SMOKE_TEST}" selection.txt; then options+=(--require-launch-smoke); fi
          scripts/assert-no-skipped-ui-tests "${RESULT_BUNDLE_PATH}" "${options[@]}"

      # Performance budgets are only useful against previous runs, so every run
      # keeps its measurements as an artifact and prints them into the summary.
      - name: Record performance metrics
        if: always()
        continue-on-error: true
        run: scripts/report-performance-metrics "${RESULT_BUNDLE_PATH}"

      - name: Upload performance metrics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: performance-metrics-shard-${{ matrix.shard }}
          path: |
            app/performance-metrics.json
            app/performance-metrics.txt
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore

      - name: Upload test results on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: |
            app/TestResults.xcresult
            app/LiveContractResults.xcresult
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore

  tooling:
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/repository-tooling.yml
    with:
      full: ${{ needs.changes.result != 'success' || needs.changes.outputs.tooling != 'false' }}

  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web_server != 'false' || needs.changes.outputs.web_frontend != 'false') }}
    uses: ./.github/workflows/web-verify.yml
    with:
      server: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_server != 'false' }}
      frontend: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_frontend != 'false' }}

  web-docker:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker != 'false') }}
    uses: ./.github/workflows/web-docker-smoke.yml

  relay:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relay != 'false') }}
    uses: ./.github/workflows/relay-verify.yml

  contracts:
    name: Web contract probe
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.contracts != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node for the disposable Web server
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install zsh for the probe script
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zsh
      - name: Probe local Web HTTP and SSE contracts and record the live responses
        run: scripts/validate-upstream-contract --server-only --responses-output "$RUNNER_TEMP/contract-fixture/live-responses.json"
      # App shard 0 starts without waiting for this job. After its own suite it waits for this job
      # through the jobs API, downloads this artifact and runs the native live decoding test against it.
      - name: Upload the live response fixture
        uses: actions/upload-artifact@v7
        with:
          name: contract-fixture
          path: ${{ runner.temp }}/contract-fixture/live-responses.json
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  gate:
    name: CI Gate
    needs: [changes, app-build, app-test, app-tooling, tooling, web, web-docker, relay, contracts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Check selected suite results
        working-directory: .
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed-components.py --check-results
