# Long-budget rerun of the untrusted-input fuzz properties (TAL-85).
#
# PR CI runs `UntrustedInputFuzzTests` at a small seed budget and skips
# `UntrustedInputFuzzSoakTests`; this workflow runs the soak class on its own so
# a wide seed sweep never slows a pull request. Both classes share one seed
# sequence, so a soak failure names a seed the PR class reproduces directly.
#
# Not a required check. A failure means a new minimized regression test and a
# fix belong on a branch, not that main is broken.
name: Fuzz Soak

on:
  schedule:
    - cron: "0 15 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-soak
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  soak:
    name: Untrusted input fuzz soak
    runs-on: xcode-27
    timeout-minutes: 60

    env:
      PROJECT_PATH: Talaria.xcodeproj
      SCHEME: Talaria
      DERIVED_DATA_PATH: DerivedData
      RESULT_BUNDLE_PATH: FuzzSoakResults.xcresult

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-xcode

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('app/Talaria.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          simulator_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [
              device
              for runtime, devices in data["devices"].items()
              if "iOS" in runtime
              for device in devices
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          preferred = "iPhone 17"
          selected = next((device for device in phones if device["name"] == preferred), phones[0] if phones else None)
          print(selected["udid"] if selected else "")
          ')
          if [[ -z "${simulator_id}" ]]; then
            echo "No available iPhone simulator found:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: ${simulator_id}"
          echo "id=${simulator_id}" >> "$GITHUB_OUTPUT"

      - name: Run the fuzz soak
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.id }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild test \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -testLanguage en \
            -testRegion US \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -disableAutomaticPackageResolution \
            -parallel-testing-enabled NO \
            -enableCodeCoverage NO \
            -only-testing:TalariaTests/UntrustedInputFuzzSoakTests \
            APP_IDENTIFIER_SUFFIX=.xctest \
            CODE_SIGNING_ALLOWED=NO
          echo "### Fuzz soak" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Duration: $((SECONDS - start_seconds))s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Retain the result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-soak-results-${{ github.run_attempt }}
          path: app/${{ env.RESULT_BUNDLE_PATH }}
          retention-days: 30
          if-no-files-found: ignore
