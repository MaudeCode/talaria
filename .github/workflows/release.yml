name: Validate component release tag

on:
  push:
    tags:
      - "app-v*"
      - "web-v*"
      - "web-exp-v*"
      - "relay-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed component tag to validate (no publication).
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: component-tag-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate signed tag and exact-main CI
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          fetch-depth: 0

      - name: Prepare Ruby runtime
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/hostedtoolcache

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Verify source and signature
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            app-v*) export RELEASE_COMPONENT=app ;;
            web-v*|web-exp-v*) export RELEASE_COMPONENT=web ;;
            relay-v*) export RELEASE_COMPONENT=relay ;;
            *) echo "Unknown component tag" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin main:refs/remotes/origin/main
          app/ci/validate_release_tag
          sha=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify successful exact-main CI
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ steps.tag.outputs.sha }}
          WAIT_FOR_MAIN_CI_SECONDS: "5400"
          MAIN_CI_POLL_SECONDS: "30"
        run: app/ci/require_successful_main_ci

      - name: Record validation boundary
        run: echo "Component tag validated. Publication requires the release-set cutover workflow." >> "$GITHUB_STEP_SUMMARY"
