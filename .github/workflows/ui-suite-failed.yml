# Hands a failed UI suite on main to the fix agent (TAL-655): one signed POST per failed, unscoped ui-suite.yml run on
# main, which files or updates a ticket and starts the fix. Scoped and branch runs, cancellations and successes send
# nothing. The receiver's URL and signing secret are the UI_SUITE_WEBHOOK_URL and UI_SUITE_WEBHOOK_SECRET Actions
# secrets; this is the only workflow that reads them. The body is JSON with run_id, run_url, head_sha, display_title
# and failed_jobs, signed like a GitHub webhook (x-hub-signature-256: sha256=<HMAC-SHA256 hex of the body>).

name: UI suite failure alert

on:
  workflow_run:
    workflows: [UI suite]
    types: [completed]

permissions: {}

jobs:
  notify:
    name: Send the failure to the fix agent
    if: >-
      github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main'
      && startsWith(github.event.workflow_run.display_title, 'UI suite on ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Post the signed failure report
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.UI_SUITE_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.UI_SUITE_WEBHOOK_SECRET }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          if [[ -z "$WEBHOOK_URL" || -z "$WEBHOOK_SECRET" ]]; then
            echo "::error::Set the UI_SUITE_WEBHOOK_URL and UI_SUITE_WEBHOOK_SECRET Actions secrets."
            exit 1
          fi
          failed_jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name]' | jq -sc 'add // []')
          body=$(jq -nc --arg run_id "$RUN_ID" --arg run_url "$RUN_URL" --arg head_sha "$HEAD_SHA" \
            --arg display_title "$TITLE" --argjson failed_jobs "$failed_jobs" \
            '{run_id: $run_id, run_url: $run_url, head_sha: $head_sha, display_title: $display_title, failed_jobs: $failed_jobs}')
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $NF}')
          curl -fsS --retry 3 -o /dev/null -X POST "$WEBHOOK_URL" -H "content-type: application/json" \
            -H "x-hub-signature-256: sha256=$signature" --data-binary "$body"
          printf 'Sent %s to the fix agent.\n' "$RUN_URL" | tee -a "$GITHUB_STEP_SUMMARY"
