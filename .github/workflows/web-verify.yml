name: Talaria Web verification

on:
  workflow_call:
    inputs:
      frontend:
        type: boolean
        default: true
      server:
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  server:
    if: inputs.server
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Native module toolchain (node-pty)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make g++ python3

      - name: Clean install (workspace lockfile is authoritative)
        run: npm ci --no-audit --no-fund

      - name: Build contracts
        run: npm run build -w packages/contracts

      - name: Contracts and server lint
        run: npm run lint -w packages/contracts && npm run lint -w packages/server

      - name: Contracts and server strict TypeScript
        run: npm run typecheck -w packages/contracts && npm run typecheck -w packages/server

      - name: Contracts and server Vitest
        run: npm test -w packages/contracts -- --maxWorkers=2 && npm test -w packages/server -- --maxWorkers=2

      - name: Generated OpenAPI document is committed
        run: |
          npm run openapi
          git diff --exit-code -- ../contracts/web-api.openapi.json

  sidecar:
    if: inputs.server
    name: Sidecar pytest against the pinned Agent
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv (the Agent's locked dependency resolver)
        run: python3 -m pip install --disable-pip-version-check "uv==0.11.3"

      - name: Provision the pinned Agent and run the sidecar suite
        working-directory: .
        env:
          HERMES_WEBUI_TEST_PYTHON: python3.13
        run: python3 scripts/check-agent-compatibility.py --skip-docker

  frontend:
    if: inputs.frontend
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/packages/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Native module toolchain (node-pty)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make g++ python3

      - name: Clean install (workspace lockfile is authoritative)
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Build contracts and server
        run: npm run build -w packages/contracts && npm run build -w packages/server
        working-directory: web

      - name: Locale parity gate
        run: npm run i18n:gate

      - name: Strict TypeScript
        run: npm run typecheck

      - name: ESLint (TypeScript, React, service worker, contract rules)
        run: npm run lint

      - name: Vitest
        run: npm test -- --maxWorkers=2

      - name: Deterministic production build
        run: npm run build:fast

      - name: Verify committed frontend assets
        run: |
          git diff --exit-code -- ../../static/dist
          test -z "$(git status --porcelain --untracked-files=all -- ../../static/dist)"

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Playwright end-to-end on the Node server with the fixture replay sidecar (desktop + mobile)
        run: ../../../scripts/check-web-browser
