name: Talaria Web verification

on:
  workflow_call:
    inputs:
      frontend:
        type: boolean
        default: true
      server:
        type: boolean
        default: true
      # The Agent-release sidecar matrix; ci.yml selects it apart from the server checks (TAL-1161).
      sidecar:
        type: boolean
        default: true
      # A pull request's Playwright plan (TAL-2391, scripts/web_browser_plan.py): `none` runs no browser job, `specs`
      # runs browser_specs in one job, and any other value, the default, runs every shard.
      browser:
        type: string
        default: full
      browser_specs:
        type: string
        default: "[]"
      # The commit to verify; empty for the triggering commit. A release verifies its selected commit (TAL-2396).
      ref:
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  server:
    if: inputs.server
    name: server (${{ matrix.storage }} storage, ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The server suite runs once per storage backend; postgres runs against an embedded PGlite the suite starts itself
    # (TAL-1067). Its server project is split across three shards, and the state-db-latency project, which runs alone,
    # gets a job of its own so its time never stacks on a shard's. The repository checks run once, in a json-backend job
    # without the suite, so no shard carries them (TAL-1066, TAL-1774).
    strategy:
      fail-fast: false
      matrix:
        storage: [json, sqlite, postgres]
        shard: [1/3, 2/3, 3/3, latency, checks]
        exclude:
          - storage: sqlite
            shard: checks
          - storage: postgres
            shard: checks
    env:
      TALARIA_STORAGE: ${{ matrix.storage }}
    # The S3 blob store conformance runs against a throwaway MinIO (TAL-1069); upstream stopped publishing
    # minio/minio images, so this pins the last Bitnami build, which starts the server by default.
    services:
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
        env:
          MINIO_ROOT_USER: talaria-ci
          MINIO_ROOT_PASSWORD: talaria-ci-synthetic
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Clean install (workspace lockfile is authoritative)
        run: npm ci --no-audit --no-fund

      - name: Build contracts
        run: npm run build -w packages/contracts

      # The server tests and npm-package checks serve the built frontend bundle, which is not committed (TAL-379).
      - name: Build the frontend bundle
        run: npm run build:fast -w packages/frontend

      - name: Contracts and server lint
        if: matrix.shard == 'checks'
        run: npm run lint -w packages/contracts && npm run lint -w packages/server

      - name: Contracts and server strict TypeScript
        if: matrix.shard == 'checks'
        run: npm run typecheck -w packages/contracts && npm run typecheck -w packages/server

      - name: Wait for MinIO
        if: matrix.shard != 'checks'
        run: timeout 60 bash -c 'until curl -fsS http://127.0.0.1:9000/minio/health/live; do sleep 1; done'

      - name: Contracts Vitest
        if: matrix.shard == 'checks'
        run: npm test -w packages/contracts -- --maxWorkers=2

      - name: Server Vitest
        if: matrix.shard != 'checks'
        env:
          TALARIA_TEST_BLOB_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: talaria-ci
          AWS_SECRET_ACCESS_KEY: talaria-ci-synthetic
          AWS_REGION: us-east-1
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARD" = latency ]; then set -- --project state-db-latency; else set -- --project server --shard="$SHARD"; fi
          npm test -w packages/server -- --maxWorkers=2 --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/test-report.xml" "$@"

      - name: Hold each test inside the run-time budget (TAL-2403)
        if: matrix.shard != 'checks'
        run: python3 ../scripts/check-test-durations.py "$RUNNER_TEMP/test-report.xml"

      - name: Generated OpenAPI document and What's New schema are committed
        if: matrix.shard == 'checks'
        run: |
          npm run openapi
          git diff --exit-code -- ../contracts/web-api.openapi.json ../contracts/whats-new.schema.json

      - name: Generated sidecar and server method schemas and Agent tool presentations are committed
        if: matrix.shard == 'checks'
        run: |
          npm run fixtures -w packages/contracts
          git diff --exit-code -- sidecar/tests/fixtures/schemas.json sidecar/tests/fixtures/server_schemas.json ../contracts/fixtures/tool-presentations.json

  agent-releases:
    if: inputs.sidecar
    name: Supported Agent releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.list.outputs.tags }}
      shards: ${{ steps.list.outputs.shards }}
      shard-count: ${{ steps.list.outputs.shard-count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            scripts
            web/sidecar

      # The release gate's shard count (check-release-agent.py SHARDS), so PR and release CI shard alike (TAL-1776).
      - name: Validate the support record and list its releases
        id: list
        working-directory: .
        run: |
          tags=$(python3 scripts/check-agent-compatibility.py --list)
          shards=$(python3 scripts/check-release-agent.py --list-shards)
          {
            echo "tags=$tags"
            echo "shards=$shards"
            echo "shard-count=$(jq length <<< "$shards")"
          } >> "$GITHUB_OUTPUT"

  # Every supported release runs native compatibility in shards of its sidecar suite. The shared runner selects
  # once-only work on the active pin.
  sidecar:
    needs: agent-releases
    name: Sidecar pytest against Agent ${{ matrix.release }} (${{ matrix.shard }}/${{ needs.agent-releases.outputs.shard-count }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.agent-releases.outputs.tags) }}
        shard: ${{ fromJSON(needs.agent-releases.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: web/sidecar/agent_support.json

      - name: Set up Node for server process-boundary proofs
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the server process-boundary proof runtime
        run: |
          npm ci --no-audit --no-fund
          npm run build -w packages/contracts
          npm run build -w packages/server

      - name: Install uv (the Agent's locked dependency resolver)
        run: python3 -m pip install --disable-pip-version-check "uv==0.11.3"

      - name: Provision the Agent release and run the sidecar suite
        working-directory: .
        env:
          RELEASE: ${{ matrix.release }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.agent-releases.outputs.shard-count }}
          TALARIA_SIDECAR_WORKERS: '4'
          # Read-only, for the Agent release API's published-release check.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-agent-compatibility.py --skip-docker --release "$RELEASE" --shard "$SHARD/$SHARDS" --receipt "$RUNNER_TEMP/agent-compatibility/$RELEASE.shard-$SHARD.json"

      - name: Hold each test inside the run-time budget (TAL-2403)
        working-directory: .
        run: python3 scripts/check-test-durations.py "$RUNNER_TEMP"/agent-compatibility/*.junit.xml

      # The join reads this receipt: the shard's result and the cases it ran.
      - name: Retain the Agent compatibility receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-compatibility-${{ matrix.release }}-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-compatibility
          retention-days: 7
          if-no-files-found: ignore

  # Joins sidecar: a failed shard job skips this one, which fails the CI Gate. It passes only when every supported
  # release's shards left passing receipts (a rerun keeps the shards that passed before) and together ran each of that
  # release's sidecar test cases exactly once, the release gate's proof (TAL-1776).
  sidecar-shards:
    needs: [agent-releases, sidecar]
    name: Sidecar shards ran every case once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            scripts
            web/sidecar/scripts

      - name: Download every shard's Agent compatibility receipt
        uses: actions/download-artifact@v8
        with:
          pattern: agent-compatibility-*
          path: ${{ runner.temp }}/agent-shards

      - name: Require a passing receipt for every supported Agent release's shards
        working-directory: .
        env:
          RELEASES: ${{ needs.agent-releases.outputs.tags }}
        run: python3 scripts/check-release-agent.py --verify-pr-shards --receipts "$RUNNER_TEMP/agent-shards" --releases "$RELEASES"

  frontend-checks:
    if: inputs.frontend
    name: frontend / checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/packages/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Clean install (workspace lockfile is authoritative)
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Build contracts and server
        run: npm run build -w packages/contracts && npm run build -w packages/server
        working-directory: web

      - name: Locale parity gate
        run: npm run i18n:gate

      - name: Oxlint (TypeScript, React, service worker, contract rules)
        run: npm run lint

      # The lint step's prelint already generated the i18n and route outputs this needs. TypeScript 7 is a Go binary;
      # collecting garbage less often saves about a quarter of its time here with no higher peak memory (TAL-1778).
      - name: Strict TypeScript
        env:
          GOGC: "400"
        run: npm run typecheck --ignore-scripts

      - name: Vitest
        run: npm test -- --maxWorkers=2 --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/test-report.xml"

      - name: Hold each test inside the run-time budget (TAL-2403)
        run: python3 ../../../scripts/check-test-durations.py "$RUNNER_TEMP/test-report.xml"

      - name: Production build
        run: npm run build:fast

  # The e2e suite serves the frontend bundle, which its setup rebuilds on every run (static/dist is not committed, TAL-379).
  # Playwright splits the spec files across the shards; each shard runs both projects for its files. Main, manual runs,
  # releases and any pull request the browser plan cannot narrow run every shard; production-cutover.yml reuses these
  # jobs by name, so a narrower run never carries it.
  frontend-e2e:
    if: inputs.frontend && inputs.browser != 'none' && inputs.browser != 'specs'
    name: frontend / e2e (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # With Playwright on one worker, a healthy shard takes about 8 to 10 minutes including the bundle build (green main
    # shards measured 9m30s–10m07s, TAL-2147); the cap is about 1.5x that, so a wedged runner still stops early.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/web-browser
        with:
          shard: ${{ matrix.shard }}/6
          name: ${{ matrix.shard }}

  # A pull request whose only browser inputs are independent spec files runs those files on both projects in one job
  # (TAL-2391), under a name of its own.
  frontend-e2e-specs:
    if: inputs.frontend && inputs.browser == 'specs'
    name: frontend / e2e (changed specs)
    runs-on: ubuntu-latest
    # At most ten spec files after the same setup as a shard, which runs about thirty.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/web-browser
        with:
          specs: ${{ inputs.browser_specs }}
          name: changed-specs
