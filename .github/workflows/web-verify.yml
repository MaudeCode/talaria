name: Talaria Web verification

on:
  workflow_call:
    inputs:
      python:
        type: boolean
        default: true
      frontend:
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  lint:
    if: inputs.python
    runs-on: ["ghar-set-maudecode"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install ruff

      - name: Ensure origin/main ref is available for the diff gate
        run: git fetch --no-tags --depth=1 origin main || true

      - name: Python syntax gate (whole tree — fails fast on any unparseable .py)
        run: python3 -m compileall -q api server.py bootstrap.py mcp_server.py tests scripts

      - name: Ruff forward gate (new/changed lines only)
        run: python3 scripts/ruff_lint.py --diff origin/main

      - name: Ruff whole-tree report (informational — never blocks)
        run: python3 scripts/ruff_lint.py --all

  frontend:
    if: inputs.frontend
    runs-on: ["ghar-set-maudecode"]
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Clean install (lockfile is authoritative)
        run: npm ci --no-audit --no-fund

      - name: Locale parity gate
        run: npm run i18n:gate

      - name: Strict TypeScript
        run: npm run typecheck

      - name: ESLint (TypeScript, React, service worker, contract rules)
        run: npm run lint

      - name: Vitest
        run: npm test -- --maxWorkers=2

      - name: Deterministic production build
        run: npm run build:fast

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Set up Python for the end-to-end server
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install server dependencies
        run: pip install -r ../requirements.txt

      - name: Playwright end-to-end (desktop + mobile)
        run: HERMES_E2E_PYTHON="$(command -v python)" ../../scripts/check-web-browser

  test:
    if: inputs.python
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/web/.codex-tmp/playwright
    runs-on: ["ghar-set-maudecode"]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
        shard: [0, 1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            **/setup.cfg
            **/requirements*.txt
            **/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyyaml>=6.0" "cryptography>=42.0" pytest pytest-timeout pytest-asyncio pytest-shard python-docx openpyxl python-pptx playwright
          pip install ruff || echo "ruff install failed — test_ruff_forward_lint.py will skip"
          pip install "mcp>=1.28,<2" || echo "mcp install failed — test_mcp_server.py will importorskip"

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pip show playwright | grep '^Version:' | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run tests (shard ${{ matrix.shard }} of 5)
        run: ../scripts/check-web-python tests/ -v --timeout=60 --shard-id=${{ matrix.shard }} --num-shards=5
