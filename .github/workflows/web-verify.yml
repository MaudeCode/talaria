name: Talaria Web verification

on:
  workflow_call:
    inputs:
      frontend:
        type: boolean
        default: true
      server:
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  server:
    if: inputs.server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Clean install (workspace lockfile is authoritative)
        run: npm ci --no-audit --no-fund

      - name: Build contracts
        run: npm run build -w packages/contracts

      # The server tests and npm-package checks serve the built frontend bundle, which is not committed (TAL-379).
      - name: Build the frontend bundle
        run: npm run build:fast -w packages/frontend

      - name: Contracts and server lint
        run: npm run lint -w packages/contracts && npm run lint -w packages/server

      - name: Contracts and server strict TypeScript
        run: npm run typecheck -w packages/contracts && npm run typecheck -w packages/server

      - name: Contracts and server Vitest
        run: npm test -w packages/contracts -- --maxWorkers=2 && npm test -w packages/server -- --maxWorkers=2

      - name: Generated OpenAPI document is committed
        run: |
          npm run openapi
          git diff --exit-code -- ../contracts/web-api.openapi.json

      - name: Generated sidecar result schemas are committed
        run: |
          npm run fixtures -w packages/contracts
          git diff --exit-code -- sidecar/tests/fixtures/schemas.json

  agent-releases:
    if: inputs.server
    name: Supported Agent releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.list.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            web/sidecar

      - name: Validate the support record and list its releases
        id: list
        working-directory: .
        run: echo "tags=$(python3 scripts/check-agent-compatibility.py --list)" >> "$GITHUB_OUTPUT"

  # Each supported Agent release runs the full sidecar suite. Unpromoted upstream releases are not in the record.
  sidecar:
    needs: agent-releases
    name: Sidecar pytest against Agent ${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.agent-releases.outputs.tags) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: web/sidecar/agent_support.json

      - name: Set up Node for the combined HTTP updater proof
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the HTTP updater proof runtime
        run: |
          npm ci --no-audit --no-fund
          npm run build -w packages/contracts
          npm run build -w packages/server

      - name: Install uv (the Agent's locked dependency resolver)
        run: python3 -m pip install --disable-pip-version-check "uv==0.11.3"

      - name: Check runner isolation and failure paths before the Agent suite
        run: HERMES_WEBUI_AGENT_DIR="$RUNNER_TEMP/synthetic-agent" sidecar/scripts/test.sh tests/test_suite_runner.py

      - name: Provision the Agent release and run the sidecar suite
        working-directory: .
        env:
          RELEASE: ${{ matrix.release }}
          TALARIA_SIDECAR_WORKERS: '4'
          # Read-only, for the Agent release API's published-release check.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import collections
          import json
          import os
          from pathlib import Path
          import platform
          import statistics
          import subprocess
          import sys
          import time
          import xml.etree.ElementTree as ET

          root = Path.cwd()
          tag = os.environ['RELEASE']
          base = Path(os.environ['RUNNER_TEMP']) / 'agent-compatibility'
          base.mkdir(parents=True, exist_ok=True)
          checker = root / 'scripts/check-agent-compatibility.py'
          active = json.loads((root / 'web/sidecar/agent_dependency.json').read_text())['x-talaria']['releaseTag']
          results = []
          reference = None
          memory_budget = os.sysconf('SC_PAGE_SIZE') * os.sysconf('SC_PHYS_PAGES') * .75 / 1024

          def trial(workers, receipt):
              global reference
              started, peak = time.monotonic(), 0
              receipt.parent.mkdir(parents=True, exist_ok=True)
              command = [sys.executable, str(checker), '--skip-docker', '--release', tag, '--receipt', str(receipt)]
              with receipt.with_suffix('.log').open('w') as log:
                  proc = subprocess.Popen(command, env={**os.environ, 'TALARIA_SIDECAR_WORKERS': str(workers)}, stdout=log, stderr=subprocess.STDOUT)
                  while proc.poll() is None:
                      listing = subprocess.check_output(['ps', '-eo', 'pid=,ppid=,rss='], text=True)
                      rows = [tuple(map(int, row.split())) for row in listing.splitlines() if len(row.split()) == 3]
                      owned = {proc.pid}
                      while True:
                          expanded = owned | {pid for pid, parent, rss in rows if parent in owned}
                          if expanded == owned:
                              break
                          owned = expanded
                      peak = max(peak, sum(rss for pid, parent, rss in rows if pid in owned))
                      time.sleep(.25)
              result = json.loads(receipt.read_text()) if receipt.exists() else {}
              record = {'workers': workers, 'wallSeconds': round(time.monotonic() - started, 3), 'peakTreeRssKiB': peak,
                        'exit': proc.returncode, 'counts': result.get('tests'), 'receipt': str(receipt.relative_to(base))}
              results.append(record)
              (base / f'{tag}.benchmark.json').write_text(json.dumps({'host': platform.platform(), 'cpus': os.cpu_count(),
                  'memoryBudgetKiB': memory_budget, 'source': result.get('webRevision'), 'results': results}, indent=2) + '\n')
              print(json.dumps(record), flush=True)
              if proc.returncode or result.get('result') != 'success':
                  print(receipt.with_suffix('.log').read_text()[-16000:], flush=True)
                  raise RuntimeError(f'Agent {tag}, {workers} workers failed; retain diagnostics and diagnose before choosing a setting')
              identity = {key: result[key] for key in ('sourceRevision', 'version', 'python', 'webRevision', 'tests')}
              nodes = collections.Counter(prop.get('value') for prop in ET.parse(receipt.with_suffix('.junit.xml')).findall('.//testcase/properties/property[@name="talaria_nodeid"]'))
              if reference is None:
                  reference = identity, nodes
              assert (identity, nodes) == reference, 'serial/parallel identity, verdict, counts, or node-ID coverage differed'
              return record

          # Provision the immutable Agent and initialize pytest before any measured run.
          subprocess.run([sys.executable, str(checker), '--skip-docker', '--skip-sidecar-tests', '--release', tag,
                          '--command', str(root / 'web/sidecar/scripts/test.sh'), '--collect-only'], check=True)
          if tag == active:
              for index, workers in enumerate((4, 1, 2, 8, 4, 8)):
                  trial(workers, base / tag / f'{index:02d}-{workers}.json')
              def medians():
                  return {workers: statistics.median(row['wallSeconds'] for row in results if row['workers'] == workers)
                          for workers in (1, 2, 4, 8) if all(row['peakTreeRssKiB'] <= memory_budget for row in results if row['workers'] == workers)}
              timings = medians()
              selected = min(timings, key=timings.get)
              if selected == 2:
                  trial(2, base / tag / 'repeat-2.json')
                  timings = medians()
                  selected = min(timings, key=timings.get)
              assert selected != 1 and timings[selected] < timings[1], 'no observed full-suite improvement; do not enable a parallel default'
              print('SELECTED', selected, 'median durations', timings, flush=True)
          else:
              trial(1, base / tag / 'serial.json')
              trial(4, base / tag / 'four.json')
              # Both promising counts are checked while active-pin tuning runs.
              selected = 8
          # Preserve a fresh canonical compatibility receipt and report per release.
          trial(selected, base / f'{tag}.json')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          with summary.open('a') as output:
              output.write(f'### {tag}: bounded sidecar worker tuning\n\n| Workers | Wall seconds | Peak tree RSS MiB | Counts |\n|---|---:|---:|---|\n')
              for row in results:
                  output.write(f"| {row['workers']} | {row['wallSeconds']} | {row['peakTreeRssKiB']/1024:.1f} | {row['counts']} |\n")
              output.write(f'\nSelected workers: {selected}. All trial identities, counts and node IDs matched.\n')
          PY

      - name: Retain the Agent compatibility receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-compatibility-${{ matrix.release }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-compatibility
          retention-days: 7
          if-no-files-found: ignore

  frontend-checks:
    if: inputs.frontend
    name: frontend / checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/packages/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Clean install (workspace lockfile is authoritative)
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Build contracts and server
        run: npm run build -w packages/contracts && npm run build -w packages/server
        working-directory: web

      - name: Locale parity gate
        run: npm run i18n:gate

      - name: Strict TypeScript
        run: npm run typecheck

      - name: ESLint (TypeScript, React, service worker, contract rules)
        run: npm run lint

      - name: Vitest
        run: npm test -- --maxWorkers=2

      - name: Production build
        run: npm run build:fast

  # The e2e suite serves the frontend bundle, which its setup rebuilds on every run (static/dist is not committed, TAL-379).
  # Playwright splits the spec files across the shards; each shard runs both projects for its files.
  frontend-e2e:
    if: inputs.frontend
    name: frontend / e2e (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # Healthy shards take under three minutes; a sick runner fails fast so the shard can be re-run.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: web/packages/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Clean install (workspace lockfile is authoritative)
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Build contracts and server
        run: npm run build -w packages/contracts && npm run build -w packages/server
        working-directory: web

      # check-web-browser installs Chromium into this directory and, in CI on Linux, its system libraries.
      - name: Restore the Playwright browsers
        uses: actions/cache@v6
        with:
          path: web/.codex-tmp/playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # Chromium's system packages (fonts, mesa, xvfb) come from the runner's apt mirror, which has taken over eight minutes
      # for 32 MB (TAL-432). Their .debs are cached per runner image and installed offline on a hit.
      - name: Name the runner image for the system-package cache
        id: runner-image
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium's system packages
        uses: actions/cache@v6
        with:
          path: web/.codex-tmp/playwright-apt
          key: playwright-apt-${{ steps.runner-image.outputs.id }}-${{ hashFiles('web/package-lock.json') }}

      - name: Playwright end-to-end on the Node server with the fixture replay sidecar (desktop + mobile)
        run: ../../../scripts/check-web-browser --shard=${{ matrix.shard }}/6
        env:
          PLAYWRIGHT_APT_CACHE: ${{ github.workspace }}/web/.codex-tmp/playwright-apt
