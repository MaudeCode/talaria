name: Talaria Web verification

on:
  workflow_call:
    inputs:
      frontend:
        type: boolean
        default: true
      server:
        type: boolean
        default: true
      # The Agent-release sidecar matrix; ci.yml selects it apart from the server checks (TAL-1161).
      sidecar:
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  server:
    if: inputs.server
    name: server (${{ matrix.storage }} storage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The server suite runs once per storage backend; the repository checks run once, on the default (TAL-1066).
    strategy:
      fail-fast: false
      matrix:
        storage: [json, sqlite]
    env:
      TALARIA_STORAGE: ${{ matrix.storage }}
    # The S3 blob store conformance runs against a throwaway MinIO (TAL-1069); upstream stopped publishing
    # minio/minio images, so this pins the last Bitnami build, which starts the server by default.
    services:
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
        env:
          MINIO_ROOT_USER: talaria-ci
          MINIO_ROOT_PASSWORD: talaria-ci-synthetic
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Clean install (workspace lockfile is authoritative)
        run: npm ci --no-audit --no-fund

      - name: Build contracts
        run: npm run build -w packages/contracts

      # The server tests and npm-package checks serve the built frontend bundle, which is not committed (TAL-379).
      - name: Build the frontend bundle
        run: npm run build:fast -w packages/frontend

      - name: Contracts and server lint
        if: matrix.storage == 'json'
        run: npm run lint -w packages/contracts && npm run lint -w packages/server

      - name: Contracts and server strict TypeScript
        if: matrix.storage == 'json'
        run: npm run typecheck -w packages/contracts && npm run typecheck -w packages/server

      - name: Wait for MinIO
        run: timeout 60 bash -c 'until curl -fsS http://127.0.0.1:9000/minio/health/live; do sleep 1; done'

      - name: Contracts Vitest
        if: matrix.storage == 'json'
        run: npm test -w packages/contracts -- --maxWorkers=2

      - name: Server Vitest
        env:
          TALARIA_TEST_BLOB_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: talaria-ci
          AWS_SECRET_ACCESS_KEY: talaria-ci-synthetic
          AWS_REGION: us-east-1
        run: npm test -w packages/server -- --maxWorkers=2

      - name: Generated OpenAPI document and What's New schema are committed
        if: matrix.storage == 'json'
        run: |
          npm run openapi
          git diff --exit-code -- ../contracts/web-api.openapi.json ../contracts/whats-new.schema.json

      - name: Generated sidecar and server method schemas are committed
        if: matrix.storage == 'json'
        run: |
          npm run fixtures -w packages/contracts
          git diff --exit-code -- sidecar/tests/fixtures/schemas.json sidecar/tests/fixtures/server_schemas.json

  agent-releases:
    if: inputs.sidecar
    name: Supported Agent releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.list.outputs.tags }}
      shards: ${{ steps.list.outputs.shards }}
      shard-count: ${{ steps.list.outputs.shard-count }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            web/sidecar

      # The release gate's shard count (check-release-agent.py SHARDS), so PR and release CI shard alike (TAL-1776).
      - name: Validate the support record and list its releases
        id: list
        working-directory: .
        run: |
          tags=$(python3 scripts/check-agent-compatibility.py --list)
          shards=$(python3 scripts/check-release-agent.py --list-shards)
          {
            echo "tags=$tags"
            echo "shards=$shards"
            echo "shard-count=$(jq length <<< "$shards")"
          } >> "$GITHUB_OUTPUT"

  # Every supported release runs native compatibility in shards of its sidecar suite. The shared runner selects
  # once-only work on the active pin.
  sidecar:
    needs: agent-releases
    name: Sidecar pytest against Agent ${{ matrix.release }} (${{ matrix.shard }}/${{ needs.agent-releases.outputs.shard-count }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.agent-releases.outputs.tags) }}
        shard: ${{ fromJSON(needs.agent-releases.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: web/sidecar/agent_support.json

      - name: Set up Node for server process-boundary proofs
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the server process-boundary proof runtime
        run: |
          npm ci --no-audit --no-fund
          npm run build -w packages/contracts
          npm run build -w packages/server

      - name: Install uv (the Agent's locked dependency resolver)
        run: python3 -m pip install --disable-pip-version-check "uv==0.11.3"

      - name: Provision the Agent release and run the sidecar suite
        working-directory: .
        env:
          RELEASE: ${{ matrix.release }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.agent-releases.outputs.shard-count }}
          TALARIA_SIDECAR_WORKERS: '4'
          # Read-only, for the Agent release API's published-release check.
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-agent-compatibility.py --skip-docker --release "$RELEASE" --shard "$SHARD/$SHARDS" --receipt "$RUNNER_TEMP/agent-compatibility/$RELEASE.shard-$SHARD.json"

      # The join reads this receipt: the shard's result and the cases it ran.
      - name: Retain the Agent compatibility receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-compatibility-${{ matrix.release }}-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-compatibility
          retention-days: 7
          if-no-files-found: ignore

  # Joins sidecar: a failed shard job skips this one, which fails the CI Gate. It passes only when every supported
  # release's shards left passing receipts (a rerun keeps the shards that passed before) and together ran each of that
  # release's sidecar test cases exactly once, the release gate's proof (TAL-1776).
  sidecar-shards:
    needs: [agent-releases, sidecar]
    name: Sidecar shards ran every case once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts
            web/sidecar/scripts

      - name: Download every shard's Agent compatibility receipt
        uses: actions/download-artifact@v8
        with:
          pattern: agent-compatibility-*
          path: ${{ runner.temp }}/agent-shards

      - name: Require a passing receipt for every supported Agent release's shards
        working-directory: .
        env:
          RELEASES: ${{ needs.agent-releases.outputs.tags }}
        run: python3 scripts/check-release-agent.py --verify-pr-shards --receipts "$RUNNER_TEMP/agent-shards" --releases "$RELEASES"

  frontend-checks:
    if: inputs.frontend
    name: frontend / checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web/packages/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Clean install (workspace lockfile is authoritative)
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Build contracts and server
        run: npm run build -w packages/contracts && npm run build -w packages/server
        working-directory: web

      - name: Locale parity gate
        run: npm run i18n:gate

      - name: Strict TypeScript
        run: npm run typecheck

      - name: ESLint (TypeScript, React, service worker, contract rules)
        run: npm run lint

      - name: Vitest
        run: npm test -- --maxWorkers=2

      - name: Production build
        run: npm run build:fast

  # The e2e suite serves the frontend bundle, which its setup rebuilds on every run (static/dist is not committed, TAL-379).
  # Playwright splits the spec files across the shards; each shard runs both projects for its files.
  frontend-e2e:
    if: inputs.frontend
    name: frontend / e2e (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # Healthy shards take under three minutes; a sick runner fails fast so the shard can be re-run.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: web/packages/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Clean install (workspace lockfile is authoritative)
        run: npm ci --no-audit --no-fund
        working-directory: web

      - name: Build contracts and server
        run: npm run build -w packages/contracts && npm run build -w packages/server
        working-directory: web

      # check-web-browser installs Chromium into this directory and, in CI on Linux, its system libraries.
      - name: Restore the Playwright browsers
        uses: actions/cache@v6
        with:
          path: web/.codex-tmp/playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # Chromium's system packages (fonts, mesa, xvfb) come from the runner's apt mirror, which has taken over eight minutes
      # for 32 MB (TAL-432). Their .debs are cached per runner image and installed offline on a hit.
      # Reuse that image's packages when an unrelated dependency changes the lockfile.
      - name: Name the runner image for the system-package cache
        id: runner-image
        run: echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium's system packages
        uses: actions/cache@v6
        with:
          path: web/.codex-tmp/playwright-apt
          key: playwright-apt-${{ steps.runner-image.outputs.id }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            playwright-apt-${{ steps.runner-image.outputs.id }}-

      - name: Playwright end-to-end on the Node server with the fixture replay sidecar (desktop + mobile)
        run: ../../../scripts/check-web-browser --shard=${{ matrix.shard }}/6
        env:
          PLAYWRIGHT_APT_CACHE: ${{ github.workspace }}/web/.codex-tmp/playwright-apt
