name: Recover failed cutover App publication

on:
  workflow_dispatch:
    inputs:
      original_run:
        description: Failed production-cutover run whose Relay and Web publications succeeded.
        required: true
        type: string
      original_attempt:
        description: Failed attempt with the verified signed IPA.
        required: true
        type: string
      confirm_publication:
        description: Resume that immutable App upload and publish its completed release set.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: talaria-release-set
  cancel-in-progress: false

jobs:
  app:
    if: github.ref == 'refs/heads/main' && inputs.confirm_publication
    # macOS: ios-publish verifies the IPA's signature and profiles before it uploads.
    runs-on: xcode-27
    environment: testflight
    concurrency:
      group: talaria-testflight-publication
      cancel-in-progress: false
    timeout-minutes: 60
    outputs:
      source: ${{ steps.restore.outputs.source }}
      artifacts: ${{ steps.store.outputs.artifacts }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-xcode
      - uses: ./.github/actions/release-python
      # Only the authenticated original run's job outputs name which artifacts
      # of that run may be downloaded, and each must match its recorded digest.
      - name: Authenticate original run and restore immutable handoffs
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.original_run }}
          ORIGINAL_ATTEMPT: ${{ inputs.original_attempt }}
        run: |
          "$RELEASE_PYTHON" releases/recover.py "$ORIGINAL_RUN" "$ORIGINAL_ATTEMPT" "$RUNNER_TEMP/recovered"
      - name: Preserve reviewed publishing tools and check out selected component source
        env:
          SOURCE: ${{ steps.restore.outputs.source }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/reviewed-publisher"
          git archive "$GITHUB_WORKFLOW_SHA" releases/publish.py app/ci/release_notes.py contracts/whats-new.schema.json |
            tar -x -C "$RUNNER_TEMP/reviewed-publisher"
          git checkout --detach "$SOURCE"
      # recover.py authenticates the successful original build/publication jobs
      # and their exact handoffs. A partially published set is not a dry run.
      - name: Authorize the original verified build and write its TestFlight notes
        id: verified
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/releases" "$RELEASE_PYTHON" "$RUNNER_TEMP/reviewed-publisher/releases/publish.py" verify-app \
            --plan "$RUNNER_TEMP/recovered/release-plan/plan.json" \
            --build "$RUNNER_TEMP/recovered/app-build/receipt.json" --directory "$RUNNER_TEMP/recovered/ios-ipa" \
            --notes "$RUNNER_TEMP/testflight-notes.txt"
          delimiter="notes-$(openssl rand -hex 16)"
          { echo "notes<<${delimiter}"; cat "$RUNNER_TEMP/testflight-notes.txt"; echo "${delimiter}"; } >> "$GITHUB_OUTPUT"
      # The same version and build number already in TestFlight is success; an unfinished upload is resumed.
      - name: Resume the original verified IPA and require Apple VALID readback
        id: upload
        uses: MaudeCode/.github/actions/ios-publish@eb704dbfc3862ea1143d5c7737d9f02bf97f49fa
        with:
          ipa: ${{ steps.verified.outputs.ipa }}
          bundle-id: dev.kil.talaria
          version: ${{ steps.verified.outputs.version }}
          build-number: ${{ steps.verified.outputs.build_number }}
          commit: ${{ steps.verified.outputs.commit }}
          upload: true
          whats-new: ${{ steps.verified.outputs.notes }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      - name: Record the uploaded build
        env:
          BUILD_ID: ${{ steps.upload.outputs.build-id }}
        run: |
          PYTHONPATH="$PWD/releases" "$RELEASE_PYTHON" "$RUNNER_TEMP/reviewed-publisher/releases/publish.py" app \
            --plan "$RUNNER_TEMP/recovered/release-plan/plan.json" \
            --build "$RUNNER_TEMP/recovered/app-build/receipt.json" --directory "$RUNNER_TEMP/recovered/ios-ipa" \
            --output "$RUNNER_TEMP/recovered/app-publish/receipt.json" --build-id "$BUILD_ID"
      - name: Stage verified handoffs with actual recovery-run identity
        id: store
        run: |
          set -euo pipefail
          paths=()
          # The IPA and dSYMs were consumed above; finalization reads only these receipt handoffs.
          for name in release-plan contract-receipts previous-app-receipts agent-receipts relay-build bridge-build web-build app-build relay-publish bridge-publish web-publish app-publish; do
            paths+=("$name" "$RUNNER_TEMP/recovered/$name")
          done
          "$RELEASE_PYTHON" releases/artifacts.py put "${paths[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.store.outputs.handoff_name }}
          path: ${{ steps.store.outputs.handoff_path }}
          retention-days: 30
          if-no-files-found: error
  publish-set:
    needs: app
    runs-on: ubuntu-latest
    environment: release-set-publication
    permissions:
      contents: write
      actions: read
    timeout-minutes: 20
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.app.outputs.source }}
      - uses: ./.github/actions/release-python
      - name: Restore verified recovery handoffs
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP/recovered" --receipts'
      - name: Assemble and publish the completed original release set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show "${GITHUB_WORKFLOW_SHA}:releases/publish.py" > "$RUNNER_TEMP/publish.py"
          "$RELEASE_PYTHON" releases/collect.py "$RUNNER_TEMP/recovered" "$RUNNER_TEMP/receipts"
          options=()
          previous="$RUNNER_TEMP/recovered/release-plan/previous.json"
          if [[ -f "$previous" ]]; then options+=(--previous "$previous"); fi
          "$RELEASE_PYTHON" releases/cli.py assemble --complete --plan "$RUNNER_TEMP/recovered/release-plan/plan.json" \
            --receipts "$RUNNER_TEMP/receipts" --notes "$RUNNER_TEMP/recovered/release-plan/notes" \
            --output "$RUNNER_TEMP/completed/release-set.json" "${options[@]}"
          # finalize creates the release-set-<sha> tag its release attaches to, unless the original run already did.
          PYTHONPATH="$PWD/releases" "$RELEASE_PYTHON" "$RUNNER_TEMP/publish.py" finalize \
            --plan "$RUNNER_TEMP/recovered/release-plan/plan.json" --manifest "$RUNNER_TEMP/completed/release-set.json" \
            --directory "$RUNNER_TEMP/recovered" "${options[@]}"
      - name: Record the completed manifest
        run: cat "$RUNNER_TEMP/completed/release-set.json"
      - name: Retain the completed manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-set-complete-${{ github.run_attempt }}
          path: ${{ runner.temp }}/completed
          retention-days: 30
          if-no-files-found: error
  tag:
    # Tags last (TAL-2342): the original run never reached its tag job, so the recovered set's components get their
    # tags and GitHub releases here, and then the root vX.Y.Z tag the original release was dispatched for.
    needs:
      - app
      - publish-set
    runs-on: ubuntu-latest
    environment: release-set-publication
    permissions:
      contents: write
      actions: read
    timeout-minutes: 20
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.app.outputs.source }}
      - uses: ./.github/actions/release-python
      - name: Restore verified recovery handoffs
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP/recovered" --receipts'
      - name: Tag and release the components that shipped
        id: components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git show "${GITHUB_WORKFLOW_SHA}:releases/publish.py" > "$RUNNER_TEMP/publish.py"
          PYTHONPATH="$PWD/releases" "$RELEASE_PYTHON" "$RUNNER_TEMP/publish.py" tag-components \
            --plan "$RUNNER_TEMP/recovered/release-plan/plan.json" --directory "$RUNNER_TEMP/recovered"
      - name: Tag the release
        uses: MaudeCode/.github/actions/release-tag@08c2f55e411fda2d193638c89b3a923efdf66c0b
        with:
          tag: ${{ steps.components.outputs.release_tag }}
          sha: ${{ needs.app.outputs.source }}
