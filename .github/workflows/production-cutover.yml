name: Production cutover

on:
  workflow_dispatch:
    inputs:
      request:
        description: Reviewed release-plan JSON (sourceRevision, component tags, Relay deployment ID).
        required: true
        type: string
      previous_release_set:
        description: Previous completed release-set SHA; empty only for bootstrap.
        required: false
        default: ""
        type: string
      confirm_publication:
        description: Authorize Relay deployment, Web publication and TestFlight upload after validated gates.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit main-branch cutover authorization
        env:
          CONFIRMED: ${{ inputs.confirm_publication }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$CONFIRMED" == true ]]
  release:
    needs: authorization
    permissions:
      contents: write
      actions: read
      # app-tests.yml's test shards post failing tests as commit statuses (TAL-673).
      statuses: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release-set.yml
    secrets: inherit
    with:
      request: ${{ inputs.request }}
      previous_release_set: ${{ inputs.previous_release_set }}
      dry_run: false
