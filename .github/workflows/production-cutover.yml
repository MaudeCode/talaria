name: Release
run-name: Release ${{ inputs.tag }}

# Tags last (TAL-2342, MaudeCode/.github RELEASES.md): a release is one dispatch of this workflow on main, of a version
# (tag) and a commit (sha): any commit on main after the last release, frozen at preflight whatever merges afterwards.
# Preflight refuses anything but a dispatch on main under an unused later version, a commit not after the last release,
# or one whose workflow files differ from main's, and plans the components that changed since the last published
# release set. It does not wait for main CI (TAL-2396): preflight reports which named suites main CI already passed on
# the exact commit, the release reuses those and runs every other one itself. The release job builds, gates and publishes Relay, Web, the App and the
# release-set manifest; its last job creates the changed components' tags and then the root vX.Y.Z tag. A release that
# fails before then leaves no version tag, so the same version is dispatched again.
# npm's trusted publisher, release-set.yml, publish.py, ios-release-build.yml and recover.py all authorize this file
# by name: production-cutover.yml@refs/heads/main.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, such as v1.2.3
        required: true
        type: string
      sha:
        description: Full SHA of the commit to release; empty for the head of main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: talaria-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # preflight reads main CI's push run on the commit for the checks it already passed
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      checks: ${{ steps.check.outputs.checks }}
      request: ${{ steps.plan.outputs.request }}
      previous: ${{ steps.plan.outputs.previous }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: check
        uses: MaudeCode/.github/actions/release-preflight@7142f8bc63e5e63cdc7d0c4605f3a283de59624c
        with:
          tag: ${{ inputs.tag }}
          sha: ${{ inputs.sha }}
          # Each changed component's full suite in main CI (TAL-2396): the App's hosted tests, Web's server suite on
          # every storage backend with its frontend checks and Playwright shards, Relay's. A suite whose every job
          # already passed on the commit is reused; release-set.yml runs the others. Web's sidecar matrix is left out:
          # the release's Agent gate runs it against every supported Agent release.
          checks: |
            ci.yml: App / App hosted tests
            ci.yml: web / frontend / checks
            ci.yml: web / frontend / e2e (1/6)
            ci.yml: web / frontend / e2e (2/6)
            ci.yml: web / frontend / e2e (3/6)
            ci.yml: web / frontend / e2e (4/6)
            ci.yml: web / frontend / e2e (5/6)
            ci.yml: web / frontend / e2e (6/6)
            ci.yml: web / server (json storage, 1/3)
            ci.yml: web / server (json storage, 2/3)
            ci.yml: web / server (json storage, 3/3)
            ci.yml: web / server (json storage, latency)
            ci.yml: web / server (json storage, checks)
            ci.yml: web / server (sqlite storage, 1/3)
            ci.yml: web / server (sqlite storage, 2/3)
            ci.yml: web / server (sqlite storage, 3/3)
            ci.yml: web / server (sqlite storage, latency)
            ci.yml: web / server (postgres storage, 1/3)
            ci.yml: web / server (postgres storage, 2/3)
            ci.yml: web / server (postgres storage, 3/3)
            ci.yml: web / server (postgres storage, latency)
            ci.yml: relay / check

      # The workflow revision's release tooling plans the frozen commit, which its full history contains (TAL-2396).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/release-python

      - name: Plan the components that changed
        id: plan
        env:
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
          SOURCE: ${{ steps.check.outputs.sha }}
        run: |
          set -euo pipefail
          previous=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .published_at != null and (.tag_name | test("^release-set-[a-f0-9]{40}$"))) | "\(.published_at) \(.tag_name)"' \
            | sort | tail -1 | cut -d' ' -f2)
          previous="${previous#release-set-}"
          [[ "$previous" =~ ^[a-f0-9]{40}$ ]] || { echo "No published release set to release after." >&2; exit 1; }
          "$RELEASE_PYTHON" releases/cli.py previous "$previous" --output "$RUNNER_TEMP/previous.json"
          result=$("$RELEASE_PYTHON" releases/autorelease.py --tag "$RELEASE_TAG" --sha "$SOURCE" \
            --previous "$RUNNER_TEMP/previous.json" --output "$RUNNER_TEMP/request.json")
          echo "$result"
          {
            echo "request=$(jq -c . "$RUNNER_TEMP/request.json")"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release ${RELEASE_TAG}"
            echo "- Source: \`${SOURCE}\`, after release set \`${previous}\`"
            echo "- Changed: $(printf '%s' "$result" | jq -r '.changed | join(", ")')"
            echo "- Component tags, created after publication: $(printf '%s' "$result" | jq -r '.request.tags | to_entries | map(.value) | join(", ")')"
          } >> "$GITHUB_STEP_SUMMARY"

  # Holds workflow changes while the release runs (TAL-2516, RELEASES.md rule 6): fails the release-freeze commit
  # status on every open pull request that changes a workflow file, since one merged now would make GitHub refuse the
  # release's tag writes. The release needs it, so a release that could not set the freeze publishes nothing. The thaw
  # job passes the status again however the release ends.
  freeze:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, statuses: write, pull-requests: read, actions: read }
    steps:
      - uses: MaudeCode/.github/actions/release-freeze@20b180ba0237e316fcc65d83ed4e8f19ac5e16a7
        with: { mode: start, workflow: production-cutover.yml }
      # A workflow change that merged between preflight's check and the freeze would still break the tags, so compare
      # again now that no other can merge.
      - name: Check that main's workflows still match the release's commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          tree() { gh api "repos/${GITHUB_REPOSITORY}/contents/.github?ref=$1" --jq '.[] | select(.name == "workflows") | .sha'; }
          source_tree=$(tree "$SOURCE")
          main_tree=$(tree main)
          if [[ -z "$source_tree" || "$source_tree" != "$main_tree" ]]; then
            echo "::error::A workflow file changed on main after preflight checked it, so GitHub would refuse this release's tags. Nothing has published: dispatch the same version again from a later commit."
            exit 1
          fi

  release:
    # Every publishing job (relay-, web-, bridge- and app-publish, publish-set, tag) is in release-set.yml, so needing
    # freeze here keeps all of them behind it.
    needs: [preflight, freeze]
    permissions:
      contents: write
      actions: read
      # app-tests.yml's hosted tests post failing tests as commit statuses (TAL-673).
      statuses: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release-set.yml
    secrets: inherit
    with:
      request: ${{ needs.preflight.outputs.request }}
      previous_release_set: ${{ needs.preflight.outputs.previous }}
      dry_run: false
      release_tag: ${{ needs.preflight.outputs.tag }}
      checks: ${{ needs.preflight.outputs.checks }}

  thaw:
    needs: [preflight, freeze, release, alert]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { statuses: write, pull-requests: read, actions: read }
    steps:
      - uses: MaudeCode/.github/actions/release-freeze@20b180ba0237e316fcc65d83ed4e8f19ac5e16a7
        with: { mode: end, workflow: production-cutover.yml }

  alert:
    # Hands a release whose checks failed to the T3 repair dispatcher (TAL-2460, docs/main-ci-repair.md), as main CI's
    # alert job does: the same sender, webhook and signing secret. The dispatcher re-reads the run, repairs only the
    # failed test jobs and leaves build and publication to the release recovery path; a flake never re-releases.
    name: Hand the failure to T3
    needs: [preflight, release]
    if: >-
      always() && github.repository == 'MaudeCode/talaria' && github.ref == 'refs/heads/main'
      && needs.release.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      # Reads cancelled jobs' annotations for a timeout.
      checks: read
      # Reads the open repair claim and needs-a-person issues, so a red run starts a session only when it is new.
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Post the signed failure report
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ needs.release.result }}
          WEBHOOK_URL: ${{ secrets.MAIN_CI_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.MAIN_CI_WEBHOOK_SECRET }}
        run: python3 scripts/main-ci-failure.py send
