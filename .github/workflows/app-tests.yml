# Interface (stable; ci.yml and release-set.yml call it):
#   uses: ./.github/workflows/app-tests.yml   (the caller grants contents: read, actions: read and statuses: write)
#   with:
#     mode: hosted | build | contracts
#       Every mode runs the TalariaKit package tests with `swift test` on macOS, without a simulator: about
#       94% of the unit tests, including every native contract class (TAL-399).
#       That run measures TalariaKit/Sources coverage: the job summary shows it and the app-package-coverage
#       artifact keeps the per-file and per-line report (TAL-67).
#       hosted: plus the App build for testing (App, extensions and the hosted test bundle) and four simulator
#       jobs running the hosted unit tests (TalariaTests: UIKit views, App Intents and widget configuration types,
#       visual references, performance budgets, App bundle resources), split by class (ci/hosted-test-shard,
#       TAL-1550). Main pushes, manual runs, labelled pull requests and the release gate run it.
#       build: plus the App build for testing alone, beside the package tests: two macOS jobs. Other pull requests run
#       it (TAL-1896).
#       contracts: the package tests alone; a contract-only change leaves the App sources alone.
#     contracts: true | false  - the package tests also wait for this run's "Web contract probe" job and run the
#       live decoding test against its contract-fixture artifact.
#     ref: optional commit to check out (default: the triggering commit).
#     package_tests: false leaves out the full package suite (default true); a release runs the same suite in its
#       contracts job instead (TAL-414).
#     shards_at_once: how many hosted test shards run at a time (default 4, all of them). A release passes 2 to stay
#       within its three macOS jobs (TAL-2396).
#     package_lane, hosted_lane: full | explicit | empty (default full), and plan: the App test plan JSON of
#       `scripts/changed-components.py --app-plan` (default: none, both lanes full). A pull request or a main push runs
#       only the tests its diff reaches (TAL-2390, TAL-2544): an explicit package lane runs only its identifiers with a
#       filter, in the package job, then named "App selected package tests", or in hosted mode's build job, then named
#       "App build and selected package tests"; an explicit hosted lane runs only its identifiers. ci.yml passes
#       package_tests false for an empty package lane. Manual runs, including main's scheduled full run, and releases
#       pass no plan, so they run both targets in full.
#       A hosted lane that selects tests only a native iPhone Duo runs also gets the "App native Duo tests" shard
#       (TAL-1456, ci/hosted-test-shard): those tests on an iPhone Duo at setup-xcode's IOS_SIMULATOR_DUO_OS, beside the
#       lane's iPhone 17 shards. A runner image without a compatible Duo skips it with its reason in the summary.
#       Each lane's `repeat` lists the test methods the diff added or changed (TAL-2402). Hosted ones run in one more
#       shard, "App repeated tests"; TalariaKit ones in their own job from the start, "App repeated package tests". Both
#       repeat until the first failure or their fixed time budget (ci/hosted-test-shard). hosted_lane empty with a plan
#       runs only the hosted repeats.
#     diagnostic: true for a focused diagnostic (app-test-diagnostics.yml): its failing tests post commit statuses under
#       its own run's name, never a CI shard's. repetitions: its attempts (default 1); more than one runs the hosted
#       lane on one simulator with -test-iterations and -run-tests-until-failure.
#   No outputs: the calling job's result is the suite's result.
# Hosted mode's full-suite jobs are named "App build"/"App build started"/"App hosted tests N"/"App hosted tests"; an
# explicit hosted lane's are "App selected hosted tests N"/"App selected hosted tests", so a subset never reports under a
# full-suite name. The build artifact is app-test-build. "App hosted tests" passes only once every shard passed and each
# planned class ran exactly once; a release reuses main CI's when release-preflight
# reports it passed.
# Each test job boots its simulator while the build runs on another runner (TAL-380): hosted macOS allows five
# concurrent jobs, and a simulator's first boot beside a build on one three-core runner slowed both. It polls the
# jobs API for the build's upload from before its boot (TAL-405), and queues only once the build holds a runner
# (TAL-413), so it never holds a macOS slot its own build is still queued for. In hosted mode the build job and the four
# shards fill the five slots: the package tests run in the build job after its upload, so no shard waits on them
# (TAL-1891). In build and contracts modes they run in their own job (TAL-1896), beside the build if there is one, and
# so do a selective or repeat-only hosted run's, whose few shards leave slots to spare (TAL-2402).

name: App tests

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      contracts:
        type: boolean
        default: false
      ref:
        type: string
        default: ""
      package_tests:
        type: boolean
        default: true
      shards_at_once:
        type: number
        default: 4
      package_lane:
        type: string
        default: full
      hosted_lane:
        type: string
        default: full
      plan:
        type: string
        default: ""
      repetitions:
        type: number
        default: 1
      diagnostic:
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: app

env:
  # The build job the test job waits for.
  # A subset of the package tests in the build job renames it, so it never reports under the full suite's name.
  BUILD_JOB: ${{ inputs.mode == 'hosted' && inputs.hosted_lane == 'full' && inputs.package_lane == 'explicit' && 'App build and selected package tests' || 'App build' }}
  BUILD_ARTIFACT: app-test-build

jobs:
  app-build:
    name: ${{ inputs.mode == 'hosted' && inputs.hosted_lane == 'full' && inputs.package_lane == 'explicit' && 'App build and selected package tests' || 'App build' }}
    # Hosted mode builds on its own runner while the test jobs boot their simulators, then runs the package tests after
    # its upload, whatever the build's result (TAL-1891). Build mode has nothing to upload, and its package tests run
    # beside it in their own job. A contract-only change leaves the App sources alone, so it needs no build.
    if: inputs.mode != 'contracts'
    runs-on: xcode-27
    # The build's own limit, plus the package tests' and the probe wait's.
    timeout-minutes: 75
    permissions:
      contents: read
      # Reads this run's job list to wait for the Web contract probe.
      actions: read
      # The package tests post each failing test as a commit status while they run (TAL-2395).
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-xcode

      # Only the package checkouts: a fresh checkout's mtimes make xcodebuild rebuild the rest of DerivedData anyway.
      - name: Restore the Swift package checkouts
        uses: actions/cache@v6
        with:
          path: app/DerivedData/SourcePackages
          key: app-source-packages-${{ runner.os }}-${{ hashFiles('app/Talaria.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'app/TalariaKit/Package.resolved') }}

      - name: Build for testing
        timeout-minutes: 45
        env:
          # A build destination only; nothing boots on this runner.
          BUILD_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=${{ env.IOS_SIMULATOR_OS }}
        run: ci/build-for-testing "${BUILD_DESTINATION}"

      - name: Package the test build
        if: inputs.mode == 'hosted'
        run: |
          set -euo pipefail
          # Only what test-without-building runs: the xctestrun and the App with its extensions (module files, objects
          # and the top-level extension copies stay behind). Artifacts drop file modes, so a tar keeps the bundles'
          # executables and signatures intact. xz, not gzip: the artifact's own zip already gave gzip's size, 112 MB, which
          # took 15 to 150 s to download. xz itself, since this tar's built-in xz takes one core: 177 s at level 9 (TAL-1891).
          cd DerivedData/Build
          start_seconds=${SECONDS}
          tar -cf - Products/*.xctestrun Products/Debug-iphonesimulator/Talaria.app | xz -8 -T0 > "${RUNNER_TEMP}/app-build.tar.xz"
          echo "- Test build package: $((SECONDS - start_seconds))s ($(du -h "${RUNNER_TEMP}/app-build.tar.xz" | cut -f1))" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload the test build
        if: inputs.mode == 'hosted'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/app-build.tar.xz
          # The tar is already compressed.
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Run the package tests
        if: ${{ !cancelled() && inputs.mode == 'hosted' && inputs.hosted_lane == 'full' && inputs.package_tests }}
        uses: ./.github/actions/app-package-tests
        with:
          contracts: ${{ inputs.contracts }}
          plan: ${{ inputs.package_lane == 'explicit' && inputs.plan || '' }}
          failure_status: ${{ inputs.package_lane == 'explicit' && 'App selected package test failures' || 'App package test failures' }}

  package-test:
    # Build mode's and contracts mode's package tests, on their own runner from the start. Hosted mode runs them in
    # app-build. An explicit lane runs here under its own name, so a subset never reports as the full suite.
    name: ${{ inputs.package_lane == 'explicit' && 'App selected package tests' || 'App package tests' }}
    # A selective or repeat-only hosted run has slots to spare, and its package tests would otherwise wait for the
    # build's upload (TAL-2402).
    if: (inputs.mode != 'hosted' || inputs.hosted_lane != 'full') && inputs.package_tests
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      # Reads this run's job list to wait for the Web contract probe.
      actions: read
      # The package tests post each failing test as a commit status while they run (TAL-2395).
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-xcode

      - uses: ./.github/actions/app-package-tests
        with:
          contracts: ${{ inputs.contracts }}
          plan: ${{ inputs.package_lane == 'explicit' && inputs.plan || '' }}
          failure_status: ${{ inputs.package_lane == 'explicit' && 'App selected package test failures' || 'App package test failures' }}

  package-repeat:
    # The TalariaKit test methods a pull request added or changed, repeated on their own runner from the start, beside
    # the build, until the first failure or the budget (TAL-2402). A detector, not a retry: any failing attempt fails it.
    name: App repeated package tests
    if: fromJSON(inputs.plan || '{}').lanes.TalariaKitTests.repeat[0] != null
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      # Reads this run's job list to wait for the Web contract probe.
      actions: read
    env:
      # The live contract test skips without the probe's fixture, so repeating it waits for that like the package job.
      LIVE_REPEAT: ${{ inputs.contracts && contains(join(fromJSON(inputs.plan || '{}').lanes.TalariaKitTests.repeat, ' '), '/testLiveUpstreamContractResponsesDecodeWhenSupplied') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-xcode

      - uses: ./.github/actions/setup-bash

      - name: Wait for the Web contract probe
        if: env.LIVE_REPEAT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/wait-for-job "Web contract probe" 1500

      - name: Download the probe's live response fixture
        if: env.LIVE_REPEAT == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contract-fixture
          path: ${{ runner.temp }}/contract-fixture

      - name: Repeat the added and changed package tests
        env:
          PLAN: ${{ inputs.plan }}
          TALARIA_PACKAGE_RESULTS: ${{ runner.temp }}/package-repeats
        run: |
          set -euo pipefail
          if [[ "${LIVE_REPEAT}" == true ]]; then
            [[ -s "${RUNNER_TEMP}/contract-fixture/live-responses.json" ]] || { echo "The probe artifact has no live-responses.json" >&2; exit 1; }
            export TALARIA_LIVE_CONTRACT_RESPONSES="${RUNNER_TEMP}/contract-fixture/live-responses.json"
          fi
          printf '%s' "${PLAN}" > "${RUNNER_TEMP}/plan.json"
          # shellcheck disable=SC2046 # One validated argument per line.
          scripts/test-package $(ci/hosted-test-shard package-repeat "${RUNNER_TEMP}/plan.json") | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Hold each test inside the run-time budget
        run: python3 ../scripts/check-test-durations.py "${RUNNER_TEMP}"/package-repeats/attempt-*.log

      - name: Upload the attempts' logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-package-repeats
          path: ${{ runner.temp }}/package-repeats/
          retention-days: 14
          if-no-files-found: ignore

  build-started:
    # Two suites queued together once filled all five hosted macOS slots with test jobs waiting for builds that never
    # got a runner, and every one timed out without a test (TAL-413). The test job therefore queues only once its build
    # holds a runner: a test job that holds a slot then waits at most for a build that is running. This Linux job
    # holds no macOS slot while the build queues, and queue time counts toward no job's timeout, so it may wait long.
    # "Re-run failed jobs" keeps this job's success, so after a failed build use "Re-run all jobs" to keep the gate.
    # Once the build holds a runner it plans the shards (ci/hosted-test-shard, TAL-2390): the hosted lane's tests at the
    # tested checkout and their measured times.
    name: App build started
    if: inputs.mode == 'hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      # Reads this run's job list to see the build start.
      actions: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          # The planner reads the test targets' sources and the project to find a full run's classes.
          sparse-checkout: |
            /app/ci/
            /scripts/
            /app/TalariaTests/*.swift
            /app/TalariaKit/Tests/**/*.swift
            /app/Talaria.xcodeproj/project.pbxproj
          sparse-checkout-cone-mode: false

      - name: Wait until the build holds a macOS runner
        env:
          GH_TOKEN: ${{ github.token }}
          # Up to hours behind other macOS jobs: poll every 15 seconds rather than 5.
          WAIT_FOR_JOB_POLL_SECONDS: "15"
        run: ci/wait-for-job "${BUILD_JOB}" 20700 "Set up job"

      - name: Plan the simulator shards
        id: plan
        env:
          PLAN: ${{ inputs.plan }}
          HOSTED_LANE: ${{ inputs.hosted_lane }}
          REPETITIONS: ${{ inputs.repetitions }}
          SHARDS_AT_ONCE: ${{ inputs.shards_at_once }}
          # The package tests' own job beside the build in a selective hosted run takes a slot (TAL-2402).
          PACKAGE_JOB: ${{ inputs.hosted_lane != 'full' && inputs.package_tests }}
        run: |
          set -euo pipefail
          # The plan's hosted lane at the mode this run gives it, with its repeats (TAL-2402); a package test or repeat job
          # takes a macOS slot beside the shards.
          echo '{"mode":"full","identifiers":["TalariaTests"]}' > "${RUNNER_TEMP}/lane.json"
          export RESERVED_SLOTS=0
          [[ "${PACKAGE_JOB}" != true ]] || RESERVED_SLOTS=1
          if [[ -n "${PLAN}" ]]; then
            jq --arg lane "${HOSTED_LANE}" '.lanes.TalariaTests | .mode = $lane
              | if $lane == "full" then .identifiers = ["TalariaTests"] elif $lane == "empty" then .identifiers = [] else . end' \
              <<< "${PLAN}" > "${RUNNER_TEMP}/lane.json"
            RESERVED_SLOTS=$(( RESERVED_SLOTS + $(jq '[.lanes.TalariaKitTests.repeat // [] | select(length > 0)] | length' <<< "${PLAN}") ))
          fi
          ci/hosted-test-shard plan "${RUNNER_TEMP}/lane.json" \
            2> >(tee -a "${GITHUB_STEP_SUMMARY}" >&2) > "${RUNNER_TEMP}/shards.json"
          {
            echo "plan=$(cat "${RUNNER_TEMP}/shards.json")"
            echo "shards=$(jq -c '.shards' "${RUNNER_TEMP}/shards.json")"
          } >> "${GITHUB_OUTPUT}"

  app-test:
    # Boots its simulator to completion while the build runs on another runner and a background poll watches for the
    # build's upload, prepares the simulator in the background while it waits for and downloads the build, then runs
    # its shard of the hosted unit tests (TalariaTests). "App build started" planned the shards: one to four, balanced
    # from measured times (ci/hosted-test-shard). A full run's last shard also runs any class the planner missed.
    # The repeat shard (TAL-2402) carries its own name and status, never a lane's.
    name: ${{ matrix.repeat && 'App repeated tests' || matrix.duo && 'App native Duo tests' || format('{0} {1}', inputs.hosted_lane == 'explicit' && 'App selected hosted tests' || 'App hosted tests', matrix.shard) }}
    needs: build-started
    if: inputs.mode == 'hosted'
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.shards_at_once }}
      matrix:
        include: ${{ fromJSON(needs.build-started.outputs.shards) }}
    runs-on: xcode-27
    # The test step's own limit ends the tests, and this one only backs it up: setup takes up to about 15 minutes
    # before that step, and a loaded runner took 9 minutes over a single report after it (TAL-670). A focused
    # diagnostic's many attempts keep the longer limits.
    timeout-minutes: ${{ inputs.diagnostic && 75 || 55 }}
    permissions:
      contents: read
      # Reads this run's job list to wait for the build.
      actions: read
      # ci/report-test-failures posts each failing test as a commit status while the job runs (TAL-673).
      statuses: write
    env:
      # One commit status per shard: a passing shard's success must not replace another shard's failure. A selected
      # run's statuses are its own, so they never replace a full run's; a diagnostic posts none.
      FAILURE_STATUS: ${{ inputs.diagnostic && format('App test diagnostics {0}', github.run_id) || matrix.repeat && 'App repeated test failures' || matrix.duo && 'App native Duo test failures' || format('{0} {1}', inputs.hosted_lane == 'explicit' && 'App selected hosted test failures' || 'App hosted test failures', matrix.shard) }}
      SHARD: ${{ matrix.shard }}
      SHARD_PLAN: ${{ toJSON(matrix) }}
      RESULT_BUNDLE_PATH: TestResults.xcresult
      # Relative to app/, like the result bundle; the memory log uploads on every run (TAL-419).
      MEMORY_LOG: memory.log
      XCODEBUILD_LOG: xcodebuild-test.log
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Right after the simulator's first boot this runner is starved: a poll started then took 30 to 150 s per gh
      # call, the first the slowest, and saw an upload that had finished before it began only minutes later
      # (TAL-405). Polling from before the boot keeps that behind the boot; "Wait for the build" collects the result.
      - name: Start waiting for the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/background start build-wait ci/wait-for-job "${BUILD_JOB}" 2700 "Upload the test build"

      - uses: ./.github/actions/setup-xcode

      # The native Duo shard's iPhone Duo (TAL-1456): the image's own or one created on setup-xcode's
      # IOS_SIMULATOR_DUO_OS, through the pool's selection script. Without that runtime the shard skips: it records the
      # reason as its receipt, which the gate reports, and its remaining steps stay off.
      - name: Select the iPhone Duo
        id: duo
        if: matrix.duo
        run: |
          set -euo pipefail
          if [[ -z "${IOS_SIMULATOR_DUO_OS}" ]]; then
            reason="this runner image has no simulator runtime the iOS SDK runs that supports the iPhone Duo"
            mkdir -p hosted-cases
            echo "${reason}" > "hosted-cases/shard-${SHARD}.skipped"
            echo "::notice title=Native Duo tests skipped::Skipped: ${reason}."
            echo "### Native iPhone Duo shard ${SHARD}: skipped, ${reason}" >> "${GITHUB_STEP_SUMMARY}"
            echo "DUO_SKIPPED=1" >> "${GITHUB_ENV}"
            exit 0
          fi
          selection=$(IOS_SIMULATOR_DEVICE_TYPE=com.apple.CoreSimulator.SimDeviceType.iPhone-Duo \
            IOS_SIMULATOR_RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_SIMULATOR_DUO_OS//./-}" scripts/select-ios-simulator)
          echo "udid=${selection%%$'\t'*}" >> "${GITHUB_OUTPUT}"

      # Only iOS runtimes stay (TAL-2385). CoreSimulator timed out personalizing the image's watchOS, tvOS and xrOS
      # runtimes during the tests and then detached the iOS runtime under a running shard. The runner is discarded
      # after the job, and setup-xcode's selection reads only iOS runtimes. A cryptex runtime the runner user may not
      # delete goes through passwordless sudo.
      - name: Delete the other simulator runtimes
        if: env.DUO_SKIPPED != '1'
        run: |
          set -euo pipefail
          others() {
            xcrun simctl runtime list -j | jq -r '.[] | select(.platformIdentifier != "com.apple.platform.iphonesimulator")
              | "\(.identifier) \(.runtimeIdentifier) \(.state)"'
          }
          # simctl returns before the deletion finishes, and the system mounted a fresh copy of the tvOS and watchOS 27.0
          # runtimes under a new identifier after the first deletion (runs 45059253953, 45060232951). So the list is
          # read again, 2 s apart and at most 90 times, until it holds no other platform's runtime, and each identifier
          # is deleted once. The log records every change of the list. A refusal shows in the check below.
          deleted=" "
          listed=""
          for _ in $(seq "${TALARIA_RUNTIME_READS:-90}"); do
            remaining=$(others)
            [[ "${remaining}" == "${listed}" ]] || echo "Non-iOS runtimes at ${SECONDS}s: ${remaining:-none}" | paste -sd ';' -
            listed=${remaining}
            [[ -n "${remaining}" ]] || break
            while read -r runtime _; do
              [[ "${deleted}" != *" ${runtime} "* ]] || continue
              deleted+="${runtime} "
              xcrun simctl runtime delete "${runtime}" < /dev/null || sudo -n xcrun simctl runtime delete "${runtime}" < /dev/null || true
            done <<< "${remaining}"
            sleep 2
          done
          { echo "### Simulator runtimes"; echo '```'; xcrun simctl runtime list -v; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
          [[ -z "${remaining}" ]] || { echo "::error::Non-iOS simulator runtimes remain: ${remaining//$'\n'/; }"; exit 1; }

      # The image's own iPhone 17 on the newest runtime the SDK runs (setup-xcode's IOS_SIMULATOR_OS), or the native Duo
      # shard's iPhone Duo, booted to completion before the wait and the download so nothing competes with its first
      # boot; App build runs meanwhile on another runner.
      - name: Boot the simulator
        id: sim
        if: env.DUO_SKIPPED != '1'
        uses: futureware-tech/simulator-action@c768f52966d5f70335ec77881f9806b24a52f80e # v6
        with:
          model: ${{ !matrix.duo && 'iPhone 17' || '' }}
          os: ${{ !matrix.duo && 'iOS' || '' }}
          os_version: ${{ !matrix.duo && format('~{0}', env.IOS_SIMULATOR_OS) || '' }}
          udid: ${{ steps.duo.outputs.udid }}
          erase_before_boot: false
          wait_for_boot: true
          boot_timeout_seconds: 600
          # The hosted runner is discarded anyway.
          shutdown_after_job: false

      # The keyboard's slide-to-type introduction marked as shown (TAL-668), the notification service answering
      # (TAL-651) and a photo the tests own (TAL-633). It needs only the booted simulator, so it runs in the background
      # while the job waits for and downloads the build, and "Test without building" collects it (TAL-1599). Only the
      # shard whose tests wait on the notification server waits for it here (TAL-2352). The boot's end starts the
      # render server's settle deadline in "Test without building" (TAL-2705).
      - name: Prepare the simulator
        if: env.DUO_SKIPPED != '1'
        run: |
          echo "SIMULATOR_BOOTED_AT=$(date +%s)" >> "${GITHUB_ENV}"
          printf '%s' "${SHARD_PLAN}" > "${RUNNER_TEMP}/shard.json"
          options=$(ci/hosted-test-shard prepare-options "${RUNNER_TEMP}/shard.json")
          # shellcheck disable=SC2086 # One-word options, one per line; none where the shard needs notifications.
          ci/background start simulator-prepare scripts/prepare-ui-simulator ${options} "${{ steps.sim.outputs.udid }}"

      # Returns once the background poll has seen the build's upload step succeed; fails once it sees the build fail
      # or get cancelled, or if the poll stopped without a result.
      - name: Wait for the build
        if: env.DUO_SKIPPED != '1'
        run: ci/background wait build-wait

      # curl, not actions/download-artifact, which fetched this artifact at about 1 MB/s on hosted macOS.
      - name: Download the test build
        if: env.DUO_SKIPPED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          start_epoch=$(date +%s)
          # The artifact list can trail the upload step, so look it up for up to two minutes; gh-api-poll rides out
          # transient API errors.
          url=""
          for _ in $(seq 24); do
            url=$(ci/gh-api-poll -H "Cache-Control: no-cache" "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${BUILD_ARTIFACT}&poll=${SECONDS}" \
              --jq '.artifacts[0].archive_download_url // empty')
            [[ -z "${url}" ]] || break
            sleep 5
          done
          [[ -n "${url}" ]] || { echo "${BUILD_JOB} uploaded, but its ${BUILD_ARTIFACT} artifact is not listed" >&2; exit 1; }
          # The redirect to blob storage drops the Authorization header (curl sends it to the API host only).
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -o "${RUNNER_TEMP}/app-build.zip" "${url}"
          unzip -q -o "${RUNNER_TEMP}/app-build.zip" -d "${RUNNER_TEMP}"
          echo "- Test build download: $((SECONDS - start_seconds))s ($(du -h "${RUNNER_TEMP}/app-build.zip" | cut -f1))" | tee -a "${GITHUB_STEP_SUMMARY}"
          # The handoff latency (TAL-405): the newest upload at or before this attempt, to this step's start.
          # shellcheck disable=SC2016 # jq, not the shell, expands $ENV.
          uploaded=$(ci/gh-api-poll --paginate -H "Cache-Control: no-cache" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=all&per_page=100&poll=${SECONDS}" \
            --jq '.jobs[] | select((.name == $ENV.BUILD_JOB or (.name | endswith(" / " + $ENV.BUILD_JOB))) and .run_attempt <= ($ENV.GITHUB_RUN_ATTEMPT | tonumber))
              | .steps[]? | select(.name == "Upload the test build" and .completed_at) | .completed_at | fromdate' |
            sort -n | tail -n 1) || uploaded=""
          handoff="unknown"
          [[ -z "${uploaded}" ]] || handoff="$((start_epoch - uploaded)) s"
          echo "- Build upload → download start: ${handoff}" | tee -a "${GITHUB_STEP_SUMMARY}"
          mkdir -p Build
          tar -C Build -xf "${RUNNER_TEMP}/app-build.tar.xz"

      # The memory sampler runs for the whole step; "Report memory" stops it, summarizes it and uploads its log.
      # The step's own limit ends a stuck run inside the job's, so the steps after it still upload the result bundle
      # and the memory log and the job fails rather than being cancelled, which the failure alert sees (TAL-670).
      # Within it, XCTest's per-test limit fails a hung test by name, with a spindump, and the run goes on: one minute,
      # the shortest XCTest allows and the nearest to the 30 s run-time budget, not its default ten (TAL-2544). The
      # step's limit sits above the slowest measured shard: 10 to 13 minutes at four shards (main run 44328773116), 18
      # to 19.5 minutes at a release's two (release run 44252691504), plus at most about 6 minutes of the render
      # server's settle wait before the first launch (TAL-2705).
      - name: Test without building
        if: env.DUO_SKIPPED != '1'
        timeout-minutes: ${{ inputs.diagnostic && 45 || 30 }}
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.udid }}
          GH_TOKEN: ${{ github.token }}
          # A hosted runner took about 20 s before xcodebuild printed anything; a stall still ends minutes before the
          # step's limit.
          TALARIA_RUNNER_CONNECT_TIMEOUT: "120"
          TALARIA_RUNNER_PREPARATION_TIMEOUT: "120"
        run: |
          set -euo pipefail
          nohup ci/memory-sampler watch "${MEMORY_LOG}" "${XCODEBUILD_LOG}" > /dev/null 2>&1 < /dev/null &
          echo $! > "${RUNNER_TEMP}/memory-sampler.pid"
          # A job's log is unreadable until the job ends, so each failing test also goes out as a commit status the
          # moment it fails (TAL-673).
          ci/report-test-failures "${XCODEBUILD_LOG}" "$(git rev-parse HEAD)" "${FAILURE_STATUS}" < /dev/null &
          reporter=$!
          trap 'kill "${reporter}" 2>/dev/null || true' EXIT
          # A read loop: macOS ships Bash 3.2, which has no array-reading builtin.
          arguments=$(ci/hosted-test-shard args "${RUNNER_TEMP}/shard.json")
          selection=()
          while IFS= read -r argument; do selection+=("${argument}"); done <<< "${arguments}"
          start_seconds=${SECONDS}
          xctestrun=(Build/Products/*.xctestrun)
          # No run collects the simulator's diagnostics: on a hosted runner that waited 600 s on every run, passing or
          # failing, and never returned any (TAL-669). The result bundle keeps each failure's screenshots and logs.
          # The local runner's guarded launch (TAL-2277): a fault before the runner connects, when no test has run,
          # gets one relaunch, and a second fault ends the run with status 70, a runner fault. A simulator that
          # "Prepare the simulator" could not ready is such a fault too (TAL-2469). Recovery here keeps the evidence,
          # restarts CoreSimulator, which this runner owns alone, reboots the simulator and prepares it again.
          source scripts/xctest-launch
          simulator_id=${SIMULATOR_ID}
          # shellcheck disable=SC2034 # scripts/xctest-launch reads it.
          destination="platform=iOS Simulator,id=${SIMULATOR_ID}"
          # The freshly booted simulator's render server bursts to 2-5 GB in about half the shards, 1.5 to 7 minutes
          # after the boot, and starves every test it overlaps (TAL-696): two tests that take 3-15 s took 39-40 s inside
          # one (run 45068210315), since the runtime deletion before the boot (TAL-2385) lets the tests start sooner
          # after it. So the tests start once the burst came and went, or 450 s after the boot, past the latest onset
          # seen in 21 shards of seven runs (407 s) (TAL-2705). The shard's test time leaves this wait out.
          # shellcheck disable=SC2329 # scripts/xctest-launch calls it.
          xctest_ready() {
            ci/background wait simulator-prepare || return
            local now settle
            now=$(date +%s)
            settle=$(( SIMULATOR_BOOTED_AT + 450 - now ))
            ci/memory-sampler settle $(( settle > 0 ? settle : 0 ))
            start_seconds=$(( start_seconds + $(date +%s) - now ))
          }
          # shellcheck disable=SC2329 # scripts/xctest-launch calls it.
          xctest_recover() {
            mkdir -p launch-fault
            xcrun simctl runtime list -v > launch-fault/runtime-list.txt 2>&1 || true
            xcrun simctl list runtimes > launch-fault/runtimes.txt 2>&1 || true
            cp "${HOME}/Library/Logs/CoreSimulator/CoreSimulator.log" launch-fault/ || true
            xcrun simctl shutdown all > /dev/null 2>&1 || true
            pkill -9 -f com.apple.CoreSimulator.CoreSimulatorService || true
            xcrun simctl bootstatus "${simulator_id}" -b > /dev/null
            # shellcheck disable=SC2046 # One-word options, as in "Prepare the simulator".
            scripts/prepare-ui-simulator $(ci/hosted-test-shard prepare-options "${RUNNER_TEMP}/shard.json") "${simulator_id}"
          }
          # The repeat shard stops at its budget once each planned test completed one attempt (TAL-2402).
          if [[ "$(jq -r '.repeat // false' "${RUNNER_TEMP}/shard.json")" == true ]]; then
            TALARIA_TEST_BUDGET=$(jq -r .budget "${RUNNER_TEMP}/shard.json")
            TALARIA_TEST_BUDGET_AFTER=$(jq '.planned | length' "${RUNNER_TEMP}/shard.json")
            export TALARIA_TEST_BUDGET TALARIA_TEST_BUDGET_AFTER
          fi
          status=0
          xctest_launch "${RESULT_BUNDLE_PATH}" "${XCODEBUILD_LOG}" \
            -xctestrun "${xctestrun[0]}" \
            "${selection[@]}" \
            -testLanguage en \
            -testRegion US \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -parallel-testing-enabled NO || status=$?
          duration_seconds=$((SECONDS - start_seconds))
          echo "### Hosted test shard ${SHARD}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Test without building: ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${status}" == 70 ]]; then
            echo "::error title=Simulator runner fault::Runner fault before any test ran: the simulator or its test runner faulted, also after a reboot with CoreSimulator restarted. No test failed; rerun the job."
            echo "- Runner fault before any test ran: the simulator or its test runner faulted twice. No test failed." >> "${GITHUB_STEP_SUMMARY}"
          elif [[ -d launch-fault ]]; then
            echo "::warning title=Simulator launch recovered::The simulator or its test runner faulted before any test ran; after a reboot with CoreSimulator restarted, the tests ran."
            echo "- Launch recovered: the simulator or its test runner faulted before any test ran." >> "${GITHUB_STEP_SUMMARY}"
          fi
          # The test cases this shard ran, from its result bundle, and its test time: the gate proves every planned
          # identifier ran exactly once and reports the slowest shard against its estimate.
          mkdir -p hosted-cases
          xcrun xcresulttool get test-results tests --path "${RESULT_BUNDLE_PATH}" --compact > hosted-cases/results.json 2>/dev/null ||
            echo '{}' > hosted-cases/results.json
          ci/hosted-test-shard cases hosted-cases/results.json > "hosted-cases/shard-${SHARD}.txt"
          echo "${duration_seconds}" > "hosted-cases/shard-${SHARD}.time"
          # The repeat shard's verdict: each planned test's attempts, and any failing one fails it; an attempt only the
          # budget interrupted is not a failure (TAL-2402). A focused diagnostic's attempts: how many completed and the
          # first that failed (TAL-2390).
          if [[ -n "${TALARIA_TEST_BUDGET:-}" ]]; then
            verdict=0
            ci/hosted-test-shard repeated "${RUNNER_TEMP}/shard.json" hosted-cases/results.json "${xctest_budget_spent}" |
              tee -a "${GITHUB_STEP_SUMMARY}" || verdict=$?
            if [[ "${status}" != 70 && "${xctest_budget_spent}" == 1 ]]; then
              status=${verdict}
            elif [[ "${status}" == 0 ]]; then
              status=${verdict}
            fi
          elif [[ "$(jq -r '.repetitions // 1' "${RUNNER_TEMP}/shard.json")" != 1 ]]; then
            ci/hosted-test-shard attempts hosted-cases/results.json | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
          # The native Duo shard's destination proof: the device and runtime it ran on, and each case's outcome there,
          # apart from the iPhone 17 shards' skips (TAL-1456).
          if [[ "$(jq -r '.duo // false' "${RUNNER_TEMP}/shard.json")" == true ]]; then
            xcrun simctl list devices --json | jq --arg udid "${SIMULATOR_ID}" \
              'first(.devices | to_entries[] | .key as $runtime | .value[] | select(.udid == $udid) | . + {runtime: $runtime})' \
              > "${RUNNER_TEMP}/device.json"
            ci/hosted-test-shard native "${RUNNER_TEMP}/shard.json" hosted-cases/results.json "${RUNNER_TEMP}/device.json" |
              tee -a "${GITHUB_STEP_SUMMARY}"
          fi
          rm hosted-cases/results.json
          # A passing run replaces an earlier run's failure status on this commit with success.
          [[ "${status}" != 0 ]] || ci/report-test-failures --passed "$(git rev-parse HEAD)" "${FAILURE_STATUS}"
          # CoreSimulator's own log says what booted or shut down a simulator mid-test, which no result bundle records
          # (TAL-869). Beside the bundle, so the failure upload keeps its layout.
          [[ "${status}" == 0 ]] || cp "${HOME}/Library/Logs/CoreSimulator/CoreSimulator.log" CoreSimulator.log || true
          exit "${status}"

      # Ahead of the reports, so a slow report never costs the evidence its time (TAL-670).
      - name: Upload test results on failure
        timeout-minutes: 10
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results-${{ matrix.shard }}
          path: |
            app/TestResults.xcresult
            app/CoreSimulator.log
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore

      # A recovered launch passes the job, so its fault's evidence uploads whatever the result (TAL-2277).
      - name: Upload launch-fault evidence
        timeout-minutes: 10
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: app-launch-fault-${{ matrix.shard }}
          path: |
            app/launch-fault/
            app/TestResults-launch-1.xcresult
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore

      - name: Upload the test cases this shard ran
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: app-hosted-cases-${{ matrix.shard }}
          path: app/hosted-cases/
          retention-days: 1
          overwrite: true
          if-no-files-found: error

      - name: Report memory
        timeout-minutes: 3
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          [[ -f "${RUNNER_TEMP}/memory-sampler.pid" ]] || { echo "The memory sampler never started."; exit 0; }
          kill "$(cat "${RUNNER_TEMP}/memory-sampler.pid")" 2>/dev/null || true
          ci/memory-sampler summary "${MEMORY_LOG}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload memory samples
        timeout-minutes: 5
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: app-test-memory-${{ matrix.shard }}
          path: app/${{ env.MEMORY_LOG }}
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore

      - name: Report slowest tests
        timeout-minutes: 3
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -d "${RESULT_BUNDLE_PATH}" ]]; then
            echo "No result bundle is available; skipping slow-test reporting."
            exit 0
          fi

          xcrun xcresulttool get test-results tests \
            --path "${RESULT_BUNDLE_PATH}" \
            --compact > test-results.json

          python3 - <<'PY' | tee slowest-tests.txt
          import json

          with open("test-results.json", encoding="utf-8") as results_file:
              results = json.load(results_file)

          tests = []

          def visit(node, parents):
              name = node.get("name", "<unnamed>")
              node_type = node.get("nodeType")
              path = [*parents, name]
              duration = node.get("durationInSeconds")
              if node_type == "Test Case" and isinstance(duration, (int, float)):
                  tests.append((duration, " / ".join(path)))
              for child in node.get("children", []):
                  visit(child, path)

          for root in results.get("testNodes", []):
              visit(root, [])

          print("Slowest test cases:")
          for duration, name in sorted(tests, reverse=True)[:20]:
              print(f"{duration:8.3f}s  {name}")
          PY

          {
            echo ""
            echo "#### Slowest test cases"
            echo '```text'
            cat slowest-tests.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # test-results.json comes from the step above (TAL-2403).
      - name: Hold each test inside the run-time budget
        if: env.DUO_SKIPPED != '1'
        timeout-minutes: 3
        run: python3 ../scripts/check-test-durations.py test-results.json

      # Performance budgets are only useful against previous runs, so every run
      # keeps its measurements as an artifact and prints them into the summary.
      - name: Record performance metrics
        timeout-minutes: 3
        if: always()
        continue-on-error: true
        run: scripts/report-performance-metrics "${RESULT_BUNDLE_PATH}"

      - name: Upload performance metrics
        timeout-minutes: 5
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: app-performance-metrics-${{ matrix.shard }}
          path: |
            app/performance-metrics.json
            app/performance-metrics.txt
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore

  app-test-gate:
    # The suite's one result: every shard passed and every planned identifier ran exactly once, in its own shard, with
    # nothing unplanned beside it. A release reuses main CI's "App / App hosted tests" job on the exact release source
    # rather than testing again (TAL-1550). An explicit lane's gate is app-test-selected-gate, never this job.
    name: App hosted tests
    needs: [build-started, app-test]
    if: inputs.mode == 'hosted' && inputs.hosted_lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            app/ci
            scripts

      - name: Download the test cases each shard ran
        uses: actions/download-artifact@v8
        with:
          pattern: app-hosted-cases-*
          merge-multiple: true
          path: ${{ runner.temp }}/hosted-cases

      - name: Require every planned identifier to run exactly once
        env:
          PLAN: ${{ needs.build-started.outputs.plan }}
        run: |
          set -euo pipefail
          printf '%s' "${PLAN}" > "${RUNNER_TEMP}/shards.json"
          ci/hosted-test-shard check "${RUNNER_TEMP}/shards.json" "${RUNNER_TEMP}/hosted-cases" | tee -a "${GITHUB_STEP_SUMMARY}"
          ci/hosted-test-shard report "${RUNNER_TEMP}/shards.json" "${RUNNER_TEMP}/hosted-cases" | tee -a "${GITHUB_STEP_SUMMARY}"

  app-test-selected-gate:
    # An explicit hosted lane's one result, under a name no full suite carries: the same proof as app-test-gate for the
    # identifiers its plan selected (TAL-2390).
    name: App selected hosted tests
    needs: [build-started, app-test]
    if: inputs.mode == 'hosted' && inputs.hosted_lane == 'explicit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: |
            app/ci
            scripts

      - name: Download the test cases each shard ran
        uses: actions/download-artifact@v8
        with:
          pattern: app-hosted-cases-*
          merge-multiple: true
          path: ${{ runner.temp }}/hosted-cases

      - name: Require every planned identifier to run exactly once
        env:
          PLAN: ${{ needs.build-started.outputs.plan }}
        run: |
          set -euo pipefail
          printf '%s' "${PLAN}" > "${RUNNER_TEMP}/shards.json"
          ci/hosted-test-shard check "${RUNNER_TEMP}/shards.json" "${RUNNER_TEMP}/hosted-cases" | tee -a "${GITHUB_STEP_SUMMARY}"
          ci/hosted-test-shard report "${RUNNER_TEMP}/shards.json" "${RUNNER_TEMP}/hosted-cases" | tee -a "${GITHUB_STEP_SUMMARY}"
