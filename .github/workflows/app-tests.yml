# Interface (stable; ci.yml, ui-suite.yml and TAL-381's release graph call it):
#   uses: ./.github/workflows/app-tests.yml   (the caller grants contents: read and actions: read)
#   with:
#     mode: pull-request | contracts | full
#       pull-request: unit tests and the launch smoke in two shards; contracts: the native contract
#       classes in one shard; full: every unit and UI test in four shards (the UI suite).
#     contracts: true | false  - shard 0 also waits for this run's "Web contract probe" job and runs the live
#       decoding test against its contract-fixture artifact, inside the same xcodebuild as its suite.
#     ref: optional commit to check out (default: the triggering commit).
#   No outputs: the calling job's result is the suite's result.
# Jobs are named "App build"/"App tests (shard N)", or "UI suite build"/"UI suite tests (shard N)" in full
# mode, and the build artifact is app-build or ui-suite-build, so both suites can run in one workflow run.
# Test jobs boot their simulator while the build runs on another runner (TAL-380): hosted macOS allows five
# concurrent jobs, and a simulator's first boot beside a build on one three-core runner slowed both.

name: App tests

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      contracts:
        type: boolean
        default: false
      ref:
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    working-directory: app

env:
  XCODE_VERSION: "27.0"
  BUILD_JOB: ${{ inputs.mode == 'full' && 'UI suite build' || 'App build' }}
  BUILD_ARTIFACT: ${{ inputs.mode == 'full' && 'ui-suite-build' || 'app-build' }}

jobs:
  app-build:
    name: ${{ inputs.mode == 'full' && 'UI suite build' || 'App build' }}
    # Builds on its own runner; the test jobs boot their simulators meanwhile.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-xcode
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build for testing
        env:
          # A build destination only; nothing boots on this runner.
          BUILD_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          ci/build-for-testing "${BUILD_DESTINATION}"
          # Only what test-without-building reads: the xctestrun and the products it names (about 180 of
          # 232 MB; module files, objects and bundle copies stay behind). Artifacts drop file modes, so a tar
          # keeps the bundles' executables and signatures intact.
          cd DerivedData/Build
          products=(Products/*.xctestrun)
          for product in Talaria.app TalariaUITests-Runner.app TalariaLiveActivityWidget.appex TalariaShareExtension.appex; do
            products+=("Products/Debug-iphonesimulator/${product}")
          done
          tar -cf "${RUNNER_TEMP}/app-build.tar" "${products[@]}"

      - name: Upload the test build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/app-build.tar
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  app-test:
    # Each shard boots its simulator to completion while the build runs on another runner, then waits for
    # and downloads the build.
    name: ${{ inputs.mode == 'full' && 'UI suite' || 'App' }} tests (shard ${{ matrix.shard }})
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
      # Reads this run's job list to wait for the build and the Web contract probe.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.mode == 'full' && '[0,1,2,3]' || (inputs.mode == 'pull-request' && '[0,1]' || '[0]')) }}
    env:
      SHARD: ${{ matrix.shard }}
      SHARD_COUNT: ${{ strategy.job-total }}
      MODE: ${{ inputs.mode }}
      CONTRACTS_SELECTED: ${{ inputs.contracts }}
      RESULT_BUNDLE_PATH: TestResults.xcresult
      LAUNCH_SMOKE_TEST: TalariaUITests/ChatNavigationUITests/testChatSessionOpensFromList
      LIVE_CONTRACT_TEST: TalariaTests/APIClientSessionListTests/testLiveUpstreamContractResponsesDecodeWhenSupplied
      # Pinned to shard 0, which also runs the live contract test, so one shard proves them all.
      CONTRACT_TEST_CLASSES: >-
        TalariaTests/ContractReadinessTests
        TalariaTests/SharedContractTests
        TalariaTests/APIClientAuthAndErrorTests
        TalariaTests/APIClientSessionListTests
        TalariaTests/APIClientSessionMutationTests
        TalariaTests/SSEClientTests
        TalariaTests/StreamReconnectContractTests
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-xcode
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # The image's own iPhone 17 on the runtime matching the SDK, booted to completion before the wait and the
      # download so nothing competes with its first boot; App build runs meanwhile on another runner.
      - name: Boot the simulator
        id: sim
        uses: futureware-tech/simulator-action@e89aa8f93d3aec35083ff49d2854d07f7186f7f5 # v5
        with:
          model: iPhone 17
          os: iOS
          os_version: ~${{ env.XCODE_VERSION }}
          erase_before_boot: false
          wait_for_boot: true
          boot_timeout_seconds: 600

      - name: Wait for App build
        env:
          GH_TOKEN: ${{ github.token }}
        # Returns once the build's upload step has succeeded; the job's own completion, and in run 36446521579
        # the artifact list too, reached the API one to two minutes later.
        run: ci/wait-for-job "${BUILD_JOB}" 2700 "Upload the test build"

      # curl, not actions/download-artifact, which fetched this 82 MB artifact at about 1 MB/s on hosted macOS.
      - name: Download the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          # The artifact list can trail the upload step, so look it up for up to two minutes; gh-api-poll rides out
          # transient API errors.
          url=""
          for _ in $(seq 24); do
            url=$(ci/gh-api-poll -H "Cache-Control: no-cache" "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${BUILD_ARTIFACT}&poll=${SECONDS}" \
              --jq '.artifacts[0].archive_download_url // empty')
            [[ -z "${url}" ]] || break
            sleep 5
          done
          [[ -n "${url}" ]] || { echo "${BUILD_JOB} uploaded, but its ${BUILD_ARTIFACT} artifact is not listed" >&2; exit 1; }
          # The redirect to blob storage drops the Authorization header (curl sends it to the API host only).
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -o "${RUNNER_TEMP}/app-build.zip" "${url}"
          unzip -q -o "${RUNNER_TEMP}/app-build.zip" -d "${RUNNER_TEMP}"
          echo "- Test build download: $((SECONDS - start_seconds))s ($(du -h "${RUNNER_TEMP}/app-build.zip" | cut -f1))" | tee -a "${GITHUB_STEP_SUMMARY}"

      # The probe finishes about a minute into the run, long before the build, so shard 0 fetches its fixture
      # here and runs the live decoding test inside the same xcodebuild as its suite: a second invocation spent
      # over two minutes preparing the destination again before it ran one test.
      - name: Wait for the Web contract probe
        if: env.CONTRACTS_SELECTED == 'true' && matrix.shard == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/wait-for-job "Web contract probe" 1500

      - name: Download the probe's live response fixture
        if: env.CONTRACTS_SELECTED == 'true' && matrix.shard == 0
        uses: actions/download-artifact@v8
        with:
          name: contract-fixture
          path: ${{ runner.temp }}/contract-fixture

      - name: Select this shard's tests
        run: |
          set -euo pipefail
          mkdir -p Build
          tar -C Build -xf "${RUNNER_TEMP}/app-build.tar"
          if [[ "${MODE}" == "contracts" ]]; then
            # Web/contract-only change: the fixture-backed native contract classes are the whole selection.
            for contract_class in ${CONTRACT_TEST_CLASSES}; do echo "-only-testing:${contract_class}"; done > selection.txt
            echo "-skip-testing:${LIVE_CONTRACT_TEST}" >> selection.txt
          else
            options=(--shards "${SHARD_COUNT}" --shard "${SHARD}")
            # CI: unit tests and one launch smoke test; the UI suite runs every UI test.
            [[ "${MODE}" == "full" ]] || options+=(--targets TalariaTests --add "${LAUNCH_SMOKE_TEST}")
            for contract_class in ${CONTRACT_TEST_CLASSES}; do options+=(--pin "${contract_class}"); done
            python3 ci/test_shards.py "${options[@]}" > selection.txt
          fi
          if [[ "${CONTRACTS_SELECTED}" == "true" && "${SHARD}" == "0" ]]; then
            # Shard 0 holds the live test's class (pinned) or the whole target; only its skip goes.
            grep -vx -- "-skip-testing:${LIVE_CONTRACT_TEST}" selection.txt > selection.live.txt
            mv selection.live.txt selection.txt
          fi
          echo "Shard ${SHARD} of ${SHARD_COUNT}: $(grep -c -- '-only-testing:' selection.txt) selected, $(grep -c -- '-skip-testing:' selection.txt) skipped entries"

      - name: Test without building
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          live=false
          [[ "${CONTRACTS_SELECTED}" == "true" && "${SHARD}" == "0" ]] && live=true
          fixture="${RUNNER_TEMP}/contract-fixture/live-responses.json"
          if [[ "${live}" == "true" ]]; then
            [[ -s "${fixture}" ]] || { echo "The probe artifact has no live-responses.json" >&2; exit 1; }
            # xcodebuild strips TEST_RUNNER_ and hands the path to the simulator test process.
            export TEST_RUNNER_TALARIA_LIVE_CONTRACT_RESPONSES="${fixture}"
          fi
          start_seconds=${SECONDS}
          selection=()
          while IFS= read -r option; do selection+=("${option}"); done < selection.txt
          xctestrun=(Build/Products/*.xctestrun)
          xcodebuild test-without-building \
            -xctestrun "${xctestrun[0]}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -testLanguage en \
            -testRegion US \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -collect-test-diagnostics never \
            -parallel-testing-enabled NO \
            "${selection[@]}"
          duration_seconds=$((SECONDS - start_seconds))
          if [[ "${live}" == "true" ]]; then
            # Every native contract class must have passed.
            xcrun xcresulttool get test-results tests --path "${RESULT_BUNDLE_PATH}" --compact > contract-results.json
            for contract_class in ${CONTRACT_TEST_CLASSES}; do
              /usr/bin/jq -e --arg prefix "test://com.apple.xcode/Talaria/${contract_class}/" '
                any(.. | objects; .nodeType? == "Test Case" and .result? == "Passed" and ((.nodeIdentifierURL? // "") | startswith($prefix)))
              ' contract-results.json >/dev/null || { echo "Native contract class ${contract_class} did not pass" >&2; exit 1; }
            done
            # A missing fixture makes the live test skip, so require an explicit pass.
            /usr/bin/jq -e --arg id "test://com.apple.xcode/Talaria/${LIVE_CONTRACT_TEST}" '
              [.. | objects | select(.nodeType? == "Test Case" and ((.nodeIdentifierURL? // "") | startswith($id)))]
              | length == 1 and .[0].result == "Passed"
            ' contract-results.json >/dev/null || { echo "The live Web contract test did not pass against the fixture" >&2; exit 1; }
          fi
          echo "### App shard ${SHARD} of ${SHARD_COUNT}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Test without building: ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"

      - name: Report slowest tests
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -d "${RESULT_BUNDLE_PATH}" ]]; then
            echo "No result bundle is available; skipping slow-test reporting."
            exit 0
          fi

          xcrun xcresulttool get test-results tests \
            --path "${RESULT_BUNDLE_PATH}" \
            --compact > test-results.json

          python3 - <<'PY' | tee slowest-tests.txt
          import json

          with open("test-results.json", encoding="utf-8") as results_file:
              results = json.load(results_file)

          tests = []

          def visit(node, parents):
              name = node.get("name", "<unnamed>")
              node_type = node.get("nodeType")
              path = [*parents, name]
              duration = node.get("durationInSeconds")
              if node_type == "Test Case" and isinstance(duration, (int, float)):
                  tests.append((duration, " / ".join(path)))
              for child in node.get("children", []):
                  visit(child, path)

          for root in results.get("testNodes", []):
              visit(root, [])

          print("Slowest test cases:")
          for duration, name in sorted(tests, reverse=True)[:20]:
              print(f"{duration:8.3f}s  {name}")
          PY

          {
            echo ""
            echo "#### Slowest test cases"
            echo '```text'
            cat slowest-tests.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Reject skipped UI tests
        run: |
          options=()
          # Exactly one pull-request shard owns the launch smoke test, and it must pass there.
          if grep -qx -- "-only-testing:${LAUNCH_SMOKE_TEST}" selection.txt; then options+=(--require-launch-smoke); fi
          scripts/assert-no-skipped-ui-tests "${RESULT_BUNDLE_PATH}" "${options[@]}"

      # Performance budgets are only useful against previous runs, so every run
      # keeps its measurements as an artifact and prints them into the summary.
      - name: Record performance metrics
        if: always()
        continue-on-error: true
        run: scripts/report-performance-metrics "${RESULT_BUNDLE_PATH}"

      - name: Upload performance metrics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_ARTIFACT }}-performance-metrics-shard-${{ matrix.shard }}
          path: |
            app/performance-metrics.json
            app/performance-metrics.txt
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore

      - name: Upload test results on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_ARTIFACT }}-test-results-shard-${{ matrix.shard }}
          path: app/TestResults.xcresult
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore
