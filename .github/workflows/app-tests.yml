# Interface (stable; ci.yml and release-set.yml call it):
#   uses: ./.github/workflows/app-tests.yml   (the caller grants contents: read, actions: read and statuses: write)
#   with:
#     mode: pull-request | contracts
#       Both modes run the TalariaKit package tests with `swift test` on macOS, without a simulator: about
#       94% of the unit tests, including every native contract class (TAL-399).
#       That run measures TalariaKit/Sources coverage: the job summary shows it and the app-package-coverage
#       artifact keeps the per-file and per-line report (TAL-67).
#       pull-request: plus the App build for testing (App, extensions and the hosted test bundle) and one simulator
#       job running the hosted unit tests (TalariaTests: UIKit views, App Intents and widget configuration types,
#       visual references, performance budgets, App bundle resources). Pull requests, main pushes and the release
#       gate run it.
#       contracts: the package tests alone; a contract-only change leaves the App sources alone.
#     contracts: true | false  - the package job also waits for this run's "Web contract probe" job and runs the
#       live decoding test against its contract-fixture artifact.
#     ref: optional commit to check out (default: the triggering commit).
#     package_tests: false leaves out the package tests job (default true); a release runs the same suite in its
#       contracts job instead (TAL-414).
#   No outputs: the calling job's result is the suite's result.
# Jobs are named "App build"/"App build started"/"App hosted tests"/"App package tests"; the build artifact is
# app-test-build.
# The test job boots its simulator while the build runs on another runner (TAL-380): hosted macOS allows five
# concurrent jobs, and a simulator's first boot beside a build on one three-core runner slowed both. It polls the
# jobs API for the build's upload from before its boot (TAL-405), and queues only once the build holds a runner
# (TAL-413), so it never holds a macOS slot its own build is still queued for.

name: App tests

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      contracts:
        type: boolean
        default: false
      ref:
        type: string
        default: ""
      package_tests:
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

env:
  # The build job the test job waits for.
  BUILD_JOB: App build
  BUILD_ARTIFACT: app-test-build

jobs:
  app-build:
    name: App build
    # Builds on its own runner while the test job boots its simulator. A contract-only
    # change leaves the App sources alone, so its package tests are the whole check.
    if: inputs.mode != 'contracts'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-xcode

      - name: Build for testing
        env:
          # A build destination only; nothing boots on this runner.
          BUILD_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=${{ env.IOS_SIMULATOR_OS }}
        run: ci/build-for-testing "${BUILD_DESTINATION}"

      - name: Package the test build
        if: inputs.mode != 'contracts'
        run: |
          set -euo pipefail
          # Only what test-without-building reads: the xctestrun and the products it names (about 180 of
          # 232 MB; module files, objects and bundle copies stay behind). Artifacts drop file modes, so a tar
          # keeps the bundles' executables and signatures intact.
          cd DerivedData/Build
          products=(Products/*.xctestrun)
          for product in Talaria.app TalariaLiveActivityWidget.appex TalariaShareExtension.appex; do
            products+=("Products/Debug-iphonesimulator/${product}")
          done
          tar -cf "${RUNNER_TEMP}/app-build.tar" "${products[@]}"

      - name: Upload the test build
        if: inputs.mode != 'contracts'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/app-build.tar
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  package-test:
    # TalariaKit (models, networking, persistence, sync, view models) tests on macOS with `swift test`: no
    # simulator and no app host (TAL-399). It runs beside the build; only the live contract test waits for the
    # Web probe. The fuzz soak class belongs to the scheduled Fuzz Soak workflow.
    name: App package tests
    if: inputs.package_tests
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
      # Reads this run's job list to wait for the Web contract probe.
      actions: read
    env:
      CONTRACTS_SELECTED: ${{ inputs.contracts }}
      LIVE_CONTRACT_TEST: TalariaKitTests.APIClientSessionListTests testLiveUpstreamContractResponsesDecodeWhenSupplied
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-xcode

      # The committed Package.resolved pins the App's revisions; resolution never drifts from it. Coverage is measured
      # on this run, the one CI Gate counts (TAL-67).
      - name: Build the package tests
        run: swift build --package-path TalariaKit --build-tests --enable-code-coverage --only-use-versions-from-resolved-file

      - name: Wait for the Web contract probe
        if: env.CONTRACTS_SELECTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/wait-for-job "Web contract probe" 1500

      - name: Download the probe's live response fixture
        if: env.CONTRACTS_SELECTED == 'true'
        uses: actions/download-artifact@v8
        with:
          name: contract-fixture
          path: ${{ runner.temp }}/contract-fixture

      - name: Test the package
        run: |
          set -euo pipefail
          fixture="${RUNNER_TEMP}/contract-fixture/live-responses.json"
          if [[ "${CONTRACTS_SELECTED}" == "true" ]]; then
            [[ -s "${fixture}" ]] || { echo "The probe artifact has no live-responses.json" >&2; exit 1; }
            export TALARIA_LIVE_CONTRACT_RESPONSES="${fixture}"
          fi
          start_seconds=${SECONDS}
          swift test --package-path TalariaKit --skip-build --enable-code-coverage --skip UntrustedInputFuzzSoakTests 2>&1 |
            tee package-tests.log
          if [[ "${CONTRACTS_SELECTED}" == "true" ]]; then
            # A missing fixture makes the live test skip, so require an explicit pass.
            grep -qF -- "Test Case '-[${LIVE_CONTRACT_TEST}]' passed" package-tests.log ||
              { echo "The live Web contract test did not pass against the fixture" >&2; exit 1; }
          fi
          {
            echo "### Package tests"
            echo "- swift test: $((SECONDS - start_seconds))s, $(grep -oE 'Executed [0-9]+ tests' package-tests.log | tail -1)"
          } >> "${GITHUB_STEP_SUMMARY}"

      # After a failure too: the report merges whatever profiles the run wrote. The numbers gate nothing.
      - name: Report coverage
        if: ${{ !cancelled() }}
        run: ci/package-coverage coverage >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-package-coverage
          path: app/coverage/
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore

  build-started:
    # Two suites queued together once filled all five hosted macOS slots with test jobs waiting for builds that never
    # got a runner, and every one timed out without a test (TAL-413). The test job therefore queues only once its build
    # holds a runner: a test job that holds a slot then waits at most for a build that is running. This Linux job
    # holds no macOS slot while the build queues, and queue time counts toward no job's timeout, so it may wait long.
    # "Re-run failed jobs" keeps this job's success, so after a failed build use "Re-run all jobs" to keep the gate.
    name: App build started
    if: inputs.mode != 'contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
      # Reads this run's job list to see the build start.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: app/ci

      - name: Wait until the build holds a macOS runner
        env:
          GH_TOKEN: ${{ github.token }}
          # Up to hours behind other macOS jobs: poll every 15 seconds rather than 5.
          WAIT_FOR_JOB_POLL_SECONDS: "15"
        run: ci/wait-for-job "${BUILD_JOB}" 20700 "Set up job"

  app-test:
    # Boots its simulator to completion while the build runs on another runner and a background poll watches for the
    # build's upload, then downloads the build and runs the hosted unit tests (TalariaTests).
    name: App hosted tests
    needs: build-started
    if: inputs.mode != 'contracts'
    runs-on: xcode-27
    # The test step's own limit ends the tests, and this one only backs it up: setup takes up to about 15 minutes
    # before that step, and a loaded runner took 9 minutes over a single report after it (TAL-670).
    timeout-minutes: 75
    permissions:
      contents: read
      # Reads this run's job list to wait for the build.
      actions: read
      # ci/report-test-failures posts each failing test as a commit status while the job runs (TAL-673).
      statuses: write
    env:
      FAILURE_STATUS: App hosted test failures
      RESULT_BUNDLE_PATH: TestResults.xcresult
      # Relative to app/, like the result bundle; the memory log uploads on every run (TAL-419).
      MEMORY_LOG: memory.log
      XCODEBUILD_LOG: xcodebuild-test.log
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Right after the simulator's first boot this runner is starved: a poll started then took 30 to 150 s per gh
      # call, the first the slowest, and saw an upload that had finished before it began only minutes later
      # (TAL-405). Polling from before the boot keeps that behind the boot; "Wait for the build" collects the result.
      - name: Start waiting for the build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016 # The background shell expands these.
          nohup bash -c 'ci/wait-for-job "${BUILD_JOB}" 2700 "Upload the test build"; echo $? > "${RUNNER_TEMP}/build-wait.tmp"
            mv "${RUNNER_TEMP}/build-wait.tmp" "${RUNNER_TEMP}/build-wait.status"' > "${RUNNER_TEMP}/build-wait.log" 2>&1 < /dev/null &
          echo $! > "${RUNNER_TEMP}/build-wait.pid"

      - uses: ./.github/actions/setup-xcode

      # The image's own iPhone 17 on the newest runtime the SDK runs (setup-xcode's IOS_SIMULATOR_OS), booted to
      # completion before the wait and the download so nothing competes with its first boot; App build runs meanwhile
      # on another runner.
      - name: Boot the simulator
        id: sim
        uses: futureware-tech/simulator-action@e89aa8f93d3aec35083ff49d2854d07f7186f7f5 # v5
        with:
          model: iPhone 17
          os: iOS
          os_version: ~${{ env.IOS_SIMULATOR_OS }}
          erase_before_boot: false
          wait_for_boot: true
          boot_timeout_seconds: 600
          # The hosted runner is discarded anyway.
          shutdown_after_job: false

      # The keyboard's slide-to-type introduction marked as shown (TAL-668), the notification service answering
      # (TAL-651) and a photo the tests own (TAL-633).
      - name: Prepare the simulator
        run: scripts/prepare-ui-simulator "${{ steps.sim.outputs.udid }}"

      # Returns once the background poll has seen the build's upload step succeed; fails once it sees the build fail
      # or get cancelled, or if the poll stopped without a result.
      - name: Wait for the build
        run: |
          set -euo pipefail
          status="${RUNNER_TEMP}/build-wait.status"
          while [[ ! -f "${status}" ]]; do
            kill -0 "$(cat "${RUNNER_TEMP}/build-wait.pid")" 2>/dev/null || [[ -f "${status}" ]] ||
              { cat "${RUNNER_TEMP}/build-wait.log"; echo "The build wait stopped without a result" >&2; exit 1; }
            sleep 1
          done
          cat "${RUNNER_TEMP}/build-wait.log"
          exit "$(cat "${status}")"

      # curl, not actions/download-artifact, which fetched this 82 MB artifact at about 1 MB/s on hosted macOS.
      - name: Download the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          start_epoch=$(date +%s)
          # The artifact list can trail the upload step, so look it up for up to two minutes; gh-api-poll rides out
          # transient API errors.
          url=""
          for _ in $(seq 24); do
            url=$(ci/gh-api-poll -H "Cache-Control: no-cache" "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${BUILD_ARTIFACT}&poll=${SECONDS}" \
              --jq '.artifacts[0].archive_download_url // empty')
            [[ -z "${url}" ]] || break
            sleep 5
          done
          [[ -n "${url}" ]] || { echo "${BUILD_JOB} uploaded, but its ${BUILD_ARTIFACT} artifact is not listed" >&2; exit 1; }
          # The redirect to blob storage drops the Authorization header (curl sends it to the API host only).
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -o "${RUNNER_TEMP}/app-build.zip" "${url}"
          unzip -q -o "${RUNNER_TEMP}/app-build.zip" -d "${RUNNER_TEMP}"
          echo "- Test build download: $((SECONDS - start_seconds))s ($(du -h "${RUNNER_TEMP}/app-build.zip" | cut -f1))" | tee -a "${GITHUB_STEP_SUMMARY}"
          # The handoff latency (TAL-405): the newest upload at or before this attempt, to this step's start.
          # shellcheck disable=SC2016 # jq, not the shell, expands $ENV.
          uploaded=$(ci/gh-api-poll --paginate -H "Cache-Control: no-cache" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=all&per_page=100&poll=${SECONDS}" \
            --jq '.jobs[] | select((.name == $ENV.BUILD_JOB or (.name | endswith(" / " + $ENV.BUILD_JOB))) and .run_attempt <= ($ENV.GITHUB_RUN_ATTEMPT | tonumber))
              | .steps[]? | select(.name == "Upload the test build" and .completed_at) | .completed_at | fromdate' |
            sort -n | tail -n 1) || uploaded=""
          handoff="unknown"
          [[ -z "${uploaded}" ]] || handoff="$((start_epoch - uploaded)) s"
          echo "- Build upload → download start: ${handoff}" | tee -a "${GITHUB_STEP_SUMMARY}"
          mkdir -p Build
          tar -C Build -xf "${RUNNER_TEMP}/app-build.tar"

      # The memory sampler runs for the whole step; "Report memory" stops it, summarizes it and uploads its log.
      # The step's own limit ends a stuck run inside the job's, so the steps after it still upload the result bundle
      # and the memory log and the job fails rather than being cancelled, which the failure alert sees (TAL-670).
      # Within it, XCTest's per-test limit (10 minutes by default) fails a hung test by name, with a spindump, and the
      # run goes on.
      - name: Test without building
        timeout-minutes: 45
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.udid }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          nohup ci/memory-sampler watch "${MEMORY_LOG}" "${XCODEBUILD_LOG}" > /dev/null 2>&1 < /dev/null &
          echo $! > "${RUNNER_TEMP}/memory-sampler.pid"
          # A job's log is unreadable until the job ends, so each failing test also goes out as a commit status the
          # moment it fails (TAL-673).
          ci/report-test-failures "${XCODEBUILD_LOG}" "$(git rev-parse HEAD)" "${FAILURE_STATUS}" < /dev/null &
          reporter=$!
          trap 'kill "${reporter}" 2>/dev/null || true' EXIT
          start_seconds=${SECONDS}
          xctestrun=(Build/Products/*.xctestrun)
          # No run collects the simulator's diagnostics: on a hosted runner that waited 600 s on every run, passing or
          # failing, and never returned any (TAL-669). The result bundle keeps each failure's screenshots and logs.
          status=0
          xcodebuild test-without-building \
            -xctestrun "${xctestrun[0]}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -only-testing:TalariaTests \
            -testLanguage en \
            -testRegion US \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES \
            -parallel-testing-enabled NO 2>&1 | tee -a "${XCODEBUILD_LOG}" || status=$?
          duration_seconds=$((SECONDS - start_seconds))
          echo "### App hosted tests" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Test without building: ${duration_seconds}s" >> "${GITHUB_STEP_SUMMARY}"
          # A passing run replaces an earlier run's failure status on this commit with success.
          [[ "${status}" != 0 ]] || ci/report-test-failures --passed "$(git rev-parse HEAD)" "${FAILURE_STATUS}"
          # CoreSimulator's own log says what booted or shut down a simulator mid-test, which no result bundle records
          # (TAL-869). Beside the bundle, so the failure upload keeps its layout.
          [[ "${status}" == 0 ]] || cp "${HOME}/Library/Logs/CoreSimulator/CoreSimulator.log" CoreSimulator.log || true
          exit "${status}"

      # Ahead of the reports, so a slow report never costs the evidence its time (TAL-670).
      - name: Upload test results on failure
        timeout-minutes: 10
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: app-test-results
          path: |
            app/TestResults.xcresult
            app/CoreSimulator.log
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore

      - name: Report memory
        timeout-minutes: 3
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          [[ -f "${RUNNER_TEMP}/memory-sampler.pid" ]] || { echo "The memory sampler never started."; exit 0; }
          kill "$(cat "${RUNNER_TEMP}/memory-sampler.pid")" 2>/dev/null || true
          ci/memory-sampler summary "${MEMORY_LOG}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload memory samples
        timeout-minutes: 5
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: app-test-memory
          path: app/${{ env.MEMORY_LOG }}
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore

      - name: Report slowest tests
        timeout-minutes: 3
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ ! -d "${RESULT_BUNDLE_PATH}" ]]; then
            echo "No result bundle is available; skipping slow-test reporting."
            exit 0
          fi

          xcrun xcresulttool get test-results tests \
            --path "${RESULT_BUNDLE_PATH}" \
            --compact > test-results.json

          python3 - <<'PY' | tee slowest-tests.txt
          import json

          with open("test-results.json", encoding="utf-8") as results_file:
              results = json.load(results_file)

          tests = []

          def visit(node, parents):
              name = node.get("name", "<unnamed>")
              node_type = node.get("nodeType")
              path = [*parents, name]
              duration = node.get("durationInSeconds")
              if node_type == "Test Case" and isinstance(duration, (int, float)):
                  tests.append((duration, " / ".join(path)))
              for child in node.get("children", []):
                  visit(child, path)

          for root in results.get("testNodes", []):
              visit(root, [])

          print("Slowest test cases:")
          for duration, name in sorted(tests, reverse=True)[:20]:
              print(f"{duration:8.3f}s  {name}")
          PY

          {
            echo ""
            echo "#### Slowest test cases"
            echo '```text'
            cat slowest-tests.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Performance budgets are only useful against previous runs, so every run
      # keeps its measurements as an artifact and prints them into the summary.
      - name: Record performance metrics
        timeout-minutes: 3
        if: always()
        continue-on-error: true
        run: scripts/report-performance-metrics "${RESULT_BUNDLE_PATH}"

      - name: Upload performance metrics
        timeout-minutes: 5
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: app-performance-metrics
          path: |
            app/performance-metrics.json
            app/performance-metrics.txt
          retention-days: 30
          overwrite: true
          if-no-files-found: ignore
