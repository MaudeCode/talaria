name: Talaria Web Docker smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke Compose variants and container identity
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check isolated container variants
        run: python3 scripts/check-docker.py
