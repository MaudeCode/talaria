name: Talaria Web Docker smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke Compose variant ${{ matrix.variant }} and container identity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [single, two-container, three-container, auto-uid, explicit-uid, agent-upgrade]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/docker-plugins
      # BuildKit's GitHub Actions cache reads the runtime token and cache URL, which only action steps receive.
      - name: Expose the Actions cache service to Buildx
        uses: actions/github-script@v9
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
              if (process.env[name]) core.exportVariable(name, process.env[name])
            }
      - name: Check the isolated container variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          # The entrypoint's Agent install runs under real uv against a spoofed PyPI (TAL-2195).
          python3 -m pip install --disable-pip-version-check "uv==0.11.3"
          python3 -m unittest discover -s web/scripts/lib -p 'test_*.py'
          # Every variant builds the same image, so they share one layer cache scope; the cache needs a container builder.
          docker buildx create --driver docker-container --use --bootstrap >/dev/null
          export TALARIA_DOCKER_CACHE="type=gha,scope=web-smoke"
          python3 scripts/check-docker.py "${VARIANT}"
