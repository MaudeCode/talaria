name: Release set
'on':
  workflow_call:
    inputs:
      request:
        description: JSON sourceRevision, tags and relayDeploymentId.
        required: true
        type: string
      previous_release_set:
        required: false
        default: ''
        type: string
      dry_run:
        required: false
        default: true
        type: boolean
      release_tag:
        description: The root vX.Y.Z tag the tag job creates after publish-set; production only.
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      request:
        description: JSON sourceRevision, tags and relayDeploymentId.
        required: true
        type: string
      previous_release_set:
        description: Previous completed release-set SHA; empty only for bootstrap.
        required: false
        default: ''
        type: string
      dry_run:
        description: Direct dispatch supports dry runs only.
        required: true
        default: true
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: talaria-release-set
  cancel-in-progress: false
# Handoffs are this run's Actions artifacts: `artifacts.py put` stages and digests them, the next step uploads
# them, and `artifacts.py get` (job token, actions: read) downloads only forwarded producer outputs whose run,
# attempt, source and SHA-256 match. Every gate and build starts as soon as prepare has the plan (TAL-414), except the
# App's hosted tests, which wait for the other macOS jobs so a release holds at most three (TAL-2396); build-gate joins
# them all before anything publishes. Relay
# deploys first, then Web, the App and the feedback bridge image publish at once, then the manifest; the tag job
# creates the version tags last (releases/README.md).
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source: ${{ steps.plan.outputs.source }}
      app_changed: ${{ steps.plan.outputs.app_changed }}
      web_changed: ${{ steps.plan.outputs.web_changed }}
      relay_changed: ${{ steps.plan.outputs.relay_changed }}
      app_version: ${{ steps.plan.outputs.app_version }}
      hosted_tests: ${{ steps.reuse.outputs.hosted_tests }}
      web_tests: ${{ steps.reuse.outputs.web_tests }}
      relay_tests: ${{ steps.reuse.outputs.relay_tests }}
      agent_jobs: ${{ steps.agents.outputs.jobs }}
      artifacts: ${{ steps.store.outputs.artifacts }}
    steps:
    - name: Check publication authority
      env:
        DRY_RUN: ${{ inputs.dry_run }}
        CALLER: ${{ github.workflow_ref }}
      run: |
        set -euo pipefail
        if [[ "$DRY_RUN" != true ]]; then
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$CALLER" == MaudeCode/talaria/.github/workflows/production-cutover.yml@refs/heads/main ]]
        fi
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - name: Resolve and validate immutable release plan
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
        REQUEST: ${{ inputs.request }}
        PREVIOUS: ${{ inputs.previous_release_set }}
        DRY_RUN: ${{ inputs.dry_run }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        git fetch --no-tags origin main:refs/remotes/origin/main
        printf '%s' "$REQUEST" > "$RUNNER_TEMP/request.json"
        options=()
        if [[ -n "$PREVIOUS" ]]; then
          "$RELEASE_PYTHON" releases/cli.py previous "$PREVIOUS" --output "$RUNNER_TEMP/previous.json"
          options+=(--previous "$RUNNER_TEMP/previous.json")
        fi
        if [[ "$DRY_RUN" == true ]]; then options+=(--dry-run); fi
        if [[ -n "$RELEASE_TAG" ]]; then options+=(--release-tag "$RELEASE_TAG"); fi
        "$RELEASE_PYTHON" releases/cli.py prepare --request "$RUNNER_TEMP/request.json" --output "$RUNNER_TEMP/release-plan" "${options[@]}"
    - name: Reuse main CI's passed suites on the release source, or run them
      # Each changed component's suite (the App's hosted tests, Web's server and frontend suites, Relay's) is reused
      # when a ci.yml push run on main at exactly the release source passed every job of it, whatever its other jobs
      # did; otherwise this release runs it (TAL-2396, after TAL-1550). Nothing waits for main CI. A lookup error fails
      # prepare: it never counts as "none".
      id: reuse
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE: ${{ steps.plan.outputs.source }}
        APP: ${{ steps.plan.outputs.app_changed }}
        WEB: ${{ steps.plan.outputs.web_changed }}
        RELAY: ${{ steps.plan.outputs.relay_changed }}
      run: |
        set -euo pipefail
        checks=()
        [[ "$APP" != true ]] || checks+=(hosted_tests)
        [[ "$WEB" != true ]] || checks+=(web_tests)
        [[ "$RELAY" != true ]] || checks+=(relay_tests)
        "$RELEASE_PYTHON" releases/main_ci.py "$SOURCE" "${checks[@]}" | tee -a "$GITHUB_OUTPUT"
    - name: List the selected Web source's supported Agent releases and their shards
      # One agent-release job per release and shard (TAL-1550, TAL-1599); agent requires exactly these jobs' receipts.
      id: agents
      run: |
        set -euo pipefail
        jobs=$("$RELEASE_PYTHON" scripts/check-release-agent.py --plan "$RUNNER_TEMP/release-plan/plan.json" --list)
        echo "jobs=${jobs}" >> "$GITHUB_OUTPUT"
    - name: Stage release-plan for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put release-plan "$RUNNER_TEMP/release-plan"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
  app-hosted-tests:
    # The App's simulator-hosted unit tests (app-tests.yml in hosted mode: the App build and the TalariaTests
    # shards) on the exact release source whenever the App ships, dry runs included, unless prepare found main CI's to
    # reuse; build-gate requires one or the other. The contracts job runs the package tests instead (TAL-414).
    # At most three macOS jobs run in a release (TAL-2396): contracts and the App build run first, two of them, and these
    # tests start only once both are done, as their build and two shards at a time, three. app-publish follows
    # build-gate, alone.
    needs:
    - prepare
    - contracts
    - app-dry-build
    - app-signed-build
    if: ${{ !cancelled() && needs.prepare.outputs.app_changed == 'true' && needs.prepare.outputs.hosted_tests == '' && needs.contracts.result
      == 'success' && (needs.app-dry-build.result == 'success' || needs.app-signed-build.result == 'success') }}
    permissions:
      contents: read
      actions: read
      # app-tests.yml's test job posts failing tests as commit statuses (TAL-673).
      statuses: write
    uses: ./.github/workflows/app-tests.yml
    with:
      mode: hosted
      ref: ${{ needs.prepare.outputs.source }}
      package_tests: false
      shards_at_once: 2
  web-tests:
    # Web's server suite on every storage backend, its frontend checks and its Playwright shards on the exact release
    # source when Web ships, unless prepare found main CI's to reuse; build-gate requires one or the other (TAL-2396).
    # The Agent gate runs the sidecar suite against every supported Agent release, so this call leaves it out.
    needs: prepare
    if: needs.prepare.outputs.web_changed == 'true' && needs.prepare.outputs.web_tests == ''
    uses: ./.github/workflows/web-verify.yml
    with:
      ref: ${{ needs.prepare.outputs.source }}
      server: true
      frontend: true
      sidecar: false
  relay-tests:
    # Relay's suite on the exact release source when Relay ships, unless prepare found main CI's to reuse (TAL-2396).
    needs: prepare
    if: needs.prepare.outputs.relay_changed == 'true' && needs.prepare.outputs.relay_tests == ''
    uses: ./.github/workflows/relay-verify.yml
    with:
      ref: ${{ needs.prepare.outputs.source }}
  contracts:
    # macOS: both App contract gates on one runner (TAL-414), each writing its own receipt. currentContracts tests the
    # selected App against every supported Web source and, when the App ships, runs its whole TalariaKit suite
    # (app-tests.yml's package tests, which the release's hosted-tests call leaves out); previousAppContracts compiles
    # the previously released App from Git and tests it against the selected Web. Both spend minutes probing Webs
    # beside their builds, so they run at once, with `swift test` (TAL-399) or one of them in the simulator; two Apps
    # from before TAL-399 would share the one simulator, so they take turns. One runner for both, beside the App build,
    # leaves the hosted tests to follow within the release's three macOS jobs (releases/README.md).
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/setup-xcode
    - uses: ./.github/actions/release-python
    - uses: ./.github/actions/release-node
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - name: Select the image's iPhone 17
      run: |
        set -euo pipefail
        hosted=0
        for app in $(jq -er '.components.app.sourceRevision, .previousAppSource' "$RUNNER_TEMP/release-plan/plan.json"); do
          git cat-file -e "${app}:app/TalariaKit/Package.swift" 2>/dev/null || hosted=$((hosted + 1))
        done
        if (( hosted == 0 )); then
          echo "Both Apps test their contract classes with swift test; no simulator."
          exit 0
        fi
        # The App's own scripts/test-ios leases, boots and shuts down exactly this simulator (IOS_SIMULATOR_ID; it
        # never erases a named device), so no pool is set up. The runtime is setup-xcode's IOS_SIMULATOR_OS, as in CI.
        runtime="com.apple.CoreSimulator.SimRuntime.iOS-${IOS_SIMULATOR_OS//./-}"
        udid=$(xcrun simctl list devices available --json |
          jq -er --arg runtime "$runtime" 'first(.devices[$runtime][]? | select(.name == "iPhone 17") | .udid)')
        echo "Using iPhone 17 ${udid} on ${runtime} for ${hosted} App revision(s) from before TAL-399"
        printf 'IOS_SIMULATOR_ID=%s\nIOS_SIMULATOR_RUNTIME=%s\nSIMULATOR_APPS=%s\n' "$udid" "$runtime" "$hosted" >> "$GITHUB_ENV"
    - name: Verify the selected and the previously released App against the Web sources
      env:
        TALARIA_TEST_WORKER_COUNT: '1'
      run: |
        set -euo pipefail
        plan="$RUNNER_TEMP/release-plan/plan.json"
        previous=$(jq -er .previousAppSource "$plan")
        web=$(jq -er .components.web.sourceRevision "$plan")
        current() {
          "$RELEASE_PYTHON" releases/cli.py gate --plan "$plan" --name currentContracts --output "$RUNNER_TEMP/contract-receipts/currentContracts.json" -- \
            "$RELEASE_PYTHON" scripts/check-release-contracts.py --only app --plan "$plan" --output "$RUNNER_TEMP/current-contracts"
        }
        previous_app() {
          "$RELEASE_PYTHON" releases/cli.py gate --plan "$plan" --name previousAppContracts --output "$RUNNER_TEMP/previous-app-receipts/previousAppContracts.json" -- \
            "$RELEASE_PYTHON" scripts/check-previous-app.py --app-ref "$previous" --web-ref "$web" --output "$RUNNER_TEMP/previous-app"
        }
        failed=()
        if [[ "${SIMULATOR_APPS:-0}" == 2 ]]; then
          current > "$RUNNER_TEMP/current-contracts.log" 2>&1 || failed+=(currentContracts)
          previous_app > "$RUNNER_TEMP/previous-app.log" 2>&1 || failed+=(previousAppContracts)
        else
          current > "$RUNNER_TEMP/current-contracts.log" 2>&1 &
          current_pid=$!
          previous_app > "$RUNNER_TEMP/previous-app.log" 2>&1 &
          previous_pid=$!
          wait "$current_pid" || failed+=(currentContracts)
          wait "$previous_pid" || failed+=(previousAppContracts)
        fi
        for gate in current-contracts previous-app; do
          echo "::group::${gate} log"
          cat "$RUNNER_TEMP/${gate}.log"
          echo "::endgroup::"
        done
        # Phase durations (seconds) of the selected Web's pair and the previous App (TAL-414).
        for result in current-contracts/app-web-0 previous-app; do
          phases=$(jq -c '.seconds // empty' "$RUNNER_TEMP/${result}/verification.json" 2>/dev/null || true)
          [[ -z "$phases" ]] || echo "- ${result}: ${phases}" >> "$GITHUB_STEP_SUMMARY"
        done
        (( ${#failed[@]} == 0 )) || { echo "::error::${failed[*]} failed; see the log groups above."; exit 1; }
    - name: Stage contract-receipts for other jobs
      id: store-current
      run: '"$RELEASE_PYTHON" releases/artifacts.py put contract-receipts "$RUNNER_TEMP/contract-receipts"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store-current.outputs.handoff_name }}
        path: ${{ steps.store-current.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    - name: Stage previous-app-receipts for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put previous-app-receipts "$RUNNER_TEMP/previous-app-receipts"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    - name: Retain sanitized App contract diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: release-contract-diagnostics-${{ github.run_attempt }}
        path: ${{ runner.temp }}/current-contracts
        retention-days: 30
        if-no-files-found: ignore
    - name: Retain sanitized previous App diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: previous-app-contract-diagnostics-${{ github.run_attempt }}
        path: ${{ runner.temp }}/previous-app
        retention-days: 30
        if-no-files-found: ignore
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  component-contracts:
    # The Web contracts suite, the Web publisher body pin, and Relay publisher fixtures at their selected refs.
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - uses: ./.github/actions/release-node
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - name: Verify selected Web and Relay fixture contracts
      run: '"$RELEASE_PYTHON" scripts/check-release-contracts.py --only fixtures --plan "$RUNNER_TEMP/release-plan/plan.json" --output "$RUNNER_TEMP/component-contracts"'
    - name: Retain component contract diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: component-contract-diagnostics-${{ github.run_attempt }}
        path: ${{ runner.temp }}/component-contracts
        retention-days: 30
        if-no-files-found: ignore
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
  agent-release:
    # One job per supported Agent release of the selected Web source and shard of its sidecar suite (TAL-1550,
    # TAL-1599), so the gate takes about as long as its slowest shard instead of a whole release. Each runs its release's
    # probe and image check and its shard's cases with the runner's whole worker budget, and writes its own receipts
    # through `cli.py gate`; agent joins them.
    name: agent ${{ matrix.release }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.agent_jobs) }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - name: Set up Node for the selected server compatibility build
      uses: actions/setup-node@v7
      with:
        node-version-file: web/.nvmrc
    - name: Install uv (the Agent's locked dependency resolver)
      run: python3 -m pip install --disable-pip-version-check "uv==0.11.3"
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - name: Verify recorded Web and Agent identity and this supported Agent release's shard
      env:
        # Read-only, for the Agent release API's published-release check.
        GITHUB_TOKEN: ${{ github.token }}
        RELEASE: ${{ matrix.release }}
        SHARD: ${{ matrix.shard }}
        SHARDS: ${{ matrix.shards }}
      run: |
        "$RELEASE_PYTHON" releases/cli.py gate --plan "$RUNNER_TEMP/release-plan/plan.json" --name agentCompatibility --output "$RUNNER_TEMP/agent-compatibility/${RELEASE}.shard-${SHARD}.gate.json" -- \
          "$RELEASE_PYTHON" scripts/check-release-agent.py --plan "$RUNNER_TEMP/release-plan/plan.json" --release "$RELEASE" --shard "${SHARD}/${SHARDS}" --receipts "$RUNNER_TEMP/agent-compatibility"
    # The join reads these: each shard's gate receipt and compatibility receipt with the cases it ran.
    - name: Retain Agent compatibility receipts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: agent-compatibility-${{ matrix.release }}-shard-${{ matrix.shard }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/agent-compatibility
        retention-days: 30
        if-no-files-found: ignore
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
  agent:
    # Joins agent-release: a failed shard job skips this one, which fails build-gate. It writes the release's one
    # agentCompatibility receipt only once every supported release's shards left passing receipts in this run (a rerun
    # keeps the shards that passed before) and together ran each of that release's sidecar test cases exactly once.
    needs:
    - prepare
    - agent-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - name: Download every shard's Agent compatibility receipts
      # The matrix legs share one set of job outputs, so they cannot forward a digest each: gather takes only this run's
      # artifacts of this workflow source, and the next step checks every receipt's run, source and coverage.
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py gather agent-compatibility "$RUNNER_TEMP/agent-shards"'
    - name: Require a passing receipt for every supported Agent release's shards
      env:
        JOBS: ${{ needs.prepare.outputs.agent_jobs }}
      run: |
        "$RELEASE_PYTHON" releases/cli.py gate --plan "$RUNNER_TEMP/release-plan/plan.json" --name agentCompatibility --output "$RUNNER_TEMP/agent-receipts/agentCompatibility.json" -- \
          "$RELEASE_PYTHON" scripts/check-release-agent.py --plan "$RUNNER_TEMP/release-plan/plan.json" --expect "$JOBS" --receipts "$RUNNER_TEMP/agent-shards"
    - name: Stage agent-receipts for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put agent-receipts "$RUNNER_TEMP/agent-receipts"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  relay-build:
    # Builds consume only the release plan, so they run alongside the gates and each other; build-gate
    # joins every gate and build before anything publishes (TAL-319).
    needs: prepare
    if: needs.prepare.outputs.relay_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - uses: ./.github/actions/release-node
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - run: '"$RELEASE_PYTHON" releases/build.py relay --plan "$RUNNER_TEMP/release-plan/plan.json" --output "$RUNNER_TEMP/relay-build"'
    - name: Stage relay-build for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put relay-build "$RUNNER_TEMP/relay-build"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  bridge-build:
    # The Relay release's feedback bridge image, in its own job beside relay-build so it never lengthens it. Builds
    # consume only the release plan; build-gate joins every gate and build before anything publishes.
    needs: prepare
    if: needs.prepare.outputs.relay_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - uses: ./.github/actions/skopeo
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - name: Build, load and check the linux/amd64 OCI image
      run: '"$RELEASE_PYTHON" releases/build.py bridge --plan "$RUNNER_TEMP/release-plan/plan.json" --output "$RUNNER_TEMP/bridge-build"'
    - name: Separate the OCI archive from the receipt
      run: |
        set -euo pipefail
        mkdir "$RUNNER_TEMP/bridge-image"
        mv "$RUNNER_TEMP/bridge-build/bridge.oci.tar" "$RUNNER_TEMP/bridge-image/"
    # Two artifacts: receipt assembly downloads bridge-build without the OCI archive.
    - name: Stage bridge-build for other jobs
      id: store-build
      run: '"$RELEASE_PYTHON" releases/artifacts.py put bridge-build "$RUNNER_TEMP/bridge-build"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store-build.outputs.handoff_name }}
        path: ${{ steps.store-build.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    - name: Stage bridge-image for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put bridge-image "$RUNNER_TEMP/bridge-image"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  web-build:
    # Builds consume only the release plan, so they run alongside the gates and each other; build-gate
    # joins every gate and build before anything publishes (TAL-319).
    needs: prepare
    if: needs.prepare.outputs.web_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - name: Set up Node for the npm package build
      uses: actions/setup-node@v7
      with:
        node-version-file: web/.nvmrc
        cache: npm
        cache-dependency-path: web/package-lock.json
    - uses: ./.github/actions/docker-plugins
      with:
        multi-platform: "true"
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - name: Read the Actions cache service identity for Buildx
      # A run step cannot see the runtime token BuildKit's gha cache needs; hand it, masked, to the build step only.
      id: cache-service
      uses: actions/github-script@v9
      with:
        script: |
          core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
          core.setOutput('token', process.env.ACTIONS_RUNTIME_TOKEN);
          core.setOutput('url', process.env.ACTIONS_RESULTS_URL);
    - name: Build the npm packages and the multi-platform image
      env:
        # Web image layers come from and go to the GitHub Actions cache; docker-plugins made a container builder.
        TALARIA_DOCKER_CACHE: type=gha,scope=talaria-web-release,version=2
        ACTIONS_RUNTIME_TOKEN: ${{ steps.cache-service.outputs.token }}
        ACTIONS_RESULTS_URL: ${{ steps.cache-service.outputs.url }}
        ACTIONS_CACHE_SERVICE_V2: 'true'
      run: '"$RELEASE_PYTHON" releases/build.py web --plan "$RUNNER_TEMP/release-plan/plan.json" --output "$RUNNER_TEMP/web-build"'
    - name: Separate the large OCI archive from the receipt and npm handoff
      run: |
        set -euo pipefail
        mkdir "$RUNNER_TEMP/web-image"
        mv "$RUNNER_TEMP/web-build/web.oci.tar" "$RUNNER_TEMP/web-image/"
    # Two artifacts: receipt assembly and npm publication download web-build without the OCI archive.
    - name: Stage web-build for other jobs
      id: store-build
      run: '"$RELEASE_PYTHON" releases/artifacts.py put web-build "$RUNNER_TEMP/web-build"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store-build.outputs.handoff_name }}
        path: ${{ steps.store-build.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    - name: Stage web-image for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put web-image "$RUNNER_TEMP/web-image"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  app-dry-build:
    # macOS: unsigned xcodebuild archive. Builds consume only the release plan; build-gate joins every gate and build
    # before anything publishes.
    needs: prepare
    if: inputs.dry_run && needs.prepare.outputs.app_changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/setup-xcode
    - uses: ./.github/actions/release-python
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - run: '"$RELEASE_PYTHON" releases/build.py app --plan "$RUNNER_TEMP/release-plan/plan.json" --output "$RUNNER_TEMP/app-build"'
    - name: Stage app-build receipt for other jobs
      id: store
      run: |
        set -euo pipefail
        mkdir "$RUNNER_TEMP/app-build-receipt"
        cp "$RUNNER_TEMP"/app-build/*.json "$RUNNER_TEMP/app-build-receipt/"
        "$RELEASE_PYTHON" releases/artifacts.py put app-build "$RUNNER_TEMP/app-build-receipt"
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  candidate:
    needs:
    - prepare
    - build-gate
    if: ${{ !cancelled() && inputs.dry_run && needs.build-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
    - uses: ./.github/actions/release-python
    - name: Restore verified release handoffs
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP/release-results" --receipts'
    - name: Assemble candidate from successful job outputs
      run: |
        set -euo pipefail
        "$RELEASE_PYTHON" releases/collect.py "$RUNNER_TEMP/release-results" "$RUNNER_TEMP/receipts"
        options=()
        previous="$RUNNER_TEMP/release-results/release-plan/previous.json"
        if [[ -f "$previous" ]]; then options+=(--previous "$previous"); fi
        "$RELEASE_PYTHON" releases/cli.py assemble --plan "$RUNNER_TEMP/release-results/release-plan/plan.json" \
          --receipts "$RUNNER_TEMP/receipts" --notes "$RUNNER_TEMP/release-results/release-plan/notes" \
          --output "$RUNNER_TEMP/candidate/release-set.json" "${options[@]}"
    - name: Record the candidate manifest
      run: |
        set -euo pipefail
        {
          printf '### Release manifest\n\n```json\n'
          cat "$RUNNER_TEMP/candidate/release-set.json"
          printf '\n```\n'
        } >> "$GITHUB_STEP_SUMMARY"
        cat "$RUNNER_TEMP/candidate/release-set.json"
    - name: Retain release-set-candidate
      uses: actions/upload-artifact@v7
      with:
        name: release-set-candidate-${{ github.run_attempt }}
        path: ${{ runner.temp }}/candidate
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
  app-signed-build:
    # Builds consume only the release plan; build-gate joins every gate and build before anything publishes (TAL-319).
    needs: prepare
    if: ${{ !inputs.dry_run && needs.prepare.outputs.app_changed == 'true' }}
    uses: ./.github/workflows/ios-release-build.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.source }}
      version: ${{ needs.prepare.outputs.app_version }}
      artifacts: ${{ needs.prepare.outputs.artifacts }}
  relay-publish:
    needs:
    - prepare
    - build-gate
    if: ${{ !cancelled() && !inputs.dry_run && needs.prepare.outputs.relay_changed == 'true' && needs.build-gate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: relay-production
    concurrency:
      group: talaria-relay-production
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - uses: ./.github/actions/release-node
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - name: Deploy the existing Relay and verify readiness/provenance
      env:
        CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        CONVEX_DISABLE_TELEMETRY: '1'
      run: |
        set -euo pipefail
        # The reviewed workflow owns publication code; component tags stay immutable.
        git show "${GITHUB_WORKFLOW_SHA}:releases/publish.py" > "$RUNNER_TEMP/publish.py"
        PYTHONPATH="$PWD/releases" "$RELEASE_PYTHON" "$RUNNER_TEMP/publish.py" relay \
          --plan "$RUNNER_TEMP/release-plan/plan.json" --output "$RUNNER_TEMP/relay-publish/receipt.json"
    - name: Stage relay-publish for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put relay-publish "$RUNNER_TEMP/relay-publish"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  web-publish:
    # npm first (trusted publishing needs this GitHub-hosted job's OIDC token), then GHCR once npm's readback
    # matches the built tarballs. A retry accepts npm versions already published with identical bytes. It follows the
    # Relay deployment, since the new Web was never tested against the previous Relay, and runs beside app-publish.
    needs:
    - prepare
    - build-gate
    - relay-publish
    if: ${{ !cancelled() && !inputs.dry_run && needs.prepare.outputs.web_changed == 'true' && needs.build-gate.result == 'success' && (needs.relay-publish.result
      == 'success' || (needs.prepare.outputs.relay_changed == 'false' && needs.relay-publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: web-release
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: write
    concurrency:
      group: talaria-web-publication
      cancel-in-progress: false
    timeout-minutes: 60  # npm readback may wait 40 minutes (TAL-420)
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - name: Restore release-plan, web-build and web-image
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        "$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan web-build web-image
        mv "$RUNNER_TEMP/web-image/web.oci.tar" "$RUNNER_TEMP/web-build/"
    - name: Set up Node for npm trusted publishing
      uses: actions/setup-node@v7
      with:
        node-version-file: web/.nvmrc
        registry-url: https://registry.npmjs.org
    - name: Require an npm CLI with trusted-publishing support
      run: npm install --global npm@latest
    - uses: ./.github/actions/skopeo
    - name: Publish the built npm packages and verify the readback
      run: |
        set -euo pipefail
        # The reviewed workflow owns publication code; component tags stay immutable.
        git show "${GITHUB_WORKFLOW_SHA}:releases/publish.py" > "$RUNNER_TEMP/publish.py"
        PYTHONPATH="$PWD/releases" "$RELEASE_PYTHON" "$RUNNER_TEMP/publish.py" web-npm --plan "$RUNNER_TEMP/release-plan/plan.json" \
          --build "$RUNNER_TEMP/web-build/receipt.json" --directory "$RUNNER_TEMP/web-build"
    - name: Install and boot the published npm package
      run: |
        set -euo pipefail
        # The Stable server resolves its contracts from the registry, so only the published version can boot. A failure
        # stops web-publish, and the updater never offers a release set that publish-set did not complete.
        git show "${GITHUB_WORKFLOW_SHA}:releases/smoke_npm.py" > "$RUNNER_TEMP/smoke_npm.py"
        "$RELEASE_PYTHON" "$RUNNER_TEMP/smoke_npm.py" "$(jq -r .npm "$RUNNER_TEMP/web-build/receipt.json")"
    - name: Confirm the npm readback, publish the OCI bytes and verify their readback
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        PYTHONPATH="$PWD/releases" "$RELEASE_PYTHON" "$RUNNER_TEMP/publish.py" web --plan "$RUNNER_TEMP/release-plan/plan.json" \
          --build "$RUNNER_TEMP/web-build/receipt.json" --directory "$RUNNER_TEMP/web-build" \
          --output "$RUNNER_TEMP/web-publish/receipt.json"
    - name: Stage web-publish for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put web-publish "$RUNNER_TEMP/web-publish"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  bridge-publish:
    # After the Relay deployment it ships with, beside web-publish and app-publish. The release is the only publisher
    # of ghcr.io/maudecode/talaria-feedback-bridge: an existing X.Y.Z tag must already serve the built digest.
    needs:
    - prepare
    - build-gate
    - relay-publish
    - bridge-build
    if: ${{ !cancelled() && !inputs.dry_run && needs.prepare.outputs.relay_changed == 'true' && needs.build-gate.result == 'success' && needs.relay-publish.result
      == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - uses: ./.github/actions/skopeo
    - name: Restore release-plan, bridge-build and bridge-image
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        "$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan bridge-build bridge-image
        mv "$RUNNER_TEMP/bridge-image/bridge.oci.tar" "$RUNNER_TEMP/bridge-build/"
    - name: Publish the OCI bytes at the Relay version and verify their readback
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # The reviewed workflow owns publication code; component tags stay immutable.
        git show "${GITHUB_WORKFLOW_SHA}:releases/publish.py" > "$RUNNER_TEMP/publish.py"
        PYTHONPATH="$PWD/releases" "$RELEASE_PYTHON" "$RUNNER_TEMP/publish.py" bridge --plan "$RUNNER_TEMP/release-plan/plan.json" \
          --build "$RUNNER_TEMP/bridge-build/receipt.json" --directory "$RUNNER_TEMP/bridge-build" \
          --output "$RUNNER_TEMP/bridge-publish/receipt.json"
    - name: Stage bridge-publish for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put bridge-publish "$RUNNER_TEMP/bridge-publish"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  app-publish:
    name: Publish iOS app
    # Beside web-publish, after the Relay deployment: the new App was tested against every supported Web, but never
    # against the previous Relay (TAL-414).
    needs:
    - prepare
    - build-gate
    - relay-publish
    if: ${{ !cancelled() && !inputs.dry_run && needs.prepare.outputs.app_changed == 'true' && needs.build-gate.result == 'success' && (needs.relay-publish.result
      == 'success' || (needs.prepare.outputs.relay_changed == 'false' && needs.relay-publish.result == 'skipped')) }}
    # macOS: ios-publish verifies the IPA's signature and profiles before it uploads.
    runs-on: xcode-27
    environment: testflight
    concurrency:
      group: talaria-testflight-publication
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        # TestFlight notes cover the App changes since the previous app-v tag.
        fetch-depth: 0
    - uses: ./.github/actions/setup-xcode
    - uses: ./.github/actions/release-python
    - name: Restore release-plan, app-build and ios-ipa
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan app-build ios-ipa'
    # The trusted main cutover, the receipt and the IPA's digest are checked before anything reaches Apple.
    - name: Authorize the verified build and write its TestFlight notes
      id: verified
      run: |
        set -euo pipefail
        "$RELEASE_PYTHON" releases/publish.py verify-app --plan "$RUNNER_TEMP/release-plan/plan.json" \
          --build "$RUNNER_TEMP/app-build/receipt.json" --directory "$RUNNER_TEMP/ios-ipa" \
          --notes "$RUNNER_TEMP/testflight-notes.txt"
        delimiter="notes-$(openssl rand -hex 16)"
        { echo "notes<<${delimiter}"; cat "$RUNNER_TEMP/testflight-notes.txt"; echo "${delimiter}"; } >> "$GITHUB_OUTPUT"
    # Uploading the same version and build number again is success, so a re-run resumes rather than uploads twice.
    - name: Upload or recover the verified TestFlight build
      id: upload
      uses: MaudeCode/.github/actions/ios-publish@eb704dbfc3862ea1143d5c7737d9f02bf97f49fa
      with:
        ipa: ${{ steps.verified.outputs.ipa }}
        bundle-id: dev.kil.talaria
        version: ${{ steps.verified.outputs.version }}
        build-number: ${{ steps.verified.outputs.build_number }}
        commit: ${{ steps.verified.outputs.commit }}
        upload: true
        whats-new: ${{ steps.verified.outputs.notes }}
        app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    - name: Record the uploaded build
      env:
        BUILD_ID: ${{ steps.upload.outputs.build-id }}
      run: |
        "$RELEASE_PYTHON" releases/publish.py app --plan "$RUNNER_TEMP/release-plan/plan.json" \
          --build "$RUNNER_TEMP/app-build/receipt.json" --directory "$RUNNER_TEMP/ios-ipa" \
          --output "$RUNNER_TEMP/app-publish/receipt.json" --build-id "$BUILD_ID"
    - name: Stage app-publish for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put app-publish "$RUNNER_TEMP/app-publish"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  publish-set:
    needs:
    - prepare
    - build-gate
    - relay-publish
    - bridge-publish
    - web-publish
    - app-publish
    if: ${{ !cancelled() && !inputs.dry_run && needs.build-gate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release-set-publication
    permissions:
      contents: write
      actions: read
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
    - uses: ./.github/actions/release-python
    - name: Require all selected publication readbacks
      env:
        RELEASE_NEEDS: ${{ toJSON(needs) }}
      run: python3 releases/check_results.py publication
    - name: Restore verified release handoffs
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP/release-results" --receipts'
    - name: Assemble and publish only the completed set
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        "$RELEASE_PYTHON" releases/collect.py "$RUNNER_TEMP/release-results" "$RUNNER_TEMP/receipts"
        options=()
        previous="$RUNNER_TEMP/release-results/release-plan/previous.json"
        if [[ -f "$previous" ]]; then options+=(--previous "$previous"); fi
        "$RELEASE_PYTHON" releases/cli.py assemble --complete --plan "$RUNNER_TEMP/release-results/release-plan/plan.json" \
          --receipts "$RUNNER_TEMP/receipts" --notes "$RUNNER_TEMP/release-results/release-plan/notes" \
          --output "$RUNNER_TEMP/completed/release-set.json" "${options[@]}"
        # finalize creates the release-set-<sha> tag its release attaches to, then publishes the manifest.
        "$RELEASE_PYTHON" releases/publish.py finalize --plan "$RUNNER_TEMP/release-results/release-plan/plan.json" \
          --manifest "$RUNNER_TEMP/completed/release-set.json" \
          --directory "$RUNNER_TEMP/release-results" "${options[@]}"
    - name: Record the completed manifest
      run: |
        set -euo pipefail
        {
          printf '### Release manifest\n\n```json\n'
          cat "$RUNNER_TEMP/completed/release-set.json"
          printf '\n```\n'
        } >> "$GITHUB_STEP_SUMMARY"
        cat "$RUNNER_TEMP/completed/release-set.json"
    - name: Retain release-set-complete
      uses: actions/upload-artifact@v7
      with:
        name: release-set-complete-${{ github.run_attempt }}
        path: ${{ runner.temp }}/completed
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
  tag:
    # Tags last (TAL-2342): only after publish-set published the completed set do the changed components get their
    # tags and GitHub releases, and then the root vX.Y.Z tag. Nothing else creates a version tag, so a release that
    # fails earlier leaves its version unused. Every step accepts what an earlier attempt already created.
    needs:
    - prepare
    - build-gate
    - publish-set
    if: ${{ !cancelled() && !inputs.dry_run && needs.publish-set.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release-set-publication
    permissions:
      contents: write
      actions: read
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
    - uses: ./.github/actions/release-python
    - name: Restore verified release handoffs
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP/release-results" --receipts'
    - name: Tag and release the components that shipped
      id: components
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        "$RELEASE_PYTHON" releases/publish.py tag-components --plan "$RUNNER_TEMP/release-results/release-plan/plan.json" \
          --directory "$RUNNER_TEMP/release-results"
    - name: Tag the release
      uses: MaudeCode/.github/actions/release-tag@08c2f55e411fda2d193638c89b3a923efdf66c0b
      with:
        tag: ${{ steps.components.outputs.release_tag }}
        sha: ${{ needs.prepare.outputs.source }}
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
  build-gate:
    needs:
    - prepare
    - contracts
    - component-contracts
    - agent-release
    - agent
    - app-hosted-tests
    - web-tests
    - relay-tests
    - relay-build
    - bridge-build
    - web-build
    - app-dry-build
    - app-signed-build
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source || github.sha }}
    - uses: ./.github/actions/release-python
    - name: Require every selected build and compatibility gate
      env:
        RELEASE_NEEDS: ${{ toJSON(needs) }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        options=()
        if [[ "$DRY_RUN" == true ]]; then options+=(--dry-run); fi
        python3 releases/check_results.py build "${options[@]}"
    - name: Forward verified producer references
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py forward'
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  timeline:
    # Measurement only (TAL-414): every job's queue, run and finish time from the run's start, in the step summary,
    # after the candidate or the release's tags. It reads the run's jobs and never gates anything.
    needs:
    - candidate
    - tag
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: releases
    - name: Record the run's job timeline
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 releases/timeline.py | tee -a "$GITHUB_STEP_SUMMARY"
