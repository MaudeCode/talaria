name: Release set
'on':
  workflow_call:
    inputs:
      request:
        description: JSON sourceRevision, tags and relayDeploymentId.
        required: true
        type: string
      previous_release_set:
        required: false
        default: ''
        type: string
      dry_run:
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      request:
        description: JSON sourceRevision, tags and relayDeploymentId.
        required: true
        type: string
      previous_release_set:
        description: Previous completed release-set SHA; empty only for bootstrap.
        required: false
        default: ''
        type: string
      dry_run:
        description: Direct dispatch supports dry runs only.
        required: true
        default: true
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: talaria-release-set
  cancel-in-progress: false
# Handoffs are this run's Actions artifacts: `artifacts.py put` stages and digests them, the next step uploads
# them, and `artifacts.py get` (job token, actions: read) downloads only forwarded producer outputs whose run,
# attempt, source and SHA-256 match. Every gate and build starts as soon as prepare has the plan; build-gate
# joins them all before anything publishes, and publication stays ordered Relay, Web, App, manifest.
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source: ${{ steps.plan.outputs.source }}
      app_changed: ${{ steps.plan.outputs.app_changed }}
      web_changed: ${{ steps.plan.outputs.web_changed }}
      relay_changed: ${{ steps.plan.outputs.relay_changed }}
      app_version: ${{ steps.plan.outputs.app_version }}
      artifacts: ${{ steps.store.outputs.artifacts }}
    steps:
    - name: Check publication authority
      env:
        DRY_RUN: ${{ inputs.dry_run }}
        CALLER: ${{ github.workflow_ref }}
      run: |
        set -euo pipefail
        if [[ "$DRY_RUN" != true ]]; then
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$CALLER" == MaudeCode/talaria/.github/workflows/production-cutover.yml@refs/heads/main ]]
        fi
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    # app/ci/validate_release_tag parses GitHub tag metadata with Ruby.
    - uses: ./.github/actions/release-ruby
    - name: Resolve and validate immutable release plan
      id: plan
      env:
        GH_TOKEN: ${{ github.token }}
        REQUEST: ${{ inputs.request }}
        PREVIOUS: ${{ inputs.previous_release_set }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        git fetch --no-tags origin main:refs/remotes/origin/main
        printf '%s' "$REQUEST" > "$RUNNER_TEMP/request.json"
        options=()
        if [[ -n "$PREVIOUS" ]]; then
          "$RELEASE_PYTHON" releases/cli.py previous "$PREVIOUS" --output "$RUNNER_TEMP/previous.json"
          options+=(--previous "$RUNNER_TEMP/previous.json")
        fi
        if [[ "$DRY_RUN" == true ]]; then options+=(--dry-run); fi
        "$RELEASE_PYTHON" releases/cli.py prepare --request "$RUNNER_TEMP/request.json" --output "$RUNNER_TEMP/release-plan" "${options[@]}"
    - name: Stage release-plan for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put release-plan "$RUNNER_TEMP/release-plan"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
  ui-suite-lookup:
    # A release that ships the App reuses a completed, successful, unscoped ui-suite.yml run (the nightly schedule or
    # a dispatch) on exactly the release source instead of running the suite again (TAL-408). Read-only; a lookup
    # error fails this job, which skips the suite call and fails build-gate: it never counts as "no run found".
    needs: prepare
    if: needs.prepare.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.lookup.outputs.reused }}
      run_url: ${{ steps.lookup.outputs.run_url }}
    steps:
    - uses: actions/checkout@v7
      with:
        sparse-checkout: app/ci
    - name: Find a successful UI suite run on the release source
      id: lookup
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE: ${{ needs.prepare.outputs.source }}
      run: |
        set -euo pipefail
        url=$(app/ci/find-ui-suite-run "$SOURCE")
        if [[ -n "$url" ]]; then
          printf 'reused=true\nrun_url=%s\n' "$url" >> "$GITHUB_OUTPUT"
          printf '### UI suite\n\nReused the successful run on %s: %s\n' "$SOURCE" "$url" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          echo "reused=false" >> "$GITHUB_OUTPUT"
          printf '### UI suite\n\nNo successful UI suite run on %s; running the suite.\n' "$SOURCE" | tee -a "$GITHUB_STEP_SUMMARY"
        fi
  ui-suite:
    # The full unit and UI suite (TAL-380's ui-suite.yml: a build, four macOS test shards and the package tests) on
    # the release source, beside every other gate, unless ui-suite-lookup found one to reuse; build-gate, and so every
    # publication, requires one or the other when the App ships.
    needs:
    - prepare
    - ui-suite-lookup
    if: needs.prepare.outputs.app_changed == 'true' && needs.ui-suite-lookup.outputs.reused == 'false'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ui-suite.yml
    with:
      ref: ${{ needs.prepare.outputs.source }}
  contracts:
    # macOS: tests the selected App against every supported Web source: TalariaKit's contract classes with `swift test`
    # and no simulator, building the package tests while each Web is probed (TAL-408); an App revision from before
    # TAL-399 runs them in the iOS simulator.
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/setup-xcode
    - uses: ./.github/actions/release-python
    - uses: ./.github/actions/release-node
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - name: Select the image's iPhone 17
      run: |
        set -euo pipefail
        app=$(jq -er .components.app.sourceRevision "$RUNNER_TEMP/release-plan/plan.json")
        if git cat-file -e "${app}:app/TalariaKit/Package.swift" 2>/dev/null; then
          echo "The App at ${app} tests its contract classes with swift test; no simulator."
          exit 0
        fi
        # The App's own scripts/test-ios leases, boots and shuts down exactly this simulator (IOS_SIMULATOR_ID; it
        # never erases a named device), so no pool is set up. The runtime matches the selected Xcode's SDK, as in CI.
        sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
        runtime="com.apple.CoreSimulator.SimRuntime.iOS-${sdk_version//./-}"
        udid=$(xcrun simctl list devices available --json |
          jq -er --arg runtime "$runtime" 'first(.devices[$runtime][]? | select(.name == "iPhone 17") | .udid)')
        echo "Using iPhone 17 ${udid} on ${runtime}"
        printf 'IOS_SIMULATOR_ID=%s\nIOS_SIMULATOR_RUNTIME=%s\n' "$udid" "$runtime" >> "$GITHUB_ENV"
    - name: Verify the selected App against the Web sources
      env:
        TALARIA_TEST_WORKER_COUNT: '1'
      run: |
        "$RELEASE_PYTHON" releases/cli.py gate --plan "$RUNNER_TEMP/release-plan/plan.json" --name currentContracts --output "$RUNNER_TEMP/contract-receipts/currentContracts.json" -- \
          "$RELEASE_PYTHON" scripts/check-release-contracts.py --only app --plan "$RUNNER_TEMP/release-plan/plan.json" --output "$RUNNER_TEMP/current-contracts"
    - name: Stage contract-receipts for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put contract-receipts "$RUNNER_TEMP/contract-receipts"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    - name: Retain sanitized App contract diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: release-contract-diagnostics-${{ github.run_attempt }}
        path: ${{ runner.temp }}/current-contracts
        retention-days: 30
        if-no-files-found: ignore
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  previous-app-contracts:
    # macOS: compiles the previously released App from Git and tests it against the selected Web. It runs beside
    # `contracts` on its own runner rather than sharing one runner's cores and simulators. It needs only the plan, so
    # it claims a macOS runner before the UI suite's jobs queue (TAL-408): a previous App from before TAL-399 runs its
    # classes in the simulator and is the longest gate. A previous App with TalariaKit uses `swift test` instead.
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/setup-xcode
    - uses: ./.github/actions/release-python
    - uses: ./.github/actions/release-node
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - name: Select the image's iPhone 17
      run: |
        set -euo pipefail
        app=$(jq -er .previousAppSource "$RUNNER_TEMP/release-plan/plan.json")
        if git cat-file -e "${app}:app/TalariaKit/Package.swift" 2>/dev/null; then
          echo "The App at ${app} tests its contract classes with swift test; no simulator."
          exit 0
        fi
        # The App's own scripts/test-ios leases, boots and shuts down exactly this simulator (IOS_SIMULATOR_ID; it
        # never erases a named device), so no pool is set up. The runtime matches the selected Xcode's SDK, as in CI.
        sdk_version=$(xcrun --sdk iphonesimulator --show-sdk-version)
        runtime="com.apple.CoreSimulator.SimRuntime.iOS-${sdk_version//./-}"
        udid=$(xcrun simctl list devices available --json |
          jq -er --arg runtime "$runtime" 'first(.devices[$runtime][]? | select(.name == "iPhone 17") | .udid)')
        echo "Using iPhone 17 ${udid} on ${runtime}"
        printf 'IOS_SIMULATOR_ID=%s\nIOS_SIMULATOR_RUNTIME=%s\n' "$udid" "$runtime" >> "$GITHUB_ENV"
    - name: Verify the previously released App against the selected Web
      env:
        TALARIA_TEST_WORKER_COUNT: '1'
      run: |
        set -euo pipefail
        plan="$RUNNER_TEMP/release-plan/plan.json"
        previous=$(jq -er .previousAppSource "$plan")
        web=$(jq -er .components.web.sourceRevision "$plan")
        "$RELEASE_PYTHON" releases/cli.py gate --plan "$plan" --name previousAppContracts --output "$RUNNER_TEMP/previous-app-receipts/previousAppContracts.json" -- \
          "$RELEASE_PYTHON" scripts/check-previous-app.py --app-ref "$previous" --web-ref "$web" --output "$RUNNER_TEMP/previous-app"
    - name: Stage previous-app-receipts for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put previous-app-receipts "$RUNNER_TEMP/previous-app-receipts"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    - name: Retain sanitized previous App diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: previous-app-contract-diagnostics-${{ github.run_attempt }}
        path: ${{ runner.temp }}/previous-app
        retention-days: 30
        if-no-files-found: ignore
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  component-contracts:
    # The Web contracts package suite and Relay publisher fixtures at their selected refs.
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - uses: ./.github/actions/release-node
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - name: Verify selected Web and Relay fixture contracts
      run: '"$RELEASE_PYTHON" scripts/check-release-contracts.py --only fixtures --plan "$RUNNER_TEMP/release-plan/plan.json" --output "$RUNNER_TEMP/component-contracts"'
    - name: Retain component contract diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: component-contract-diagnostics-${{ github.run_attempt }}
        path: ${{ runner.temp }}/component-contracts
        retention-days: 30
        if-no-files-found: ignore
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
  agent:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - name: Install uv (the Agent's locked dependency resolver)
      run: python3 -m pip install --disable-pip-version-check "uv==0.11.3"
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - name: Verify recorded Web and Agent identity
      run: |
        "$RELEASE_PYTHON" releases/cli.py gate --plan "$RUNNER_TEMP/release-plan/plan.json" --name agentCompatibility --output "$RUNNER_TEMP/agent-receipts/agentCompatibility.json" -- \
          "$RELEASE_PYTHON" scripts/check-release-agent.py --plan "$RUNNER_TEMP/release-plan/plan.json"
    - name: Stage agent-receipts for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put agent-receipts "$RUNNER_TEMP/agent-receipts"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  relay-build:
    # Builds consume only the release plan, so they run alongside the gates and each other; build-gate
    # joins every gate and build before anything publishes (TAL-319).
    needs: prepare
    if: needs.prepare.outputs.relay_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - uses: ./.github/actions/release-node
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - run: '"$RELEASE_PYTHON" releases/build.py relay --plan "$RUNNER_TEMP/release-plan/plan.json" --output "$RUNNER_TEMP/relay-build"'
    - name: Stage relay-build for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put relay-build "$RUNNER_TEMP/relay-build"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  web-build:
    # Builds consume only the release plan, so they run alongside the gates and each other; build-gate
    # joins every gate and build before anything publishes (TAL-319).
    needs: prepare
    if: needs.prepare.outputs.web_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - name: Set up Node for the npm package build
      uses: actions/setup-node@v7
      with:
        node-version-file: web/.nvmrc
        cache: npm
        cache-dependency-path: web/package-lock.json
    - uses: ./.github/actions/docker-plugins
      with:
        multi-platform: "true"
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - name: Read the Actions cache service identity for Buildx
      # A run step cannot see the runtime token BuildKit's gha cache needs; hand it, masked, to the build step only.
      id: cache-service
      uses: actions/github-script@v9
      with:
        script: |
          core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
          core.setOutput('token', process.env.ACTIONS_RUNTIME_TOKEN);
          core.setOutput('url', process.env.ACTIONS_RESULTS_URL);
    - name: Build the npm packages and the multi-platform image
      env:
        # Web image layers come from and go to the GitHub Actions cache; docker-plugins made a container builder.
        TALARIA_DOCKER_CACHE: type=gha,scope=talaria-web-release,version=2
        ACTIONS_RUNTIME_TOKEN: ${{ steps.cache-service.outputs.token }}
        ACTIONS_RESULTS_URL: ${{ steps.cache-service.outputs.url }}
        ACTIONS_CACHE_SERVICE_V2: 'true'
      run: '"$RELEASE_PYTHON" releases/build.py web --plan "$RUNNER_TEMP/release-plan/plan.json" --output "$RUNNER_TEMP/web-build"'
    - name: Separate the large OCI archive from the receipt and npm handoff
      run: |
        set -euo pipefail
        mkdir "$RUNNER_TEMP/web-image"
        mv "$RUNNER_TEMP/web-build/web.oci.tar" "$RUNNER_TEMP/web-image/"
    # Two artifacts: receipt assembly and npm publication download web-build without the OCI archive.
    - name: Stage web-build for other jobs
      id: store-build
      run: '"$RELEASE_PYTHON" releases/artifacts.py put web-build "$RUNNER_TEMP/web-build"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store-build.outputs.handoff_name }}
        path: ${{ steps.store-build.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    - name: Stage web-image for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put web-image "$RUNNER_TEMP/web-image"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  app-dry-build:
    # macOS: unsigned xcodebuild archive. Builds consume only the release plan, so they run alongside the gates
    # and each other; build-gate joins every gate and build before anything publishes (TAL-319).
    needs: prepare
    if: inputs.dry_run && needs.prepare.outputs.app_changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/setup-xcode
    - uses: ./.github/actions/release-python
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - run: '"$RELEASE_PYTHON" releases/build.py app --plan "$RUNNER_TEMP/release-plan/plan.json" --output "$RUNNER_TEMP/app-build"'
    - name: Stage app-build receipt for other jobs
      id: store
      run: |
        set -euo pipefail
        mkdir "$RUNNER_TEMP/app-build-receipt"
        cp "$RUNNER_TEMP"/app-build/*.json "$RUNNER_TEMP/app-build-receipt/"
        "$RELEASE_PYTHON" releases/artifacts.py put app-build "$RUNNER_TEMP/app-build-receipt"
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  candidate:
    needs:
    - prepare
    - build-gate
    if: ${{ !cancelled() && inputs.dry_run && needs.build-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
    - uses: ./.github/actions/release-python
    - name: Restore verified release handoffs
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP/release-results" --receipts'
    - name: Assemble candidate from successful job outputs
      run: |
        set -euo pipefail
        "$RELEASE_PYTHON" releases/collect.py "$RUNNER_TEMP/release-results" "$RUNNER_TEMP/receipts"
        options=()
        previous="$RUNNER_TEMP/release-results/release-plan/previous.json"
        if [[ -f "$previous" ]]; then options+=(--previous "$previous"); fi
        "$RELEASE_PYTHON" releases/cli.py assemble --plan "$RUNNER_TEMP/release-results/release-plan/plan.json" \
          --receipts "$RUNNER_TEMP/receipts" --notes "$RUNNER_TEMP/release-results/release-plan/notes" \
          --output "$RUNNER_TEMP/candidate/release-set.json" "${options[@]}"
    - name: Record the candidate manifest
      run: |
        set -euo pipefail
        {
          printf '### Release manifest\n\n```json\n'
          cat "$RUNNER_TEMP/candidate/release-set.json"
          printf '\n```\n'
        } >> "$GITHUB_STEP_SUMMARY"
        cat "$RUNNER_TEMP/candidate/release-set.json"
    - name: Retain release-set-candidate
      uses: actions/upload-artifact@v7
      with:
        name: release-set-candidate-${{ github.run_attempt }}
        path: ${{ runner.temp }}/candidate
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
  app-signed-build:
    # Builds consume only the release plan, so they run alongside the gates and each other; build-gate
    # joins every gate and build before anything publishes (TAL-319).
    needs: prepare
    if: ${{ !inputs.dry_run && needs.prepare.outputs.app_changed == 'true' }}
    uses: ./.github/workflows/ios-release-build.yml
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.source }}
      version: ${{ needs.prepare.outputs.app_version }}
      artifacts: ${{ needs.prepare.outputs.artifacts }}
  relay-publish:
    needs:
    - prepare
    - build-gate
    if: ${{ !cancelled() && !inputs.dry_run && needs.prepare.outputs.relay_changed == 'true' && needs.build-gate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: relay-production
    concurrency:
      group: talaria-relay-production
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - uses: ./.github/actions/release-node
    - name: Restore release-plan
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'
    - name: Deploy the existing Relay and verify readiness/provenance
      env:
        CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        CONVEX_DISABLE_TELEMETRY: '1'
      run: |
        set -euo pipefail
        # The reviewed workflow owns publication code; component tags stay immutable.
        git show "${GITHUB_WORKFLOW_SHA}:releases/publish.py" > "$RUNNER_TEMP/publish.py"
        PYTHONPATH="$PWD/releases" "$RELEASE_PYTHON" "$RUNNER_TEMP/publish.py" relay \
          --plan "$RUNNER_TEMP/release-plan/plan.json" --output "$RUNNER_TEMP/relay-publish/receipt.json"
    - name: Stage relay-publish for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put relay-publish "$RUNNER_TEMP/relay-publish"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  web-publish:
    # npm first (trusted publishing needs this GitHub-hosted job's OIDC token), then GHCR once npm's readback
    # matches the built tarballs. A retry accepts npm versions already published with identical bytes.
    needs:
    - prepare
    - build-gate
    - relay-publish
    if: ${{ !cancelled() && !inputs.dry_run && needs.prepare.outputs.web_changed == 'true' && needs.build-gate.result == 'success' && (needs.relay-publish.result
      == 'success' || (needs.prepare.outputs.relay_changed == 'false' && needs.relay-publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: web-release
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: write
    concurrency:
      group: talaria-web-publication
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
        fetch-depth: 0
    - uses: ./.github/actions/release-python
    - name: Restore release-plan, web-build and web-image
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        "$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan web-build web-image
        mv "$RUNNER_TEMP/web-image/web.oci.tar" "$RUNNER_TEMP/web-build/"
    - name: Set up Node for npm trusted publishing
      uses: actions/setup-node@v7
      with:
        node-version-file: web/.nvmrc
        registry-url: https://registry.npmjs.org
    - name: Require an npm CLI with trusted-publishing support and skopeo
      run: |
        set -euo pipefail
        npm install --global npm@latest
        if ! command -v skopeo >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
        fi
        skopeo --version
    - name: Publish the built npm packages and verify the readback
      run: |
        set -euo pipefail
        # The reviewed workflow owns publication code; component tags stay immutable.
        git show "${GITHUB_WORKFLOW_SHA}:releases/publish.py" > "$RUNNER_TEMP/publish.py"
        PYTHONPATH="$PWD/releases" "$RELEASE_PYTHON" "$RUNNER_TEMP/publish.py" web-npm --plan "$RUNNER_TEMP/release-plan/plan.json" \
          --build "$RUNNER_TEMP/web-build/receipt.json" --directory "$RUNNER_TEMP/web-build"
    - name: Confirm the npm readback, publish the OCI bytes and verify their readback
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        PYTHONPATH="$PWD/releases" "$RELEASE_PYTHON" "$RUNNER_TEMP/publish.py" web --plan "$RUNNER_TEMP/release-plan/plan.json" \
          --build "$RUNNER_TEMP/web-build/receipt.json" --directory "$RUNNER_TEMP/web-build" \
          --output "$RUNNER_TEMP/web-publish/receipt.json"
    - name: Stage web-publish for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put web-publish "$RUNNER_TEMP/web-publish"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  app-publish:
    name: Publish iOS app
    needs:
    - prepare
    - build-gate
    - relay-publish
    - web-publish
    if: ${{ !cancelled() && !inputs.dry_run && needs.prepare.outputs.app_changed == 'true' && needs.build-gate.result == 'success' && (needs.relay-publish.result
      == 'success' || (needs.prepare.outputs.relay_changed == 'false' && needs.relay-publish.result == 'skipped')) && (needs.web-publish.result
      == 'success' || (needs.prepare.outputs.web_changed == 'false' && needs.web-publish.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: testflight
    concurrency:
      group: talaria-testflight-publication
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
    - uses: ./.github/actions/release-python
    - uses: ./.github/actions/release-ruby
    - name: Restore release-plan, app-build and ios-ipa
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan app-build ios-ipa'
    - name: Upload or recover the verified TestFlight build
      env:
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      run: |
        "$RELEASE_PYTHON" releases/publish.py app --plan "$RUNNER_TEMP/release-plan/plan.json" \
          --build "$RUNNER_TEMP/app-build/receipt.json" --directory "$RUNNER_TEMP/ios-ipa" \
          --output "$RUNNER_TEMP/app-publish/receipt.json"
    - name: Stage app-publish for other jobs
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py put app-publish "$RUNNER_TEMP/app-publish"'
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.store.outputs.handoff_name }}
        path: ${{ steps.store.outputs.handoff_path }}
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
  publish-set:
    needs:
    - prepare
    - build-gate
    - relay-publish
    - web-publish
    - app-publish
    if: ${{ !cancelled() && !inputs.dry_run && needs.build-gate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release-set-publication
    permissions:
      contents: write
      actions: read
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source }}
    - uses: ./.github/actions/release-python
    - name: Require all selected publication readbacks
      env:
        RELEASE_NEEDS: ${{ toJSON(needs) }}
      run: python3 releases/check_results.py publication
    - name: Restore verified release handoffs
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP/release-results" --receipts'
    - name: Assemble and publish only the completed set
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        "$RELEASE_PYTHON" releases/collect.py "$RUNNER_TEMP/release-results" "$RUNNER_TEMP/receipts"
        options=()
        previous="$RUNNER_TEMP/release-results/release-plan/previous.json"
        if [[ -f "$previous" ]]; then options+=(--previous "$previous"); fi
        "$RELEASE_PYTHON" releases/cli.py assemble --complete --plan "$RUNNER_TEMP/release-results/release-plan/plan.json" \
          --receipts "$RUNNER_TEMP/receipts" --notes "$RUNNER_TEMP/release-results/release-plan/notes" \
          --output "$RUNNER_TEMP/completed/release-set.json" "${options[@]}"
        # Releases attach to existing tags; GitHub refuses GITHUB_TOKEN a workflow-changing target_commitish (TAL-340).
        source=$(jq -r .releaseSet "$RUNNER_TEMP/release-results/release-plan/plan.json")
        git ls-remote --exit-code origin "refs/tags/release-set-${source}" >/dev/null || git push origin "${source}:refs/tags/release-set-${source}"
        "$RELEASE_PYTHON" releases/publish.py finalize --plan "$RUNNER_TEMP/release-results/release-plan/plan.json" \
          --manifest "$RUNNER_TEMP/completed/release-set.json" \
          --directory "$RUNNER_TEMP/release-results" "${options[@]}"
    - name: Record the completed manifest
      run: |
        set -euo pipefail
        {
          printf '### Release manifest\n\n```json\n'
          cat "$RUNNER_TEMP/completed/release-set.json"
          printf '\n```\n'
        } >> "$GITHUB_STEP_SUMMARY"
        cat "$RUNNER_TEMP/completed/release-set.json"
    - name: Retain release-set-complete
      uses: actions/upload-artifact@v7
      with:
        name: release-set-complete-${{ github.run_attempt }}
        path: ${{ runner.temp }}/completed
        retention-days: 30
        if-no-files-found: error
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
  build-gate:
    needs:
    - prepare
    - contracts
    - previous-app-contracts
    - component-contracts
    - agent
    - ui-suite-lookup
    - ui-suite
    - relay-build
    - web-build
    - app-dry-build
    - app-signed-build
    if: always()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare.outputs.source || github.sha }}
    - uses: ./.github/actions/release-python
    - name: Require every selected build and compatibility gate
      env:
        RELEASE_NEEDS: ${{ toJSON(needs) }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail
        options=()
        if [[ "$DRY_RUN" == true ]]; then options+=(--dry-run); fi
        python3 releases/check_results.py build "${options[@]}"
    - name: Forward verified producer references
      id: store
      run: '"$RELEASE_PYTHON" releases/artifacts.py forward'
    env:
      RELEASE_NEEDS: ${{ toJSON(needs) }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}
