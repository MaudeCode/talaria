name: Public Hermes WebUI watch

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-hermes-webui-watch
  cancel-in-progress: false

jobs:
  report:
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Report changes from public upstream
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/nesquena/hermes-webui.git \
            +refs/heads/master:refs/remotes/hermes-upstream/master
          base=$(git merge-base HEAD refs/remotes/hermes-upstream/master)
          mkdir -p .codex-tmp
          {
            echo "Shared upstream ancestor: $base"
            echo "Public head: $(git rev-parse refs/remotes/hermes-upstream/master)"
            git log --oneline "$base..refs/remotes/hermes-upstream/master"
            git diff --stat "$base..refs/remotes/hermes-upstream/master"
          } > .codex-tmp/upstream-watch-report.txt
          cat .codex-tmp/upstream-watch-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: public-upstream-watch
          path: .codex-tmp/upstream-watch-report.txt
          if-no-files-found: error
