# Weekly drift report for Talaria's configured Hermes WebUI fork.
name: Upstream Hermes-WebUI Watch

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Fork tag or commit to compare with UPSTREAM_TESTED_SHA."
        required: false
        type: string

run-name: "Upstream watch from ${{ github.ref_name }}"

permissions:
  contents: read

concurrency:
  group: upstream-webui-watch
  cancel-in-progress: false

jobs:
  report:
    name: Generate Digest
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 15

    steps:
      - name: Check out Talaria
        uses: actions/checkout@v7

      - name: Clone configured fork
        env:
          INPUT_TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail
          repository="$(tr -d '[:space:]' < UPSTREAM_REPOSITORY)"
          branch="$(tr -d '[:space:]' < UPSTREAM_BRANCH)"
          url="https://github.com/${repository}.git"
          default_branch="$(git ls-remote --symref "${url}" HEAD | sed -n 's#^ref: refs/heads/\([^[:space:]]*\)[[:space:]]*HEAD$#\1#p')"
          test "${default_branch}" = "${branch}"
          mkdir -p .codex-tmp
          git clone --filter=blob:none --branch "${branch}" "${url}" .codex-tmp/hermes-webui
          target_ref="${INPUT_TARGET_REF:-origin/${branch}}"
          if [[ -n "${INPUT_TARGET_REF}" ]]; then
            git -C .codex-tmp/hermes-webui fetch origin "${INPUT_TARGET_REF}"
            target_ref="FETCH_HEAD"
          fi
          echo "TARGET_REF=${target_ref}" >> "${GITHUB_ENV}"

      - name: Generate upstream watch report
        run: |
          set -euo pipefail
          scripts/upstream-watch \
            --target-ref "${TARGET_REF}" \
            --route-limit 80 \
            --file-limit 80 \
            --commit-limit 60 \
            > upstream-watch-report.md \
            2> upstream-watch-errors.log
          cat upstream-watch-report.md
          cat upstream-watch-errors.log >&2

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-watch-report
          path: |
            upstream-watch-report.md
            upstream-watch-errors.log
          if-no-files-found: warn
