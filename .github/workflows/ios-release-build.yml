name: iOS Release Build

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      artifacts:
        required: true
        type: string
      # `production` builds the cutover's release plan; `nightly` (TAL-1569) builds the nightly source and uploads it here.
      channel:
        required: false
        default: production
        type: string
    outputs:
      artifacts:
        value: ${{ jobs.build.outputs.artifacts }}
  # A signing check of any commit: builds, signs and verifies the IPA with the shared iOS actions, with no environment,
  # no release plan, no handoffs and no upload. Publication still only happens on the channels above.
  workflow_dispatch:
    inputs:
      ref:
        description: Full SHA of the commit to build.
        required: true
        type: string
      version:
        description: Marketing version to build, such as 1.2.3.
        required: true
        type: string

permissions:
  contents: read
  actions: read # download this run's release-plan artifact

defaults:
  run:
    working-directory: app

jobs:
  build:
    name: Build signed iOS release
    if: >-
      github.ref == 'refs/heads/main' && (
      inputs.channel == 'production' && github.workflow_ref == 'MaudeCode/talaria/.github/workflows/production-cutover.yml@refs/heads/main' ||
      inputs.channel == 'nightly' && github.workflow_ref == 'MaudeCode/talaria/.github/workflows/nightly.yml@refs/heads/main') ||
      !inputs.channel && startsWith(github.workflow_ref, 'MaudeCode/talaria/.github/workflows/ios-release-build.yml@')
    runs-on: xcode-27
    # The deployment gate for both release channels; a signing check publishes nothing and needs none.
    environment: ${{ inputs.channel && 'testflight' || '' }}
    # Production and Nightly (TAL-1569) can build the same App train: selecting a build number and uploading
    # it must not interleave, so both join the TestFlight publication queue.
    concurrency:
      group: talaria-testflight-publication
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      PROJECT_PATH: Talaria.xcodeproj
      SCHEME: Talaria
      RELEASE_ARTIFACTS: ${{ inputs.artifacts }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-xcode

      - uses: ./.github/actions/release-python

      - name: Restore verified release plan
        if: inputs.channel == 'production'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'

      - name: Verify production build authority
        if: inputs.channel == 'production'
        working-directory: .
        run: |
          "$RELEASE_PYTHON" -c 'import sys; sys.path.insert(0,"releases"); from cli import load; from publish import authorize; import os; authorize(load(os.environ["RUNNER_TEMP"]+"/release-plan/plan.json"))'

      - name: Check required secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY \
            IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}" >&2
              missing=1
            fi
          done
          exit "${missing}"

      - name: Set output paths
        run: |
          {
            echo "ARCHIVE_PATH=${RUNNER_TEMP}/Talaria.xcarchive"
            echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/TalariaDerivedData"
          } >> "${GITHUB_ENV}"

      # Inputs reach the script through the environment, never interpolated into it: a dispatch supplies them.
      - name: Resolve release metadata
        env:
          VERSION_INPUT: ${{ inputs.version }}
          REF_INPUT: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          marketing_version="${VERSION_INPUT}"
          if [[ ! "${marketing_version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release version must use X.Y.Z numeric semantic versioning: ${marketing_version}" >&2
            exit 1
          fi
          if [[ ! "${REF_INPUT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The commit to build must be a full SHA: ${REF_INPUT}" >&2
            exit 1
          fi
          echo "MARKETING_VERSION=${marketing_version}" >> "${GITHUB_ENV}"
          echo "Building version ${marketing_version} from ${REF_INPUT}."

      # Nightly checked for a cutover before it started; one dispatched since may hold a selected, unuploaded number.
      - name: Defer Nightly to a running cutover
        if: inputs.channel == 'nightly'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RELEASE_PYTHON" releases/nightly.py require-no-cutover'

      # A re-run for the same version and commit gets the number it already uploaded. Nightly and production stamp
      # different identities into one commit's app, so Nightly's uploads are a variant of their own.
      - name: Select App Store Connect build number
        id: number
        uses: MaudeCode/.github/actions/ios-build-number@eb704dbfc3862ea1143d5c7737d9f02bf97f49fa
        with:
          bundle-id: dev.kil.talaria
          version: ${{ env.MARKETING_VERSION }}
          commit: ${{ inputs.ref }}
          variant: ${{ inputs.channel == 'nightly' && 'nightly' || '' }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Stamp the selected release identity
        working-directory: .
        env:
          RELEASE_SOURCE: ${{ inputs.ref }}
          BUILD_NUMBER: ${{ steps.number.outputs.build-number }}
        run: |
          "$RELEASE_PYTHON" scripts/stamp-release.py app --version "$MARKETING_VERSION" --build-number "$BUILD_NUMBER" --source-revision "$RELEASE_SOURCE"

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -disableAutomaticPackageResolution

      - name: Set up signing
        id: signing
        uses: MaudeCode/.github/actions/ios-signing@eb704dbfc3862ea1143d5c7737d9f02bf97f49fa
        with:
          certificate-p12-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          certificate-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          bundle-ids: dev.kil.talaria, dev.kil.talaria.shareextension, dev.kil.talaria.liveactivitywidget

      - name: Archive
        env:
          TEAM_ID: ${{ steps.signing.outputs.team-id }}
          TALARIA_APP_PROVISIONING_PROFILE_SPECIFIER: ${{ fromJSON(steps.signing.outputs.profiles)['dev.kil.talaria'] }}
          TALARIA_SHARE_PROVISIONING_PROFILE_SPECIFIER: ${{ fromJSON(steps.signing.outputs.profiles)['dev.kil.talaria.shareextension'] }}
          TALARIA_LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER: ${{ fromJSON(steps.signing.outputs.profiles)['dev.kil.talaria.liveactivitywidget'] }}
          BUILD_NUMBER: ${{ steps.number.outputs.build-number }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -disableAutomaticPackageResolution \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            TALARIA_APP_PROVISIONING_PROFILE_SPECIFIER="${TALARIA_APP_PROVISIONING_PROFILE_SPECIFIER}" \
            TALARIA_SHARE_PROVISIONING_PROFILE_SPECIFIER="${TALARIA_SHARE_PROVISIONING_PROFILE_SPECIFIER}" \
            TALARIA_LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER="${TALARIA_LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER}" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}"

      - name: Verify archive versions
        env:
          BUILD_NUMBER: ${{ steps.number.outputs.build-number }}
        run: ci/verify_bundle_versions "${ARCHIVE_PATH}/Products/Applications/Talaria.app" "${MARKETING_VERSION}" "${BUILD_NUMBER}"

      # Exports and verifies the signed IPA (identifiers, versions, embedded App Store profiles, signature). It never
      # uploads here: production uploads after the cutover's gates, Nightly after its identity check below.
      - name: Export and verify the signed IPA
        id: export
        uses: MaudeCode/.github/actions/ios-publish@eb704dbfc3862ea1143d5c7737d9f02bf97f49fa
        with:
          archive: ${{ env.ARCHIVE_PATH }}
          export-options: ${{ steps.signing.outputs.export-options }}
          bundle-id: dev.kil.talaria
          version: ${{ env.MARKETING_VERSION }}
          build-number: ${{ steps.number.outputs.build-number }}

      - name: Verify the Nightly identity and write its TestFlight notes
        if: inputs.channel == 'nightly'
        id: nightly
        working-directory: .
        env:
          RELEASE_SOURCE: ${{ inputs.ref }}
          IPA: ${{ steps.export.outputs.ipa }}
          BUILD_NUMBER: ${{ steps.number.outputs.build-number }}
        run: |
          set -euo pipefail
          "$RELEASE_PYTHON" releases/nightly.py verify --ipa "$IPA" --version "$MARKETING_VERSION" \
            --build-number "$BUILD_NUMBER" --source "$RELEASE_SOURCE" --notes "$RUNNER_TEMP/testflight-notes.txt"
          delimiter="notes-$(openssl rand -hex 16)"
          { echo "notes<<${delimiter}"; cat "$RUNNER_TEMP/testflight-notes.txt"; echo "${delimiter}"; } >> "$GITHUB_OUTPUT"

      - name: Upload the Nightly build to TestFlight
        if: inputs.channel == 'nightly'
        uses: MaudeCode/.github/actions/ios-publish@eb704dbfc3862ea1143d5c7737d9f02bf97f49fa
        with:
          ipa: ${{ steps.export.outputs.ipa }}
          bundle-id: dev.kil.talaria
          version: ${{ env.MARKETING_VERSION }}
          build-number: ${{ steps.number.outputs.build-number }}
          commit: ${{ steps.number.outputs.commit }}
          variant: nightly
          upload: true
          whats-new: ${{ steps.nightly.outputs.notes }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Record the verified signed build
        if: inputs.channel == 'production'
        working-directory: .
        env:
          IPA: ${{ steps.export.outputs.ipa }}
          BUILD_NUMBER: ${{ steps.number.outputs.build-number }}
        run: |
          "$RELEASE_PYTHON" releases/publish.py build-app-receipt --plan "$RUNNER_TEMP/release-plan/plan.json" \
            --directory "$(dirname "$IPA")" --build-number "$BUILD_NUMBER" --output "$RUNNER_TEMP/app-build/receipt.json"

      # Three artifacts, so publication downloads the IPA without the dSYMs and receipt assembly neither.
      - name: Stage the verified build receipt
        if: inputs.channel == 'production'
        id: store-receipt
        working-directory: .
        run: '"$RELEASE_PYTHON" releases/artifacts.py put app-build "$RUNNER_TEMP/app-build"'

      - if: inputs.channel == 'production'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.store-receipt.outputs.handoff_name }}
          path: ${{ steps.store-receipt.outputs.handoff_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Stage the verified signed IPA
        if: inputs.channel
        id: store-ipa
        working-directory: .
        env:
          IPA: ${{ steps.export.outputs.ipa }}
        run: '"$RELEASE_PYTHON" releases/artifacts.py put ios-ipa "$(dirname "$IPA")"'

      - if: inputs.channel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.store-ipa.outputs.handoff_name }}
          path: ${{ steps.store-ipa.outputs.handoff_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Stage the dSYMs
        if: inputs.channel
        id: store
        working-directory: .
        run: '"$RELEASE_PYTHON" releases/artifacts.py put ios-dsyms "$ARCHIVE_PATH/dSYMs"'

      - if: inputs.channel
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.store.outputs.handoff_name }}
          path: ${{ steps.store.outputs.handoff_path }}
          retention-days: 30
          if-no-files-found: error
