name: iOS Release Build

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      artifacts:
        required: true
        type: string
    outputs:
      artifacts:
        value: ${{ jobs.build.outputs.artifacts }}

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  build:
    name: Build signed iOS release
    if: github.ref == 'refs/heads/main' && github.workflow_ref == 'MaudeCode/talaria/.github/workflows/production-cutover.yml@refs/heads/main'
    runs-on: maude-mac
    environment: testflight
    timeout-minutes: 60
    env:
      PROJECT_PATH: Talaria.xcodeproj
      SCHEME: Talaria
      TEAM_ID: Q28NF3NH3D
      RELEASE_ARTIFACTS: ${{ inputs.artifacts }}
    outputs:
      artifacts: ${{ steps.store.outputs.artifacts }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/release-python

      - name: Restore verified release plan
        working-directory: .
        run: '"$RELEASE_PYTHON" releases/artifacts.py get "$RUNNER_TEMP" release-plan'

      - name: Verify production build authority
        working-directory: .
        run: |
          "$RELEASE_PYTHON" -c 'import sys; sys.path.insert(0,"releases"); from cli import load; from publish import authorize; import os; authorize(load(os.environ["RUNNER_TEMP"]+"/release-plan/plan.json"))'

      - name: Check required secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_PRIVATE_KEY \
            IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}" >&2
              missing=1
            fi
          done
          exit "${missing}"

      - name: Set output paths
        run: |
          {
            echo "ARCHIVE_PATH=${RUNNER_TEMP}/Talaria.xcarchive"
            echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/TalariaDerivedData"
            echo "EXPORT_PATH=${RUNNER_TEMP}/TalariaExport"
            echo "EXPORT_OPTIONS_PATH=${RUNNER_TEMP}/ExportOptions.plist"
          } >> "${GITHUB_ENV}"

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          marketing_version="${{ inputs.version }}"
          if [[ ! "${marketing_version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release version must use X.Y.Z numeric semantic versioning: ${marketing_version}" >&2
            exit 1
          fi
          echo "MARKETING_VERSION=${marketing_version}" >> "${GITHUB_ENV}"
          echo "Building version ${marketing_version} from ${{ inputs.ref }}."

      - name: Write App Store Connect key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          if [[ "${APP_STORE_CONNECT_PRIVATE_KEY}" == *"\\n"* ]]; then
            printf "%s" "${APP_STORE_CONNECT_PRIVATE_KEY}" | perl -pe 's/\\n/\n/g' > "${key_path}"
          else
            printf "%s" "${APP_STORE_CONNECT_PRIVATE_KEY}" > "${key_path}"
          fi
          chmod 600 "${key_path}"
          echo "APP_STORE_CONNECT_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - name: Select App Store Connect build number
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUNDLE_ID: dev.kil.talaria
          ENFORCE_OPEN_TRAIN: "1"
        run: |
          set -euo pipefail
          build_number="$(REQUESTED_BUILD_NUMBER='' ruby ci/select_testflight_build_number.rb)"
          echo "BUILD_NUMBER=${build_number}" >> "${GITHUB_ENV}"
          echo "Building ${MARKETING_VERSION} (${build_number}) from ${{ inputs.ref }}."

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Stamp the selected release identity
        working-directory: .
        env:
          RELEASE_SOURCE: ${{ inputs.ref }}
        run: |
          "$RELEASE_PYTHON" scripts/stamp-release.py app --version "$MARKETING_VERSION" --build-number "$BUILD_NUMBER" --source-revision "$RELEASE_SOURCE"

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -disableAutomaticPackageResolution

      - name: Install Apple signing intermediates
        run: |
          for certificate in \
            /Applications/Xcode.app/Contents/SharedFrameworks/DVTFoundation.framework/Versions/A/Resources/AppleWWDRCA-2030.cer \
            /Applications/Xcode.app/Contents/SharedFrameworks/DVTFoundation.framework/Versions/A/Resources/AppleWWDRCAG6.cer
          do
            if [[ -f "${certificate}" ]]; then
              security import "${certificate}" -k ~/Library/Keychains/login.keychain-db -T /usr/bin/codesign || true
            fi
          done

      - name: Import iOS distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Download app provisioning profile
        id: app-profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: dev.kil.talaria
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Download share extension provisioning profile
        id: share-profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: dev.kil.talaria.shareextension
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Download Live Activity provisioning profile
        id: live-activity-profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: dev.kil.talaria.liveactivitywidget
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

      - name: Verify provisioning profiles
        env:
          APP_PROFILES_JSON: ${{ steps.app-profile.outputs.profiles }}
          SHARE_PROFILES_JSON: ${{ steps.share-profile.outputs.profiles }}
          LIVE_ACTIVITY_PROFILES_JSON: ${{ steps.live-activity-profile.outputs.profiles }}
        run: |
          set -euo pipefail
          app_profile="$(jq -er 'map(select(.type == "IOS_APP_STORE")) | first | .name' <<< "${APP_PROFILES_JSON}")"
          share_profile="$(jq -er 'map(select(.type == "IOS_APP_STORE")) | first | .name' <<< "${SHARE_PROFILES_JSON}")"
          live_activity_profile="$(jq -er 'map(select(.type == "IOS_APP_STORE")) | first | .name' <<< "${LIVE_ACTIVITY_PROFILES_JSON}")"
          {
            echo "TALARIA_APP_PROVISIONING_PROFILE_SPECIFIER=${app_profile}"
            echo "TALARIA_SHARE_PROVISIONING_PROFILE_SPECIFIER=${share_profile}"
            echo "TALARIA_LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER=${live_activity_profile}"
          } >> "${GITHUB_ENV}"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${ARCHIVE_PATH}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -disableAutomaticPackageResolution \
            DEVELOPMENT_TEAM="${TEAM_ID}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            TALARIA_APP_PROVISIONING_PROFILE_SPECIFIER="${TALARIA_APP_PROVISIONING_PROFILE_SPECIFIER}" \
            TALARIA_SHARE_PROVISIONING_PROFILE_SPECIFIER="${TALARIA_SHARE_PROVISIONING_PROFILE_SPECIFIER}" \
            TALARIA_LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER="${TALARIA_LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER}" \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}"

      - name: Verify archive versions
        run: ci/verify_bundle_versions "${ARCHIVE_PATH}/Products/Applications/Talaria.app" "${MARKETING_VERSION}" "${BUILD_NUMBER}"

      - name: Write export options
        run: |
          cat > "${EXPORT_OPTIONS_PATH}" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.kil.talaria</key>
              <string>${TALARIA_APP_PROVISIONING_PROFILE_SPECIFIER}</string>
              <key>dev.kil.talaria.shareextension</key>
              <string>${TALARIA_SHARE_PROVISIONING_PROFILE_SPECIFIER}</string>
              <key>dev.kil.talaria.liveactivitywidget</key>
              <string>${TALARIA_LIVE_ACTIVITY_PROVISIONING_PROFILE_SPECIFIER}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportPath "${EXPORT_PATH}" \
            -exportOptionsPlist "${EXPORT_OPTIONS_PATH}"


      - name: Record the verified signed build
        working-directory: .
        run: |
          "$RELEASE_PYTHON" releases/publish.py build-app-receipt --plan "$RUNNER_TEMP/release-plan/plan.json" \
            --directory "$EXPORT_PATH" --build-number "$BUILD_NUMBER" --output "$RUNNER_TEMP/app-build/receipt.json"

      - name: Store verified signed artifacts locally
        id: store
        working-directory: .
        run: |
          "$RELEASE_PYTHON" releases/artifacts.py put app-build "$RUNNER_TEMP/app-build" ios-ipa "$EXPORT_PATH" ios-dsyms "$ARCHIVE_PATH/dSYMs"

      - name: Remove App Store Connect key
        if: always()
        run: |
          if [[ -n "${APP_STORE_CONNECT_KEY_PATH:-}" ]]; then
            rm -f "${APP_STORE_CONNECT_KEY_PATH}"
          fi
