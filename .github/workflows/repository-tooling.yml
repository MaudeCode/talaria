name: Repository Tooling

on:
  workflow_call:
    inputs:
      full:
        description: Run tooling tests in addition to required release metadata validation.
        required: false
        type: boolean
        default: true
      ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      full:
        description: Run tooling tests in addition to required release metadata validation.
        required: false
        type: boolean
        default: true
      ref:
        description: Optional branch, tag, or commit to validate.
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  tooling:
    name: Repository Tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          # History without historical blobs; git fetches old file contents on demand (TAL-317).
          filter: blob:none

      - name: Install zsh for the App script checks
        if: inputs.full
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zsh

      - name: Set up Ruby
        if: inputs.full
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"

      - name: Install actionlint
        if: inputs.full
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" actionlint
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Set up Node for the simulator protocol tests
        if: inputs.full
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc

      - name: Test repository tooling
        if: inputs.full
        run: ../scripts/check tooling

      # Always runs: an image added under any path would not select the tooling suite (TAL-390).
      - name: Reject committed images outside the asset locations
        run: python3 ../scripts/check-committed-images.py

      - name: Validate release fragments
        env:
          CHANGE_BASE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          options=()
          diff_options=()
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # The event's base SHA can lag main; HEAD is GitHub's merged test tree.
            base=$(git merge-base "refs/remotes/origin/${PR_BASE_REF}" "${PR_HEAD}")
            options=(--base "$base" --target "${PR_HEAD}")
            diff_options=(--base "$base" --head "${PR_HEAD}")
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" && -n "${CHANGE_BASE}" && ! "${CHANGE_BASE}" =~ ^0+$ ]]; then
            options=(--base "${CHANGE_BASE}")
            diff_options=(--base "${CHANGE_BASE}" --head HEAD)
          fi
          python3 ci/release_notes.py validate "${options[@]}"
          python3 ../scripts/changed-components.py --check-diff "${diff_options[@]}"

      - name: Validate property lists
        if: inputs.full
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from plistlib import load

          for path in Path(".").rglob("*.plist"):
              if ".git" not in path.parts:
                  with path.open("rb") as stream:
                      load(stream)
          PY

      - name: Check script syntax
        if: inputs.full
        run: |
          set -euo pipefail
          bash -n ci/background ci/background_test.sh ci/build-for-testing ci/package-coverage ci/gh-api-poll ci/wait-for-job ci/wait_for_job_test.sh ci/report-test-failures ci/report_test_failures_test.sh ci/require_successful_main_ci ci/require_successful_main_ci_test.sh ci/find-hosted-tests-run ci/find_hosted_tests_run_test.sh ci/test_assertions.sh ci/validate_release_tag ci/validate_release_tag_test.sh scripts/check-swift-file-sizes scripts/webui-json
          zsh -n ci/verify_bundle_versions scripts/run-ios scripts/run-ios-device scripts/ios-simulator-pool scripts/prepare-ui-simulator scripts/ready-simulator-notifications scripts/ready-simulator-documents scripts/select-ios-simulator scripts/setup-ios-test-pool scripts/test-ios scripts/test-test-ios scripts/validate-upstream-contract
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" python3 -m py_compile ci/release_notes.py ci/release_notes_test.py ci/hosted-test-shard ci/hosted_test_shard_test.py scripts/select-ios-device scripts/test-ios-device-selection scripts/test-run-ios-device scripts/test-ios-simulator-pool ci/load_env_test.py scripts/load-env scripts/upstream-contract-probe scripts/report-performance-metrics scripts/test-validate-upstream-contract scripts/test-fuzz-seed-journal ../scripts/critical-markdown-check.py ../scripts/check-agent-compatibility.py ../scripts/stamp-release.py ../scripts/test-stamp-release.py
          for file in ci/*.rb; do ruby -c "${file}"; done
