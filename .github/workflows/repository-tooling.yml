name: Repository Tooling

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag, or commit to validate.
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  tooling:
    name: Repository Tooling
    runs-on: ["ghar-set-maudecode"]
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Prepare tooling runtime
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/hostedtoolcache
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" actionlint
          ./actionlint -config-file ../.github/actionlint.yaml ../.github/workflows/*.yml

      - name: Test repository tooling
        run: |
          python3 ../scripts/rehearse-monorepo.py --verify-only
          python3 ../scripts/changed-components.py --self-test
          python3 ../scripts/test-monorepo-import.py
          python3 ci/release_notes_test.py
          python3 ci/load_env_test.py
          python3 scripts/test-ios-device-selection
          ruby ci/select_testflight_build_number_test.rb
          ruby ci/test_ios_runner_test.rb
          ci/require_successful_main_ci_test.sh
          ci/validate_release_tag_test.sh

      - name: Validate release fragments
        env:
          CHANGE_BASE: ${{ github.event.before }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          options=()
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            # The event's base SHA can lag main; HEAD is GitHub's merged test tree.
            options=(--base "$(git merge-base "refs/remotes/origin/${PR_BASE_REF}" "${PR_HEAD}")" --target "${PR_HEAD}")
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            options=(--base "${CHANGE_BASE}")
          fi
          python3 ci/release_notes.py validate "${options[@]}"

      - name: Validate property lists
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from plistlib import load

          for path in Path(".").rglob("*.plist"):
              if ".git" not in path.parts:
                  with path.open("rb") as stream:
                      load(stream)
          PY

      - name: Check script syntax
        run: |
          set -euo pipefail
          bash -n ci/require_successful_main_ci ci/require_successful_main_ci_test.sh ci/validate_release_tag ci/validate_release_tag_test.sh scripts/check-swift-file-sizes scripts/webui-json
          zsh -n ci/verify_bundle_versions scripts/assert-no-skipped-ui-tests scripts/run-ios scripts/run-ios-device scripts/ios-simulator-pool scripts/select-ios-simulator scripts/setup-ios-test-pool scripts/test-ios scripts/test-test-ios scripts/validate-upstream-contract
          PYTHONPYCACHEPREFIX="${RUNNER_TEMP}/pycache" python3 -m py_compile ci/release_notes.py ci/release_notes_test.py scripts/select-ios-device scripts/test-ios-device-selection scripts/test-ios-simulator-pool ci/load_env_test.py scripts/load-env scripts/upstream-contract-probe scripts/upstream-watch scripts/verify_kanban_reference_server.py
          for file in ci/*.rb; do ruby -c "${file}"; done
