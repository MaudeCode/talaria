# Pull requests and main pushes run suites selected by the complete changed-path diff; a main push's diff starts at the
# last main run that completed, because a newer push cancels the run it supersedes (TAL-2461). App changes run
# the TalariaKit package tests with `swift test` and build the App, its extensions and test bundle for
# testing. Main pushes, manual runs and pull requests labelled hosted-tests also run the simulator-hosted
# unit tests (TalariaTests) in up to four simulator jobs split by class (TAL-1896); a failure on main reaches the repair
# handoff (docs/main-ci-repair.md). A pull request or a main push runs only the App tests its diff reaches (TAL-2390,
# TAL-2544): the router's App test plan narrows each target to explicit identifiers, or leaves it out, and anything it
# cannot bound runs that target in full. A pull request's explicit hosted identifiers run without the label; a full
# hosted target still needs it. The test methods a pull request adds or changes also run repeatedly within a time
# budget, whatever the label (TAL-2402); a main push runs each planned test once. A main push with no completed earlier
# run, and every manual run, run both targets in full. GitHub Scheduler dispatches that full run on main daily, ahead
# of Nightly, and a release reuses its hosted tests on that commit. `gh workflow run ci.yml --ref <branch>` is the
# one-command full run for a branch. A pull request also gets a Playwright plan (TAL-2391): no browser job when only Vitest tests
# changed, only the changed spec files when they are all it touches, and every shard otherwise. No labeled trigger: a label event would start a run that cancels the PR's running
# one through the concurrency group, so a label added after a run started takes effect on the next push.
# Release metadata always validates; uncertain classification runs every suite.
# The always-reporting CI Gate is the required check, including skipped jobs. On a pull request, the advisory "Report the
# first failure" job keeps one PR comment on each failure as soon as it is known (TAL-2395).
#
# Every job runs on GitHub-hosted runners and uses no repository secrets (TAL-380) except the main-only failure
# handoff to T3 (TAL-1103); handoffs between jobs are Actions artifacts. Only Xcode work runs on hosted macOS: the App build, its hosted unit tests and the
# TalariaKit package tests (app-tests.yml). A manual run exercises every suite.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request's initial attempts share its group, so a newer head cancels superseded work; main's initial push runs
# share one too, so a newer merge cancels the run it supersedes (TAL-2461), whose changes the newer run then tests. A
# retry keeps its old head's or push's event, so it, like a manual run, gets its own run's group and cancels nothing
# (TAL-1656).
concurrency:
  group: ${{ github.run_attempt == 1 && (github.event_name == 'pull_request' && format('ci-{0}', github.event.pull_request.number) || github.event_name == 'push' && format('ci-{0}', github.ref)) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # A main push reads main's earlier CI runs to find the last one that completed.
      actions: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      app_tooling: ${{ steps.filter.outputs.app_tooling }}
      web_server: ${{ steps.filter.outputs.web_server }}
      web_frontend: ${{ steps.filter.outputs.web_frontend }}
      web_sidecar: ${{ steps.filter.outputs.web_sidecar }}
      docker: ${{ steps.filter.outputs.docker }}
      relay: ${{ steps.filter.outputs.relay }}
      contracts: ${{ steps.filter.outputs.contracts }}
      tooling: ${{ steps.filter.outputs.tooling }}
      # The App test plan of a pull request or a main push with a tested base: each target's lane (full, explicit or
      # empty) and the plan itself. Empty on other runs, which run both targets in full.
      app_package: ${{ steps.filter.outputs.app_package }}
      app_hosted: ${{ steps.filter.outputs.app_hosted }}
      app_hosted_repeat: ${{ steps.filter.outputs.app_hosted_repeat }}
      app_plan: ${{ steps.filter.outputs.app_plan }}
      # A pull request's Playwright plan: none, specs (web_browser_specs) or full. Empty on other events, which run every
      # shard.
      web_browser: ${{ steps.filter.outputs.web_browser }}
      web_browser_specs: ${{ steps.filter.outputs.web_browser_specs }}
    steps:
      # Classification needs history and trees for the merge-base and diff, not every historical blob;
      # git fetches the few file contents it compares on demand (TAL-317).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts
      # The App test plan of a pull request or main push reads the tested checkout's Swift sources, project and ownership
      # map, and a pull request's browser plan the frontend package's imports; git fetches their blobs in one batch.
      - name: Check out the App test sources and the frontend package
        if: github.event_name != 'workflow_dispatch'
        working-directory: .
        run: git sparse-checkout set --no-cone '/scripts/' '/app/**/*.swift' '/app/Talaria.xcodeproj/project.pbxproj' '/app/ci/test-ownership.json' '/web/packages/frontend/'
      - name: Classify changed files
        working-directory: .
        id: filter
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # A newer push cancels this run's predecessor, so a push tests every change since the last main run that
            # completed, not only its own; without one, every suite (TAL-2461). The notice records the range for the
            # failure handoff's repair brief. The App runs only the tests that range reaches, as a pull request does,
            # once each: the pull requests already repeated the ones they added or changed. The scheduled full run on
            # main runs the rest (TAL-2544).
            base=$(python3 scripts/main-ci-failure.py base) || base=""
            if [[ -n "$base" ]]; then
              echo "::notice title=Tested range::since $base"
              python3 scripts/changed-components.py --base="$base" --head="$GITHUB_SHA" --app-plan --no-repeat --tested-worktree \
                >> "$GITHUB_OUTPUT" 2> >(tee -a "$GITHUB_STEP_SUMMARY" >&2)
            else
              echo "::notice title=Tested range::every suite"
              python3 scripts/changed-components.py >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # A manual run proves the whole pipeline: every suite runs. GitHub Scheduler dispatches one on main daily, the
            # App's full suite (TAL-2544).
            python3 scripts/changed-components.py >> "$GITHUB_OUTPUT"
          else
            # Event base.sha can predate a merged parent PR. Checkout fetched
            # the current base branch, as release-fragment validation also uses.
            # The App test and browser plans read this checkout, the merge commit the jobs test, and explain themselves
            # in the summary.
            python3 scripts/changed-components.py --base="refs/remotes/origin/${PR_BASE_REF}" --head="$PR_HEAD" --merge-base \
              --app-plan --browser-plan --tested-worktree >> "$GITHUB_OUTPUT" 2> >(tee -a "$GITHUB_STEP_SUMMARY" >&2)
          fi

  app-tooling:
    name: App tooling
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app_tooling != 'false') }}
    # macOS for shlock and lockf, not Xcode: the simulator tooling tests fake xcrun and xcodebuild.
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bash
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: Check App UI rules
        working-directory: .
        run: node scripts/check-ui-rules.mjs --config app/ci/ui-rules.json
      - name: Check string catalogs and test their checker
        run: |
          ci/check-string-catalogs
          python3 ci/check_string_catalogs_test.py
      - name: Test local XCTest admission and synthetic simulator leases
        run: |
          scripts/test-test-ios 20
          scripts/test-ios-simulator-pool
          scripts/test-benchmark-display-phases

  app:
    name: App
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app != 'false' || needs.changes.outputs.contracts != 'false') }}
    permissions:
      contents: read
      actions: read
      # app-tests.yml's test job posts failing tests as commit statuses (TAL-673).
      statuses: write
    uses: ./.github/workflows/app-tests.yml
    with:
      # Simulators for a full run, the label, explicit hosted identifiers or hosted repeats (TAL-2402).
      mode: ${{ (needs.changes.result != 'success' || needs.changes.outputs.app != 'false') && ((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'hosted-tests') || needs.changes.outputs.app_hosted == 'explicit' || needs.changes.outputs.app_hosted_repeat == 'true') && needs.changes.outputs.app_hosted != 'empty' && 'hosted' || 'build') || 'contracts' }}
      contracts: ${{ needs.changes.result != 'success' || needs.changes.outputs.contracts != 'false' }}
      # The package tests run unless the plan left them out; package_lane says whether all of them.
      package_tests: ${{ needs.changes.result != 'success' || needs.changes.outputs.app_package != 'empty' }}
      package_lane: ${{ needs.changes.result == 'success' && needs.changes.outputs.app_package || 'full' }}
      # An unlabelled pull request's full hosted target runs only its repeats.
      hosted_lane: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'hosted-tests') && needs.changes.outputs.app_hosted == 'full' && 'empty' || (needs.changes.result == 'success' && needs.changes.outputs.app_hosted || 'full') }}
      plan: ${{ needs.changes.result == 'success' && needs.changes.outputs.app_plan || '' }}

  tooling:
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/repository-tooling.yml
    with:
      full: ${{ needs.changes.result != 'success' || needs.changes.outputs.tooling != 'false' }}

  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web_server != 'false' || needs.changes.outputs.web_frontend != 'false' || needs.changes.outputs.web_sidecar != 'false') }}
    uses: ./.github/workflows/web-verify.yml
    with:
      server: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_server != 'false' }}
      frontend: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_frontend != 'false' }}
      # Pull requests run the sidecar matrix only for its own inputs. A main push with any server change runs it too, so
      # a transitive break in the server the recovery proof loads fails main and reaches the repair handoff (TAL-1161).
      sidecar: ${{ needs.changes.result != 'success' || needs.changes.outputs.web_sidecar != 'false' || (github.event_name == 'push' && needs.changes.outputs.web_server != 'false') }}
      # Every shard unless a pull request's plan narrowed it.
      browser: ${{ needs.changes.result == 'success' && needs.changes.outputs.web_browser || 'full' }}
      browser_specs: ${{ needs.changes.result == 'success' && needs.changes.outputs.web_browser_specs || '[]' }}

  web-docker:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docker != 'false') }}
    uses: ./.github/workflows/web-docker-smoke.yml

  relay:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relay != 'false') }}
    uses: ./.github/workflows/relay-verify.yml

  contracts:
    name: Web contract probe
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.contracts != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node for the disposable Web server
        uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Probe local Web HTTP and SSE contracts and record the live responses
        run: scripts/validate-upstream-contract --server-only --responses-output "$RUNNER_TEMP/contract-fixture/live-responses.json"
      - uses: ./.github/actions/release-python
      # A release checks the App against each retained Web release too: that Web's live responses, recorded by its own
      # harness, and its session fixture. Record them here so an App that newly needs more fails the pull request, not
      # the release (TAL-2345).
      - name: Probe each retained Web release with its own harness
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Assigned first: a failing command substitution in a for list would not stop the step.
          retained=$("$RELEASE_PYTHON" releases/cli.py retained-webs)
          # Harnesses from before TAL-2190 run under zsh.
          command -v zsh >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends zsh; }
          for sha in $retained; do
            # A ref, not FETCH_HEAD: the probe's shared clone of this shallow checkout reaches the commit only through one.
            git fetch --quiet --depth=1 origin "+$sha:refs/heads/retained-web-$sha"
            "$RELEASE_PYTHON" scripts/check-previous-app.py --probe-only --web-ref "$sha" \
              --output "$RUNNER_TEMP/contract-fixture/retained/$sha"
          done
      # The App package tests start without waiting for this job. Before `swift test` they wait for it through the jobs
      # API, download this artifact and run the native live decoding test against each fixture in it.
      - name: Upload the live response fixtures
        uses: actions/upload-artifact@v7
        with:
          name: contract-fixture
          path: ${{ runner.temp }}/contract-fixture/
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  report:
    # A pull request's failure report (TAL-2395, docs/main-ci-repair.md): from the first failed job or App test on, one
    # PR comment names each failure with its tested commit, a local reproduction command and its evidence while the
    # other jobs still run. It polls this run's jobs and the App test reporters' commit statuses. Advisory: CI Gate does
    # not need it, so it never changes a suite's or the gate's result, and it dispatches nothing. It fails once it has
    # reported a failure, so "Re-run failed jobs" reruns it and the report follows the new attempt. A fork's pull
    # request gets a read-only token, so its report is this job's log and summary; only a same-repository pull request,
    # whose author can push here already, runs it with a token that can comment.
    name: Report the first failure
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Pull request runs have taken up to about 90 minutes; the gate's completion ends it sooner.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      # Reads cancelled jobs' annotations for a timeout, and failed browser tests' file and line.
      checks: read
      statuses: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Keep the failure report current
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/main-ci-failure.py watch

  gate:
    name: CI Gate
    needs: [changes, app, app-tooling, tooling, web, web-docker, relay, contracts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: Check selected suite results
        working-directory: .
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/changed-components.py --check-results
