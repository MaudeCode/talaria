# The full iOS unit and UI suite on GitHub-hosted runners: App build plus four simulator shards (the hosted unit
# tests, the launch smoke and every UI test) and the TalariaKit package tests (app-tests.yml, full mode). It is too
# long for every main push, so it runs nightly and on demand. A release calls app-tests.yml directly instead
# (TAL-417), so this workflow's concurrency never holds a release's suite.
#
# A manual run can scope and repeat the suite instead (TAL-401), for example 10 runs in a row of one flaky test:
#   gh workflow run ui-suite.yml --repo MaudeCode/talaria --ref <branch> \
#     -f only_testing="TalariaUITests/SettingsInfoRoutingUITests" -f test_iterations=10
# only_testing runs those identifiers in one shard; test_iterations above 1 stops at the first failing iteration.
#
# The run name records the tested commit (TAL-408): "UI suite on <commit>", or "UI suite (scoped) on <ref>" with
# only_testing. A release reuses a successful unscoped run named for its exact source commit instead of calling the
# suite again (app/ci/find-ui-suite-run), so keep this format in step with that script.

name: UI suite
run-name: ${{ inputs.only_testing && format('UI suite (scoped) on {0}', inputs.ref || github.sha) || format('UI suite on {0}', inputs.ref || github.sha) }}

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag or commit to test; defaults to the selected branch's head.
        type: string
        required: false
      only_testing:
        description: Optional space-separated test identifiers (Target/Class[/method]) to run in one shard instead of the suite.
        type: string
        required: false
      test_iterations:
        description: Runs of each selected test (a positive integer); above 1 stops at the first failure.
        type: string
        default: "1"

permissions:
  contents: read

# Nightly and dispatched suites run one at a time; the next waits (TAL-413). GitHub keeps one waiting run per group, so
# a third run replaces the waiting one: a replaced nightly just means a release runs the suite itself. A release's
# suite may overlap one: the shards queue only once their build holds a macOS runner (app-tests.yml), so overlapping
# suites cannot deadlock. A called workflow's concurrency left a release's jobs pending forever (TAL-417), so
# nothing calls this one.
concurrency:
  group: ui-suite
  cancel-in-progress: false

jobs:
  suite:
    name: UI suite
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/app-tests.yml
    with:
      mode: full
      ref: ${{ inputs.ref }}
      only_testing: ${{ inputs.only_testing }}
      # Strings end to end: schedule runs have no such input, so they pass "1".
      test_iterations: ${{ inputs.test_iterations || '1' }}
