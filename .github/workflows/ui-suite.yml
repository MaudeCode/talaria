# The full iOS unit and UI suite on GitHub-hosted runners: App build plus four simulator shards (the hosted unit
# tests, the launch smoke and every UI test) and the TalariaKit package tests (app-tests.yml, full mode). It is too
# long for every main push, so it runs nightly, on demand, and on main after every fifth App-changing merge since its
# last run (ci.yml's ui-suite-cadence, TAL-655). A failed run on main goes to the fix agent (the alert job). A
# release calls app-tests.yml directly instead (TAL-417), so this workflow's concurrency never holds a release's suite.
#
# A manual run can scope and repeat the suite instead (TAL-401), for example 10 runs in a row of one flaky test:
#   gh workflow run ui-suite.yml --repo MaudeCode/talaria --ref <branch> \
#     -f only_testing="TalariaUITests/SettingsInfoRoutingUITests" -f test_iterations=10
# only_testing runs those identifiers in one shard; test_iterations above 1 stops at the first failing iteration.
#
# The run name records the tested commit (TAL-408): "UI suite on <commit>", or "UI suite (scoped) on <ref>" with
# only_testing. A release reuses a successful unscoped run named for its source commit, or for an earlier main commit
# with no App changes since, instead of calling the suite again (app/ci/find-ui-suite-run), and the cadence counts
# from the newest one (app/ci/ui-suite-due), so keep this format in step with those scripts.

name: UI suite
run-name: ${{ inputs.only_testing && format('UI suite (scoped) on {0}', inputs.ref || github.sha) || format('UI suite on {0}', inputs.ref || github.sha) }}

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag or commit to test; defaults to the selected branch's head.
        type: string
        required: false
      only_testing:
        description: Optional space-separated test identifiers (Target/Class[/method]) to run in one shard instead of the suite.
        type: string
        required: false
      test_iterations:
        description: Runs of each selected test (a positive integer); above 1 stops at the first failure.
        type: string
        default: "1"

permissions:
  contents: read

# Nightly and dispatched suites run one at a time; the next waits (TAL-413). GitHub keeps one waiting run per group, so
# a third run replaces the waiting one: a replaced nightly just means a release runs the suite itself. A release's
# suite may overlap one: the shards queue only once their build holds a macOS runner (app-tests.yml), so overlapping
# suites cannot deadlock. A called workflow's concurrency left a release's jobs pending forever (TAL-417), so
# nothing calls this one.
concurrency:
  group: ui-suite
  cancel-in-progress: false

jobs:
  suite:
    name: UI suite
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/app-tests.yml
    with:
      mode: full
      ref: ${{ inputs.ref }}
      only_testing: ${{ inputs.only_testing }}
      # Strings end to end: schedule runs have no such input, so they pass "1".
      test_iterations: ${{ inputs.test_iterations || '1' }}

  alert:
    # Hands a failed, unscoped suite of main's head to the fix agent: one signed POST, which files or updates a ticket
    # and starts the fix (TAL-655). A job here, not a workflow_run workflow: CI dispatches this workflow with
    # GITHUB_TOKEN, and GitHub starts no workflow from that token's events (TAL-659). The receiver's URL and signing
    # secret are the UI_SUITE_WEBHOOK_URL and UI_SUITE_WEBHOOK_SECRET Actions secrets, which only this job reads. The
    # body is JSON with run_id, run_url, head_sha, display_title and failed_jobs, signed like a GitHub webhook
    # (x-hub-signature-256: sha256=<HMAC-SHA256 hex of the body>). A shard GitHub cancels at its timeout leaves the
    # suite cancelled rather than failed, so a cancelled suite alerts too when a job failed or timed out; one a person
    # cancelled has neither and sends nothing (TAL-670).
    name: Send the failure to the fix agent
    needs: suite
    if: >-
      always() && (needs.suite.result == 'failure' || needs.suite.result == 'cancelled')
      && github.ref == 'refs/heads/main' && !inputs.only_testing && (!inputs.ref || inputs.ref == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      # Reads the cancelled jobs' annotations for a timeout.
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: app/ci

      - name: Post the signed failure report
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.UI_SUITE_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.UI_SUITE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$WEBHOOK_URL" || -z "$WEBHOOK_SECRET" ]]; then
            echo "::error::Set the UI_SUITE_WEBHOOK_URL and UI_SUITE_WEBHOOK_SECRET Actions secrets."
            exit 1
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          failed_jobs=$(app/ci/ui-suite-failed-jobs "$GITHUB_RUN_ID")
          if [[ "$failed_jobs" == "[]" ]]; then
            echo "No job failed or timed out: the run was cancelled, so there is nothing to send."
            exit 0
          fi
          body=$(jq -nc --arg run_id "$GITHUB_RUN_ID" --arg run_url "$run_url" --arg head_sha "$GITHUB_SHA" \
            --arg display_title "UI suite on $GITHUB_SHA" --argjson failed_jobs "$failed_jobs" \
            '{run_id: $run_id, run_url: $run_url, head_sha: $head_sha, display_title: $display_title, failed_jobs: $failed_jobs}')
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | awk '{print $NF}')
          curl -fsS --retry 3 -o /dev/null -X POST "$WEBHOOK_URL" -H "content-type: application/json" \
            -H "x-hub-signature-256: sha256=$signature" --data-binary "$body"
          printf 'Sent %s to the fix agent.\n' "$run_url" | tee -a "$GITHUB_STEP_SUMMARY"
