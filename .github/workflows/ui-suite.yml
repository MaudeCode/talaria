# The full iOS unit and UI suite on GitHub-hosted runners: App build plus four shards (app-tests.yml, full
# mode). It is too long for every main push (about an hour of hosted test time), so it runs nightly, on
# demand, and as a release gate.
#
# Interface (stable; TAL-381's release graph calls it on the release commit):
#   uses: ./.github/workflows/ui-suite.yml   (the caller grants contents: read and actions: read)
#   with:
#     ref: <commit SHA>   # required for workflow_call
#   No outputs: the calling job's result is the suite's result. Its jobs are named "UI suite build" and
#   "UI suite tests (shard N)", and its build artifact is ui-suite-build.

name: UI suite

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag or commit to test; defaults to the selected branch's head.
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        description: Commit to test.
        type: string
        required: true

permissions:
  contents: read

jobs:
  suite:
    name: UI suite
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/app-tests.yml
    with:
      mode: full
      ref: ${{ inputs.ref }}
