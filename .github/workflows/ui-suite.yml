# The full iOS unit and UI suite on GitHub-hosted runners: App build plus four simulator shards (the hosted unit
# tests, the launch smoke and every UI test) and the TalariaKit package tests (app-tests.yml, full mode). Nothing
# gates on it and nothing schedules it: pull requests and releases run the hosted unit tests without the UI tests
# (TAL-877), and the UI tests move into in-process tests before this workflow goes (TAL-856, TAL-878). It runs only
# when dispatched by hand, for diagnosis.
#
# A manual run can scope and repeat the suite instead (TAL-401), for example 10 runs in a row of one flaky test:
#   gh workflow run ui-suite.yml --repo MaudeCode/talaria --ref <branch> \
#     -f only_testing="TalariaUITests/SettingsInfoRoutingUITests" -f test_iterations=10
# only_testing runs those identifiers in one shard; test_iterations above 1 stops at the first failing iteration.
#
# The run name records the tested commit (TAL-408): "UI suite on <commit>", or "UI suite (scoped) on <ref>" with
# only_testing, plus " (priority)" for a priority dispatch, which the queue reads.

name: UI suite
run-name: >-
  ${{ format('{0}{1}', inputs.only_testing && format('UI suite (scoped) on {0}', inputs.ref || github.sha)
  || format('UI suite on {0}', inputs.ref || github.sha), inputs.priority && ' (priority)' || '') }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional branch, tag or commit to test; defaults to the selected branch's head.
        type: string
        required: false
      only_testing:
        description: Optional space-separated test identifiers (Target/Class[/method]) to run in one shard instead of the suite.
        type: string
        required: false
      test_iterations:
        description: Runs of each selected test (a positive integer); above 1 stops at the first failure.
        type: string
        default: "1"
      priority:
        description: Queue ahead of ordinary branch runs, for a branch that fixes main's suite. Main's runs always are.
        type: boolean
        default: false

permissions:
  contents: read

# Suite runs take turns in the queue job (TAL-679) instead of a concurrency group, where GitHub keeps one waiting run
# and each new dispatch cancelled it. Priority runs (main's, and dispatches with priority) go ahead of other waiting
# runs; nothing is cancelled. Test shards queue for macOS runners only once their build holds one (app-tests.yml), so
# overlapping runs cannot deadlock.

jobs:
  queue:
    # Waits on Linux, holding no macOS runner, until this run's turn (app/ci/ui-suite-wait-turn reads this job's name).
    # Its attempt goes to the suite, whose macOS jobs refuse a "Re-run failed jobs" attempt that skipped it. A job runs
    # at most six hours, so near that the run dispatches the same suite again, which joins the queue, and fails.
    name: Queue
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    outputs:
      attempt: ${{ github.run_attempt }}
      requeued: ${{ steps.wait.outputs.requeued }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: app/ci
      - name: Wait for this run's turn
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          UI_SUITE_QUEUE_LIMIT_SECONDS: "20700"
          REF: ${{ inputs.ref }}
          ONLY_TESTING: ${{ inputs.only_testing }}
          TEST_ITERATIONS: ${{ inputs.test_iterations || '1' }}
          PRIORITY: ${{ inputs.priority || false }}
        run: |
          set -uo pipefail
          app/ci/ui-suite-wait-turn "$GITHUB_RUN_ID" && exit 0
          status=$?
          (( status == 20 )) || exit "$status"
          # A branch run keeps its commit. Main's tests main's head, which it alerts and counts for.
          [[ -n "$REF" || "$GITHUB_REF_NAME" == main ]] || REF=$GITHUB_SHA
          inputs=(-f test_iterations="$TEST_ITERATIONS" -f priority="$PRIORITY")
          [[ -z "$REF" ]] || inputs+=(-f ref="$REF")
          [[ -z "$ONLY_TESTING" ]] || inputs+=(-f only_testing="$ONLY_TESTING")
          gh workflow run ui-suite.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" "${inputs[@]}"
          echo "requeued=true" >> "$GITHUB_OUTPUT"
          echo "::error::Waited the queue's limit; dispatched the same suite again, which waits its turn."
          exit 1

  suite:
    name: UI suite
    needs: queue
    permissions:
      contents: read
      actions: read
      # app-tests.yml's test shards post failing tests as commit statuses (TAL-673).
      statuses: write
    uses: ./.github/workflows/app-tests.yml
    with:
      mode: full
      ref: ${{ inputs.ref }}
      only_testing: ${{ inputs.only_testing }}
      # Strings end to end; an empty input passes "1".
      test_iterations: ${{ inputs.test_iterations || '1' }}
      queue_attempt: ${{ needs.queue.outputs.attempt }}
