name: Relay feedback bridge image

# Checks only: the Relay release builds and publishes the versioned image (releases/README.md).
on:
  pull_request:
    paths:
      - relay/bridge/**
      - .github/workflows/relay-bridge-image.yml
  push:
    branches: [main]
    paths:
      - relay/bridge/**
      - .github/workflows/relay-bridge-image.yml

permissions:
  contents: read

jobs:
  image:
    name: Build feedback bridge image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/skopeo
      - name: Build, load and smoke-test the non-root image the release builds
        run: relay/bridge/build-image.sh talaria-feedback-bridge:check "$RUNNER_TEMP/bridge"
