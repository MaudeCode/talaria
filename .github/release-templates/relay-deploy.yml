name: Deploy production

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: talaria-relay-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ["ghar-set-maudecode"]
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag is released from main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec convex deploy --typecheck enable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Verify production relay readiness
        run: curl --fail --show-error --retry 6 --retry-all-errors --retry-delay 5 https://relay.talaria.kil.dev/v1/health
